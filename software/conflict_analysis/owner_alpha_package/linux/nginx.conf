daemon on;
master_process on;
pid /run/owner-alpha/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 32m;
    client_body_temp_path /run/owner-alpha/client;
    proxy_temp_path /run/owner-alpha/proxy;
    fastcgi_temp_path /run/owner-alpha/fastcgi;
    uwsgi_temp_path /run/owner-alpha/uwsgi;
    scgi_temp_path /run/owner-alpha/scgi;
    server {
        listen 127.0.0.1:__PORT__;
        server_name 127.0.0.1;
        location /static/ { alias /opt/owner-alpha/static/; }
        location / {
            proxy_pass http://unix:/run/owner-alpha/gunicorn.sock;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}

