[pytest]
DJANGO_SETTINGS_MODULE = conflict_analysis.settings
python_files = test_*.py tests.py
testpaths =
    conflict_analysis/tests
    calculation/tests
    domain/tests
    production_studio/tests
    production_player/tests
    player_integration/tests
    scenario_modeling/tests
addopts = -ra --strict-markers
norecursedirs = .artifacts staticfiles dist build
markers =
    postgres: requires a PostgreSQL database
