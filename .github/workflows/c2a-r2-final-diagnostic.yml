name: C2A R2 Final Diagnostic

on:
  push:
    branches:
      - agent/c2a-r2-final-diagnostic-ci-20260913

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: c2a-r2-final-diagnostic
  cancel-in-progress: false

jobs:
  exact-head-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: software/conflict_analysis
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      USE_SQLITE: "false"
      ACTIVE_SLICE: C2A
      SLICE_BASE_HEAD: 561ef5327bf655a558adb21c54d0fdf0559d7024
      SLICE_BASE_TREE: 5b209c782e1ac1a4783b01391dd59d813559ce57
      C2A_R1_HEAD: 22f0f173a941de88d6920b6e19821168e9b30cc8
      C2A_R1_TREE: f407e609adb2a8b94770b521a1302feb79281822
      FINAL_R2_HEAD: 937f24235684eeef7ce02bc2e1ccc83d22b14f2c
      FINAL_R2_TREE: 6ad7c8463988aab3b02e4f85aba50f370380c478
      C2A_CHROME_VERSION: 152.0.7977.64
      C2A_CHROME_LINUX64_SHA256: 8b592f066af71f054aab2cc80fc26f73c775c6d44ebb99d16ade924b24756c2e
      STUDIO_CDP_TIMEOUT_MS: "60000"

    steps:
      - name: Check out exact final R2 staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 937f24235684eeef7ce02bc2e1ccc83d22b14f2c

      - name: Prove exact final identity topology and accepted blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_R2_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_R2_TREE"
          test "$(git show -s --format=%P HEAD)" = "$C2A_R1_HEAD"
          test "$(git rev-parse "$C2A_R1_HEAD^{tree}")" = "$C2A_R1_TREE"
          test "$(git show -s --format=%P "$C2A_R1_HEAD")" = "$SLICE_BASE_HEAD"
          test "$(git rev-parse "$SLICE_BASE_HEAD^{tree}")" = "$SLICE_BASE_TREE"
          test "$(git rev-list --count "$C2A_R1_HEAD..HEAD")" = 1
          test "$(git rev-list --count "$SLICE_BASE_HEAD..HEAD")" = 2
          test -z "$(git rev-list --merges "$SLICE_BASE_HEAD..HEAD")"
          git diff --check "$C2A_R1_HEAD" HEAD
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/conflict-analysis.yml": "21c4b624d78f25670285f1699b67bd0d6e393f26",
              "software/conflict_analysis/README.md": "e0da5bcf5f24809f6ca788a1a8f6b0f0144bf1f3",
              "software/conflict_analysis/docs/adr/0009-production-studio-c-lifecycle-publication.md": "c0889c969db86b55af2613fe2f633cfa2123866a",
              "software/conflict_analysis/docs/production-studio-c-read-only-runtime.md": "f50dd1fbc0cf967ad658327f37cd0ea70eba6a8f",
              "software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs": "6ce3fededdae818d0b13b92ebc04bfff982e5162",
              "software/conflict_analysis/production_studio/browser_tests/lifecycle_publication.mjs": "e49e21dff75e93452b94f09fc32caa36d6800eee",
              "software/conflict_analysis/production_studio/static/production_studio/lifecycle_publication.js": "db98c5f86b907e239708b7a20719241e714afbb2",
              "software/conflict_analysis/production_studio/templates/production_studio/lifecycle_publication_definition.html": "a1e7e9f3fac0be61bbce6a2a4f6e8bb221f62101",
              "software/conflict_analysis/production_studio/tests/test_lifecycle_publication.py": "680f0a857f371162e2223623d441019269d1fede",
              "software/conflict_analysis/production_studio/tests/test_read_only_static_contracts.py": "4190bcc1871679a3b1e0a29f6991e3dc6876c912",
              "software/conflict_analysis/production_studio/views.py": "955e715cb083f7e4467836ace77281de30ef1d39",
              "software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py": "a24654637b3eaeedca4a55b9894abfc2296b90f5",
          }
          def out(*args):
              return subprocess.check_output(args, text=True).strip()
          rows = out("git", "diff", "--name-status", "22f0f173a941de88d6920b6e19821168e9b30cc8", "HEAD").splitlines()
          assert len(rows) == 12, rows
          assert {line.split("\t", 1)[0] for line in rows} == {"M"}, rows
          assert {line.split("\t", 1)[1] for line in rows} == set(expected), rows
          agg = out("git", "diff", "--name-status", "561ef5327bf655a558adb21c54d0fdf0559d7024", "HEAD").splitlines()
          statuses = [line.split("\t", 1)[0] for line in agg]
          assert len(agg) == 19 and statuses.count("A") == 9 and statuses.count("M") == 10, agg
          for path, sha in expected.items():
              entry = out("git", "ls-tree", "HEAD", "--", path)
              meta, got_path = entry.split("\t", 1)
              mode, kind, got_sha = meta.split()
              assert got_path == path and mode == "100644" and kind == "blob" and got_sha == sha, entry
          print("FINAL_R2_EXACT_TOPOLOGY_AND_12_BLOBS=PASS")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact application and test dependencies
        run: |
          python --version
          node --version
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check

      - name: Initialize exact same-run evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/successor-evidence"
          mkdir "$evidence"
          echo "SUCCESSOR_EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
          python - "$evidence/manifest.json" <<'PY'
          import json, os, pathlib
          payload = {
              "schema": "POST_F0L_SUCCESSOR_CI_EVIDENCE_V1",
              "active_slice": "C2A",
              "base_head": os.environ["SLICE_BASE_HEAD"],
              "base_tree": os.environ["SLICE_BASE_TREE"],
              "delivery_head": os.environ["FINAL_R2_HEAD"],
              "delivery_tree": os.environ["FINAL_R2_TREE"],
              "junit_files": [
                  "c2a-portable-postgresql.xml", "c2a-portable-sqlite.xml",
                  "c2a-foundation-postgresql.xml", "c2a-foundation-sqlite.xml",
                  "c2a-c0-postgresql.xml", "c2a-c0-sqlite.xml",
                  "c2a-c1-postgresql.xml", "c2a-c1-sqlite.xml",
                  "c2a-c1-chromium-postgresql.xml", "c2a-chromium-postgresql.xml",
                  "c2a-product-full-postgresql.xml", "c2a-product-full-sqlite.xml",
                  "c2a-chromium-full-postgresql.xml",
              ],
              "migration_evidence": "migration.json",
              "wheel_file": "conflict_analysis-0.1.0-py3-none-any.whl",
              "wheel_install_evidence": "wheel-install.json",
              "synthetic_tree_evidence": "synthetic-tree.json",
              "chromium_archive_version": os.environ["C2A_CHROME_VERSION"],
              "chromium_archive_sha256": os.environ["C2A_CHROME_LINUX64_SHA256"],
          }
          pathlib.Path(__import__('sys').argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print("C2A_SUCCESSOR_EVIDENCE_MANIFEST=PASS")
          PY

      - name: Static migration and verifier self-check gates
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q conflict_analysis domain production_studio
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check
          node --check production_studio/static/production_studio/lifecycle_publication.js
          node --check production_studio/browser_tests/lifecycle_publication.mjs
          node --check production_studio/static/production_studio/audited_draft.js
          node --unhandled-rejections=strict production_studio/browser_tests/audited_authoring.mjs --self-check-observation
          python scripts/verify_production_studio_c_allowlist.py --self-check
          base_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only "$SLICE_BASE_HEAD" -- software/conflict_analysis/domain/migrations)"
          delivery_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only HEAD -- software/conflict_analysis/domain/migrations)"
          test "$delivery_migrations" = "$base_migrations"

      - name: Portable and Foundation on PostgreSQL
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-portable-postgresql.xml"
          python -m pytest domain/tests --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-postgresql.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR/c2a-portable-postgresql.xml" "$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-postgresql.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          expected = (
              "test_route_auth_and_checksum_bound_claim_contract_are_exact",
              "test_initial_draft_uses_optional_preview_then_atomic_publication_without_prior_validate",
              "test_validation_unknown_outcome_allows_only_explicit_same_request_reconciliation",
              "test_fd07_never_labels_standalone_or_validated_initial_as_publishable_and_is_refetched_before_attempt",
              "test_successor_draft_validates_then_fd07_allows_only_exact_successor_publication",
              "test_publication_unknown_outcome_disables_post_and_uses_only_operation_recovery_get",
              "test_operation_identity_and_receipts_never_enter_browser_persistent_storage",
              "test_current_noncurrent_retired_and_unknown_lifecycle_states_render_truthfully",
              "test_typed_auth_scope_capability_csrf_stale_reuse_and_state_conflicts_are_bounded",
              "test_package_science_chat_document_prediction_and_recommendation_controls_remain_unavailable",
              "test_dirty_busy_unresolved_navigation_and_unload_are_guarded_without_automatic_mutation",
              "test_publication_requires_human_retained_recovery_ticket_and_busy_unload_is_guarded",
              "test_recovery_ticket_and_post_share_one_frozen_attempt_and_edits_require_new_operation",
          )
          def cases(path):
              root=ET.parse(path).getroot(); nodes=root.findall('.//testcase')
              assert not root.findall('.//failure') and not root.findall('.//error'), path
              return root,nodes
          r,p=cases(sys.argv[1]); r2,f=cases(sys.argv[2])
          assert tuple(x.attrib['name'] for x in p)==expected and len(p)==13 and not r.findall('.//skipped')
          assert len(f)==350 and not r2.findall('.//skipped')
          print('C2A_POSTGRESQL_13_AND_FOUNDATION_350=PASS')
          PY

      - name: Portable and Foundation on SQLite plus migration evidence
        env:
          USE_SQLITE: "true"
          SQLITE_PATH: ${{ runner.temp }}/c2a-foundation-sqlite.sqlite3
        shell: bash
        run: |
          set -euo pipefail
          python manage.py migrate --noinput
          python -m pytest production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-portable-sqlite.xml"
          python -m pytest domain/tests --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-sqlite.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR/c2a-portable-sqlite.xml" "$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-sqlite.xml" "$SUCCESSOR_EVIDENCE_DIR/migration.json" <<'PY'
          import json, os, pathlib, sys, xml.etree.ElementTree as ET
          def cases(path):
              root=ET.parse(path).getroot(); nodes=root.findall('.//testcase')
              assert not root.findall('.//failure') and not root.findall('.//error'), path
              return root,nodes
          r,p=cases(sys.argv[1]); r2,f=cases(sys.argv[2])
          assert len(p)==13 and not r.findall('.//skipped')
          assert len(f)==350
          assert sum(x.find('skipped') is None for x in f)==322
          assert sum(x.find('skipped') is not None for x in f)==28
          evidence={
              "schema":"POST_F0L_MIGRATION_EVIDENCE_V1","active_slice":"C2A",
              "base_head":os.environ["SLICE_BASE_HEAD"],"base_tree":os.environ["SLICE_BASE_TREE"],
              "delivery_head":os.environ["FINAL_R2_HEAD"],"delivery_tree":os.environ["FINAL_R2_TREE"],
              "gates":["compileall","django_check","makemigrations_check","postgresql_clean_migrate_0016","sqlite_clean_migrate_0016","migration_filenames_unchanged"],
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding='utf-8')
          print('C2A_SQLITE_13_FOUNDATION_322_28=PASS')
          PY

      - name: Build one exact wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir "$SUCCESSOR_EVIDENCE_DIR" .
          test -f "$SUCCESSOR_EVIDENCE_DIR/conflict_analysis-0.1.0-py3-none-any.whl"
          test "$(find "$SUCCESSOR_EVIDENCE_DIR" -maxdepth 1 -name '*.whl' -type f | wc -l)" = 1
          echo "STUDIO_C0_WHEEL=$SUCCESSOR_EVIDENCE_DIR/conflict_analysis-0.1.0-py3-none-any.whl" >> "$GITHUB_ENV"

      - name: C0 C1 and full Product on both databases
        shell: bash
        run: |
          set -euo pipefail
          c0="production_studio/tests/test_browser_contract.py production_studio/tests/test_claim_boundaries.py production_studio/tests/test_read_only_http.py production_studio/tests/test_read_only_static_contracts.py"
          c1="production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests"
          c2a="production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests"
          g7="production_player/tests/test_player_g7.py::ProductionPlayerG7Tests"
          g8="production_player/tests/test_player_g8.py::ProductionPlayerG8Tests"
          g9="production_player/tests/test_player_g9_evidence.py::ProductionPlayerG9EvidenceTests"
          python -m pytest $c0 --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c0-postgresql.xml"
          python -m pytest $c1 --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c1-postgresql.xml"
          USE_SQLITE=true SQLITE_PATH="$RUNNER_TEMP/c2a-c0c1.sqlite3" python -m pytest $c0 --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c0-sqlite.xml"
          USE_SQLITE=true SQLITE_PATH="$RUNNER_TEMP/c2a-c0c1.sqlite3" python -m pytest $c1 --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c1-sqlite.xml"
          STUDIO_C0_WHEEL="$STUDIO_C0_WHEEL" python -m pytest $c0 $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-product-full-postgresql.xml"
          USE_SQLITE=true SQLITE_PATH="$RUNNER_TEMP/c2a-product-full.sqlite3" STUDIO_C0_WHEEL="$STUDIO_C0_WHEEL" python -m pytest $c0 $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-product-full-sqlite.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          d=pathlib.Path(sys.argv[1])
          def n(name):
              root=ET.parse(d/name).getroot(); cases=root.findall('.//testcase')
              assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped'), name
              return len(cases)
          assert n('c2a-c0-postgresql.xml')==19 and n('c2a-c1-postgresql.xml')==8
          assert n('c2a-c0-sqlite.xml')==19 and n('c2a-c1-sqlite.xml')==8
          assert n('c2a-product-full-postgresql.xml')==68
          assert n('c2a-product-full-sqlite.xml')==68
          print('C2A_PRODUCT_68_BOTH_DATABASES=PASS')
          PY

      - name: Exact pinned real Chromium registries
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/c2a-chrome-for-testing-linux64.zip"
          curl --fail --location --silent --show-error --retry 0 "https://storage.googleapis.com/chrome-for-testing-public/$C2A_CHROME_VERSION/linux64/chrome-linux64.zip" --output "$archive"
          printf '%s  %s\n' "$C2A_CHROME_LINUX64_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/c2a-chrome"
          chrome="$RUNNER_TEMP/c2a-chrome/chrome-linux64/chrome"
          test -x "$chrome"
          "$chrome" --version | grep -F "$C2A_CHROME_VERSION"
          STUDIO_CHROME_BIN="$chrome" python -m pytest production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringBrowserTests::test_authenticated_edit_save_reload_is_bounded_foundation_only_and_receipted --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c1-chromium-postgresql.xml"
          STUDIO_CHROME_BIN="$chrome" python -m pytest production_studio/tests/test_lifecycle_publication.py -k 'test_chromium_draft_preview_atomic_initial_publish_recover_and_reload or test_chromium_successor_validate_publish_lost_response_recovery_and_predecessor_noncurrent' --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-chromium-postgresql.xml"
          STUDIO_CHROME_BIN="$chrome" python -m pytest \
            production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringBrowserTests::test_authenticated_edit_save_reload_is_bounded_foundation_only_and_receipted \
            production_player/tests/test_player_g7.py::ProductionPlayerG7ChromiumTests \
            production_player/tests/test_player_g8.py::ProductionPlayerG8ChromiumTests \
            production_player/tests/test_player_g9_evidence.py::ProductionPlayerG9ChromiumTests \
            production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationBrowserTests \
            -p no:cacheprovider --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-chromium-full-postgresql.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR" <<'PY'
          import pathlib,sys,xml.etree.ElementTree as ET
          d=pathlib.Path(sys.argv[1])
          def names(name):
              r=ET.parse(d/name).getroot(); c=r.findall('.//testcase')
              assert not r.findall('.//failure') and not r.findall('.//error') and not r.findall('.//skipped'), name
              return tuple(x.attrib['name'] for x in c)
          assert len(names('c2a-c1-chromium-postgresql.xml'))==1
          assert names('c2a-chromium-postgresql.xml')==(
              'test_chromium_draft_preview_atomic_initial_publish_recover_and_reload',
              'test_chromium_successor_validate_publish_lost_response_recovery_and_predecessor_noncurrent',
          )
          assert len(names('c2a-chromium-full-postgresql.xml'))==10
          print('C2A_CHROMIUM_1_2_10=PASS')
          PY

      - name: Inspect exact wheel in isolation and write evidence
        shell: bash
        run: |
          set -euo pipefail
          wheel="$STUDIO_C0_WHEEL"
          isolated="$RUNNER_TEMP/c2a-wheel-venv"
          python -m venv --system-site-packages "$isolated"
          "$isolated/bin/python" -m pip install --disable-pip-version-check --force-reinstall --no-deps "$wheel"
          (
            cd "$RUNNER_TEMP"
            "$isolated/bin/python" - "$wheel" "$SUCCESSOR_EVIDENCE_DIR/wheel-install.json" "$GITHUB_WORKSPACE/software/conflict_analysis" <<'PY'
          import hashlib, importlib, json, os, pathlib, sys
          from importlib.resources import files
          from zipfile import ZipFile
          wheel_path=pathlib.Path(sys.argv[1]).resolve(strict=True)
          evidence_path=pathlib.Path(sys.argv[2]); repo=pathlib.Path(sys.argv[3]).resolve(strict=True)
          venv=pathlib.Path(sys.prefix).resolve(strict=True)
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','conflict_analysis.settings')
          import django; django.setup()
          def installed(name):
              m=importlib.import_module(name); p=pathlib.Path(m.__file__).resolve(strict=True)
              assert p.is_relative_to(venv) and not p.is_relative_to(repo); return m
          with ZipFile(wheel_path) as z:
              members=set(z.namelist()); assert z.testzip() is None
          required={
              'production_studio/__init__.py','production_studio/lifecycle_claim_boundaries.py','production_studio/urls.py','production_studio/views.py',
              'production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json','production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json.sha256',
              'production_studio/templates/production_studio/lifecycle_publication_definition.html','production_studio/static/production_studio/lifecycle_publication.css','production_studio/static/production_studio/lifecycle_publication.js',
          }
          assert required <= members, sorted(required-members)
          installed('production_studio'); installed('production_studio.lifecycle_claim_boundaries'); installed('production_studio.urls'); installed('production_studio.views')
          root=files('production_studio'); contract=root.joinpath('contracts/lifecycle_publication_claim_boundaries_v1.ru.json'); digest=root.joinpath('contracts/lifecycle_publication_claim_boundaries_v1.ru.json.sha256')
          assert hashlib.sha256(contract.read_bytes()).hexdigest()==digest.read_text(encoding='utf-8').split()[0]
          evidence={
              'schema':'POST_F0L_WHEEL_INSTALL_EVIDENCE_V1','active_slice':'C2A',
              'base_head':os.environ['SLICE_BASE_HEAD'],'base_tree':os.environ['SLICE_BASE_TREE'],
              'delivery_head':os.environ['FINAL_R2_HEAD'],'delivery_tree':os.environ['FINAL_R2_TREE'],
              'wheel_sha256':hashlib.sha256(wheel_path.read_bytes()).hexdigest(),'source_tree_fallback':False,
              'checks':['wheel_built_exactly_once','isolated_install','production_studio_imported','lifecycle_claim_boundaries_imported','contract_payload_present','template_payload_present','static_payload_present','docs_repository_only'],
          }
          evidence_path.write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('C2A_ISOLATED_WHEEL=PASS')
          PY
          )

      - name: Prove synthetic tree equivalence
        shell: bash
        run: |
          set -euo pipefail
          delivery_head="$(git rev-parse HEAD)"
          delivery_tree="$(git rev-parse HEAD^{tree})"
          merge_base="$(git merge-base "$SLICE_BASE_HEAD" "$delivery_head")"
          test "$merge_base" = "$SLICE_BASE_HEAD"
          synthetic_tree="$(git merge-tree --write-tree "$SLICE_BASE_HEAD" "$delivery_head")"
          independent_tree="$(git merge-tree --write-tree "$merge_base" "$delivery_head")"
          test "$synthetic_tree" = "$delivery_tree"
          test "$independent_tree" = "$delivery_tree"
          python - "$SUCCESSOR_EVIDENCE_DIR/synthetic-tree.json" "$delivery_head" "$delivery_tree" "$synthetic_tree" "$independent_tree" <<'PY'
          import json, os, pathlib, sys
          evidence={
              'schema':'C2A_SYNTHETIC_TREE_EVIDENCE_V1','base_head':os.environ['SLICE_BASE_HEAD'],
              'delivery_head':sys.argv[2],'parents':[os.environ['SLICE_BASE_HEAD'],sys.argv[2]],
              'delivery_tree':sys.argv[3],'synthetic_tree':sys.argv[4],'independent_tree':sys.argv[5],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('C2A_SYNTHETIC_TREE_EQUALS_DELIVERY_TREE=PASS')
          PY

      - name: Require complete exact-head C2A evidence
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/post-f0l-successor-verifier.json"
          python scripts/verify_production_studio_c_allowlist.py \
            --slice C2A --base-head "$SLICE_BASE_HEAD" --base-tree "$SLICE_BASE_TREE" \
            --successor-evidence-dir "$SUCCESSOR_EVIDENCE_DIR" --repo "$GITHUB_WORKSPACE" | tee "$report"
          python - "$report" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['allowlist_result']=='PASS' and r['active_slice']=='C2A'
          assert r['successor_ci_evidence']['schema']=='POST_F0L_SUCCESSOR_CI_EVIDENCE_V1'
          print('C2A_FINAL_EXACT_HEAD_VERIFIER=PASS')
          PY
          cp "$report" "$SUCCESSOR_EVIDENCE_DIR/post-f0l-successor-verifier.json"

      - name: Prove PR 94 remains immutable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/94" -o "$RUNNER_TEMP/pr94.json"
          python - "$RUNNER_TEMP/pr94.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['state']=='open' and p['draft'] is True and p['merged_at'] is None
          assert p['head']['sha']=='22f0f173a941de88d6920b6e19821168e9b30cc8'
          print('PR94_OPEN_DRAFT_UNMERGED_IMMUTABLE_R1=PASS')
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2a-r2-final-diagnostic-evidence
          path: ${{ runner.temp }}/successor-evidence
          if-no-files-found: warn
