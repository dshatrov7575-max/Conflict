name: C2A R2 validation repair

on:
  push:
    branches:
      - agent/c2a-r2-builder
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c2a-r2-validation-repair
  cancel-in-progress: true

jobs:
  repair-validator:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/c2a-r2-builder
          persist-credentials: true

      - name: Replace corrupt patch-envelope transport with immutable blob materialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/c2a-r2-full-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '      - name: Fetch, verify and apply exact candidate patch\n'
          end_marker = '      - name: Verify exact twelve-path staged inventory and blob identities\n'
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = '''      - name: Materialize exact candidate from immutable Git blob identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/c2a-r2-target-blobs.tsv"
          cat > "$manifest" <<'EOF'
          .github/workflows/conflict-analysis.yml	21c4b624d78f25670285f1699b67bd0d6e393f26
          software/conflict_analysis/README.md	e0da5bcf5f24809f6ca788a1a8f6b0f0144bf1f3
          software/conflict_analysis/docs/adr/0009-production-studio-c-lifecycle-publication.md	c0889c969db86b55af2613fe2f633cfa2123866a
          software/conflict_analysis/docs/production-studio-c-read-only-runtime.md	f50dd1fbc0cf967ad658327f37cd0ea70eba6a8f
          software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs	4e10f954441abf25ec5b5d60b1f310071f923d99
          software/conflict_analysis/production_studio/browser_tests/lifecycle_publication.mjs	11ccf3ce90b629f14443b96ee9020a8a4ee35a2e
          software/conflict_analysis/production_studio/static/production_studio/lifecycle_publication.js	12efd1dc9dc5fcb922be2844df1a716f4cb66f09
          software/conflict_analysis/production_studio/templates/production_studio/lifecycle_publication_definition.html	a1e7e9f3fac0be61bbce6a2a4f6e8bb221f62101
          software/conflict_analysis/production_studio/tests/test_lifecycle_publication.py	8b80117a10fe8ebc804e5eed33846e0f60b09cc3
          software/conflict_analysis/production_studio/tests/test_read_only_static_contracts.py	4190bcc1871679a3b1e0a29f6991e3dc6876c912
          software/conflict_analysis/production_studio/views.py	955e715cb083f7e4467836ace77281de30ef1d39
          software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py	7fc40292e4c478dbfd5afea271d0a23413f5f5ab
          EOF
          while IFS=$'\t' read -r path blob; do
            mkdir -p "$(dirname "$path")"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$path"
            test "$(git hash-object "$path")" = "$blob"
            test "$(git ls-files -s -- "$path" | awk '{print $1}')" = 100644
            git add -- "$path"
          done < "$manifest"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 12

'''
          updated = text[:start] + replacement + text[end:]
          if updated != text:
              workflow.write_text(updated, encoding='utf-8')
          PY

          if git diff --quiet -- .github/workflows/c2a-r2-full-validation.yml; then
            echo "VALIDATOR_REPAIR_ALREADY_APPLIED=true"
            exit 0
          fi
          git diff --check -- .github/workflows/c2a-r2-full-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c2a-r2-full-validation.yml
          git commit -m "ci: materialize C2A R2 candidate from immutable blobs"
          git push origin HEAD:refs/heads/agent/c2a-r2-builder
