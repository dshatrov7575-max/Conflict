name: C2A R2 validation repair

on:
  push:
    branches:
      - agent/c2a-r2-builder
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c2a-r2-validation-repair
  cancel-in-progress: true

jobs:
  repair-validator:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out builder branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/c2a-r2-builder
          persist-credentials: true

      - name: Replace corrupt patch transport with immutable blob materialization
        shell: bash
        run: |
          set -euo pipefail
          replacement_b64=''
          python - "$replacement_b64" <<'PY'
          import base64
          import sys
          from pathlib import Path
          workflow = Path('.github/workflows/c2a-r2-full-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '      - name: Fetch, verify and apply exact candidate patch\n'
          end_marker = '      - name: Verify exact twelve-path staged inventory and blob identities\n'
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = base64.b64decode(sys.argv[1]).decode('utf-8')
          workflow.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          if git diff --quiet -- .github/workflows/c2a-r2-full-validation.yml; then
            echo "VALIDATOR_REPAIR_ALREADY_APPLIED=true"
            exit 0
          fi
          git diff --check -- .github/workflows/c2a-r2-full-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c2a-r2-full-validation.yml
          git commit -m "ci: materialize C2A R2 candidate from immutable blobs"
          git push origin HEAD:refs/heads/agent/c2a-r2-builder
