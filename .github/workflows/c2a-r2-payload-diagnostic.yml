name: C2A R2 candidate payload diagnostic

on:
  push:
    branches:
      - agent/c2a-r2-builder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payload-diagnostic:
    runs-on: ubuntu-24.04
    env:
      R1_HEAD: 22f0f173a941de88d6920b6e19821168e9b30cc8
      R1_TREE: f407e609adb2a8b94770b521a1302feb79281822
      PATCH_SOURCE_COMMIT: fe54ac184bd654e9830b2cd6f1f35609fe51024e
      PATCH_TEXT_SHA256: b7c6f45c77881672c6f1fb024e3fa8c39601e1ce6d38eaeb875333b9d3711aa9
      PATCH_GZIP_SHA256: d6c79334d9066a7f68efb6ef0055f8e34d1c5847592cc0c4c7dc577b5951b641
      PATCH_BASE64_SHA256: 42f90f9476241d5d152c7e451edb0000549cd209803f4e97f7eac950b64c872d

    steps:
      - name: Check out builder history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose payload envelope without mutating candidate refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git_file="$RUNNER_TEMP/git-file.b64"
          payload_gz="$RUNNER_TEMP/payload.gz"
          payload_patch="$RUNNER_TEMP/payload.patch"

          git cat-file -e "$PATCH_SOURCE_COMMIT^{commit}"
          git show "$PATCH_SOURCE_COMMIT:.github/c2a-r2/full.patch.gz.b64" > "$git_file"

          python - "$git_file" "$payload_gz" <<'PY'
          import base64, hashlib, pathlib, sys
          src = pathlib.Path(sys.argv[1]).read_bytes()
          compact = b"".join(src.split())
          alphabet = set(b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          invalid = [(i, b) for i, b in enumerate(compact) if b not in alphabet]
          print(f"RAW_BYTES={len(src)}")
          print(f"COMPACT_BYTES={len(compact)}")
          print(f"COMPACT_MOD4={len(compact) % 4}")
          print(f"RAW_SHA256={hashlib.sha256(src).hexdigest()}")
          print(f"EXPECTED_RAW_SHA256={__import__('os').environ['PATCH_BASE64_SHA256']}")
          print(f"INVALID_CHAR_COUNT={len(invalid)}")
          if invalid:
              print("FIRST_INVALID=" + repr(invalid[:8]))
          padding = (-len(compact)) % 4
          padded = compact + (b"=" * padding)
          print(f"PADDING_ADDED={padding}")
          print(f"PADDED_SHA256={hashlib.sha256(padded).hexdigest()}")
          decoded = base64.b64decode(padded, validate=True)
          pathlib.Path(sys.argv[2]).write_bytes(decoded)
          print(f"DECODED_BYTES={len(decoded)}")
          print(f"DECODED_SHA256={hashlib.sha256(decoded).hexdigest()}")
          print(f"GZIP_MAGIC={decoded[:2].hex()}")
          PY

          gzip --test "$payload_gz"
          gzip --decompress --stdout "$payload_gz" > "$payload_patch"
          echo "PATCH_BYTES=$(wc -c < "$payload_patch")"
          echo "PATCH_SHA256=$(sha256sum "$payload_patch" | awk '{print $1}')"
          echo "EXPECTED_PATCH_SHA256=$PATCH_TEXT_SHA256"

          git checkout --detach "$R1_HEAD"
          test "$(git rev-parse HEAD)" = "$R1_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$R1_TREE"
          git apply --check "$payload_patch"
          echo "GIT_APPLY_CHECK=true"
