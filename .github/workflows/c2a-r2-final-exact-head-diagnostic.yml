# Diagnostic launcher only. The tested checkout is immutable final R2; GITHUB_SHA identifies this launcher.
name: C2A R2 final exact-head diagnostic 58919887
'on':
  push:
    branches:
    - codex/c2a-r2-exact-head-diagnostic-58919887
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: c2a-r2-exact-head-diagnostic-58919887-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  exact-head-acceptance:
    name: Exact 58919887 / Python 3.12 / Node 24 / PostgreSQL 18 / SQLite / Chrome 152
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis" --health-interval 5s --health-timeout
          5s --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: software/conflict_analysis
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_CONN_MAX_AGE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      C2A_R1_HEAD: 22f0f173a941de88d6920b6e19821168e9b30cc8
      C2A_R1_TREE: f407e609adb2a8b94770b521a1302feb79281822
      C2A_CHROME_VERSION: 152.0.7977.64
      C2A_CHROME_LINUX64_SHA256: 8b592f066af71f054aab2cc80fc26f73c775c6d44ebb99d16ade924b24756c2e
      USE_SQLITE: 'false'
      ACTIVE_SLICE: C2A
      SLICE_BASE_HEAD: 561ef5327bf655a558adb21c54d0fdf0559d7024
      SLICE_BASE_TREE: 5b209c782e1ac1a4783b01391dd59d813559ce57
      EXACT_FINAL_HEAD: 58919887c846015edd60bd2adc2714ad8f43e0db
      EXACT_FINAL_TREE: 6ad7c8463988aab3b02e4f85aba50f370380c478
    steps:
    - name: Check out literal final R2 SHA detached
      uses: actions/checkout@v4
      with:
        ref: 58919887c846015edd60bd2adc2714ad8f43e0db
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: software/conflict_analysis/pyproject.toml
    - name: Set up Node.js 24 for real caller harness
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Bind actual checkout identity, twelve blobs and exact topology
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/successor-evidence" "$RUNNER_TEMP/diagnostic-evidence"
        printf 'SUCCESSOR_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/successor-evidence" >> "$GITHUB_ENV"
        printf 'DIAGNOSTIC_EVIDENCE_DIR=%s\n' "$RUNNER_TEMP/diagnostic-evidence" >> "$GITHUB_ENV"
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        import runpy
        import subprocess

        repo = Path(os.environ['GITHUB_WORKSPACE'])
        def git(*args):
            return subprocess.check_output(['git', '-C', str(repo), *args], text=True).strip()
        head = git('rev-parse', 'HEAD')
        tree = git('rev-parse', 'HEAD^{tree}')
        parent = git('show', '-s', '--format=%P', 'HEAD')
        assert head == os.environ['EXACT_FINAL_HEAD'], head
        assert tree == os.environ['EXACT_FINAL_TREE'], tree
        assert parent == os.environ['C2A_R1_HEAD'], parent
        assert subprocess.run(['git', '-C', str(repo), 'symbolic-ref', '-q', 'HEAD']).returncode == 1
        assert not git('status', '--porcelain', '--untracked-files=no')
        git('diff', '--check', os.environ['C2A_R1_HEAD'], head)
        ledger = {'.github/workflows/conflict-analysis.yml': '21c4b624d78f25670285f1699b67bd0d6e393f26', 'software/conflict_analysis/README.md': 'e0da5bcf5f24809f6ca788a1a8f6b0f0144bf1f3', 'software/conflict_analysis/docs/adr/0009-production-studio-c-lifecycle-publication.md': 'c0889c969db86b55af2613fe2f633cfa2123866a', 'software/conflict_analysis/docs/production-studio-c-read-only-runtime.md': 'f50dd1fbc0cf967ad658327f37cd0ea70eba6a8f', 'software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs': '6ce3fededdae818d0b13b92ebc04bfff982e5162', 'software/conflict_analysis/production_studio/browser_tests/lifecycle_publication.mjs': 'e49e21dff75e93452b94f09fc32caa36d6800eee', 'software/conflict_analysis/production_studio/static/production_studio/lifecycle_publication.js': 'db98c5f86b907e239708b7a20719241e714afbb2', 'software/conflict_analysis/production_studio/templates/production_studio/lifecycle_publication_definition.html': 'a1e7e9f3fac0be61bbce6a2a4f6e8bb221f62101', 'software/conflict_analysis/production_studio/tests/test_lifecycle_publication.py': '680f0a857f371162e2223623d441019269d1fede', 'software/conflict_analysis/production_studio/tests/test_read_only_static_contracts.py': '4190bcc1871679a3b1e0a29f6991e3dc6876c912', 'software/conflict_analysis/production_studio/views.py': '955e715cb083f7e4467836ace77281de30ef1d39', 'software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py': 'a24654637b3eaeedca4a55b9894abfc2296b90f5'}
        inventory = []
        for path, blob in ledger.items():
            entry, actual_path = git('ls-tree', head, '--', path).split('\t')
            assert actual_path == path and entry.split() == ['100644', 'blob', blob], (path, entry)
            inventory.append({'path': path, 'mode': '100644', 'type': 'blob', 'blob': blob})
        namespace = runpy.run_path('scripts/verify_production_studio_c_allowlist.py')
        topology = namespace['_require_c2a_r2_repository_topology'](
            repo, base_head=os.environ['SLICE_BASE_HEAD'], base_tree=os.environ['SLICE_BASE_TREE'])
        report = {
            'schema': 'C2A_EXACT_HEAD_DIAGNOSTIC_V1',
            'delivery_head': head, 'delivery_tree': tree, 'sole_parent': parent,
            'workflow_commit': os.environ['GITHUB_SHA'],
            'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
            'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'replacement_ledger': inventory, 'topology': topology,
            'chromium_archive_version': os.environ['C2A_CHROME_VERSION'],
            'chromium_archive_sha256': os.environ['C2A_CHROME_LINUX64_SHA256'],
        }
        output = Path(os.environ['RUNNER_TEMP']) / 'diagnostic-evidence'
        (output / 'preflight.json').write_text(json.dumps(report, indent=2) + '\n')
        manifest = {
            'schema': 'POST_F0L_SUCCESSOR_CI_EVIDENCE_V1', 'active_slice': 'C2A',
            'base_head': os.environ['SLICE_BASE_HEAD'], 'base_tree': os.environ['SLICE_BASE_TREE'],
            'delivery_head': head, 'delivery_tree': tree,
            'junit_files': list(namespace['SUCCESSOR_JUNIT_FILES']['C2A']),
            'migration_evidence': 'migration.json',
            'wheel_file': 'conflict_analysis-0.1.0-py3-none-any.whl',
            'wheel_install_evidence': 'wheel-install.json',
            'synthetic_tree_evidence': 'synthetic-tree.json',
        }
        (Path(os.environ['RUNNER_TEMP']) / 'successor-evidence' / 'manifest.json').write_text(
            json.dumps(manifest, indent=2) + '\n')
        print(json.dumps(report, indent=2))
        print('EXACT_FINAL_HEAD_TREE_PARENT_12_BLOBS_TOPOLOGY=PASS')
        PY
    - name: Read PR94 and protected refs before acceptance
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        READBACK_PHASE: before
      run: |
        set -euo pipefail
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        import subprocess

        def api(route):
            return json.loads(subprocess.check_output(
                ['gh', 'api', 'repos/dshatrov7575-max/Conflict/' + route], text=True))
        pr = api('pulls/94')
        readback = {
            'number': pr['number'], 'state': pr['state'], 'draft': pr['draft'],
            'merged': pr['merged'], 'merged_at': pr['merged_at'],
            'head': pr['head']['sha'], 'base': pr['base']['sha'],
            'head_ref': pr['head']['ref'], 'base_ref': pr['base']['ref'],
        }
        expected = {
            'codex/c2a-r2-final-staging-20260913': os.environ['EXACT_FINAL_HEAD'],
            'codex/ca-suite-i1-production-studio-c2a-lifecycle-publication': os.environ['C2A_R1_HEAD'],
            'codex/ca-suite-i1-player-g9-evidence-ui': os.environ['SLICE_BASE_HEAD'],
            'agent/c2a-r2-workflow-recovery': 'a4a54737453459cd94147d03f24b90d6454853e4',
        }
        refs = {name: api('git/ref/heads/' + name)['object']['sha'] for name in expected}
        delivery_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        output = Path(os.environ['DIAGNOSTIC_EVIDENCE_DIR']) / ('protected-readback-' + os.environ['READBACK_PHASE'] + '.json')
        output.write_text(json.dumps({
            'delivery_head': delivery_head, 'pr94': readback, 'refs': refs,
            'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
        }, indent=2) + '\n')
        assert delivery_head == os.environ['EXACT_FINAL_HEAD'], delivery_head
        assert refs == expected, refs
        assert readback == {
            'number': 94, 'state': 'open', 'draft': True, 'merged': False, 'merged_at': None,
            'head': os.environ['C2A_R1_HEAD'], 'base': os.environ['SLICE_BASE_HEAD'],
            'head_ref': 'codex/ca-suite-i1-production-studio-c2a-lifecycle-publication',
            'base_ref': 'codex/ca-suite-i1-player-g9-evidence-ui',
        }, readback
        print(json.dumps({'pr94': readback, 'refs': refs}, indent=2))
        print('PR94_AND_PROTECTED_REFS_IMMUTABLE=PASS')
        PY
    - name: Verify Ubuntu, Python, Node, PostgreSQL and SQLite versions
      run: |
        set -euo pipefail
        source /etc/os-release
        test "$ID" = ubuntu && test "$VERSION_ID" = 24.04
        python -c 'import sys, sqlite3; assert sys.version_info[:2] == (3, 12); print(sys.version); print("SQLite", sqlite3.sqlite_version)'
        node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1); console.log(process.version)'
        server_version="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SHOW server_version_num')"
        test "$server_version" -ge 180000 && test "$server_version" -lt 190000
        printf 'PostgreSQL server_version_num=%s\n' "$server_version"
    - name: Install exact application and test dependencies
      run: |
        python -m pip install --disable-pip-version-check -e ".[dev]"
        python -m pip check
    - name: Compile verifier and run frozen positive and negative self-checks
      run: |
        set -euo pipefail
        python -c 'from pathlib import Path; p=Path("scripts/verify_production_studio_c_allowlist.py"); compile(p.read_bytes(), str(p), "exec"); print("VERIFIER_SYNTAX=PASS")'
        python scripts/verify_production_studio_c_allowlist.py --self-check | tee "$DIAGNOSTIC_EVIDENCE_DIR/verifier-self-check.json"
    - name: Run bounded C2A inherited Chromium reload-barrier self-checks
      shell: bash
      run: |
        set -euo pipefail
        node --unhandled-rejections=strict \
          production_studio/browser_tests/audited_authoring.mjs \
          --self-check-observation
        echo "C2A_AUDITED_AUTHORING_RELOAD_BARRIER_SELF_CHECK=PASS"
    - name: Check successor static contracts and clean PostgreSQL migrations
      shell: bash
      run: |
        set -euo pipefail
        python -m compileall -q conflict_analysis domain production_studio
        python manage.py makemigrations --check --dry-run
        python manage.py migrate --noinput
        python manage.py check

        if [[ "$ACTIVE_SLICE" = F1 ]]; then
          test -f domain/migrations/0017_multilingual_evidence_lineage.py
          test -f domain/services/document_lineage.py
          test -f domain/services/evidence_drilldown.py
          test -f domain/api/evidence.py
          test -f docs/adr/0012-multilingual-evidence-document-lineage.md
        else
          contract=production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json
          digest_file="${contract}.sha256"
          test -f production_studio/lifecycle_claim_boundaries.py
          test -f "$contract"
          test -f "$digest_file"
          test -f production_studio/templates/production_studio/lifecycle_publication_definition.html
          test -f production_studio/static/production_studio/lifecycle_publication.css
          test -f production_studio/static/production_studio/lifecycle_publication.js
          test -f production_studio/browser_tests/lifecycle_publication.mjs
          node --check production_studio/static/production_studio/lifecycle_publication.js
          node --check production_studio/browser_tests/lifecycle_publication.mjs
          node --check production_studio/static/production_studio/audited_draft.js
          read -r expected_digest _ < "$digest_file"
          actual_digest="$(sha256sum "$contract" | awk '{print $1}')"
          test "$actual_digest" = "$expected_digest"
          base_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only \
            "$SLICE_BASE_HEAD" -- software/conflict_analysis/domain/migrations)"
          delivery_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only \
            HEAD -- software/conflict_analysis/domain/migrations)"
          test "$delivery_migrations" = "$base_migrations"
        fi
        echo "${ACTIVE_SLICE}_STATIC_AND_POSTGRESQL_CLEAN_MIGRATION=PASS"
    - name: Run exact portable 13 and Foundation PostgreSQL registries
      env:
        HTTP_PROXY: http://127.0.0.1:9
        HTTPS_PROXY: http://127.0.0.1:9
        ALL_PROXY: http://127.0.0.1:9
        NO_PROXY: 127.0.0.1,localhost
      run: |
        set -euo pipefail
        python -m pytest \
          production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests \
          --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-portable-postgresql.xml"
        python -m pytest domain/tests \
          --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-postgresql.xml"
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        import runpy
        import subprocess

        namespace = runpy.run_path('scripts/verify_production_studio_c_allowlist.py')
        contracts = namespace['_successor_junit_contracts']('C2A')
        for name in ('c2a-portable-postgresql.xml', 'c2a-foundation-postgresql.xml'):
            result = namespace['_require_junit_contract'](
                label=name, source=(Path(os.environ['SUCCESSOR_EVIDENCE_DIR']) / name).read_text(),
                **contracts[name])
            print(name, json.dumps(result))
        print('C2A_POSTGRESQL_EXACT_REGISTRY_AND_TOTALS=PASS')
        PY
    - name: Run exact portable 13 and Foundation SQLite registries
      env:
        USE_SQLITE: 'true'
        SQLITE_PATH: ${{ runner.temp }}/successor-foundation-sqlite.sqlite3
      run: |
        set -euo pipefail
        python manage.py migrate --noinput
        python -m pytest \
          production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests \
          --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-portable-sqlite.xml"
        python -m pytest domain/tests \
          --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-sqlite.xml"
        python - <<'PY'
        import json
        import os
        from pathlib import Path
        import runpy
        import subprocess

        namespace = runpy.run_path('scripts/verify_production_studio_c_allowlist.py')
        contracts = namespace['_successor_junit_contracts']('C2A')
        for name in ('c2a-portable-sqlite.xml', 'c2a-foundation-sqlite.xml'):
            result = namespace['_require_junit_contract'](
                label=name, source=(Path(os.environ['SUCCESSOR_EVIDENCE_DIR']) / name).read_text(),
                **contracts[name])
            print(name, json.dumps(result))
        evidence = {
            'schema': 'POST_F0L_MIGRATION_EVIDENCE_V1', 'active_slice': 'C2A',
            'base_head': os.environ['SLICE_BASE_HEAD'], 'base_tree': os.environ['SLICE_BASE_TREE'],
            'delivery_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'delivery_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
            'gates': ['compileall', 'django_check', 'makemigrations_check',
                      'postgresql_clean_migrate_0016', 'sqlite_clean_migrate_0016',
                      'migration_filenames_unchanged'],
        }
        (Path(os.environ['SUCCESSOR_EVIDENCE_DIR']) / 'migration.json').write_text(
            json.dumps(evidence, indent=2) + '\n')
        print('C2A_SQLITE_EXACT_REGISTRY_AND_TOTALS=PASS')
        PY
    - name: Build one exact successor wheel for C0 runtime
      shell: bash
      run: |
        set -euo pipefail
        python -m pip wheel --no-deps --wheel-dir "$SUCCESSOR_EVIDENCE_DIR" .
        mapfile -t wheels < <(
          find "$SUCCESSOR_EVIDENCE_DIR" -maxdepth 1 -type f -name '*.whl' -print
        )
        test "${#wheels[@]}" -eq 1
        wheel="${wheels[0]}"
        test "$(basename "$wheel")" = conflict_analysis-0.1.0-py3-none-any.whl
        test "$wheel" = "$SUCCESSOR_EVIDENCE_DIR/conflict_analysis-0.1.0-py3-none-any.whl"
        printf 'STUDIO_C0_WHEEL=%s\n' "$wheel" >> "$GITHUB_ENV"
        echo "${ACTIVE_SLICE}_ONE_EXACT_SUCCESSOR_WHEEL_FOR_C0=PASS"
    - name: Run C0 and C1 successor regression on PostgreSQL
      env:
        HTTP_PROXY: http://127.0.0.1:9
        HTTPS_PROXY: http://127.0.0.1:9
        ALL_PROXY: http://127.0.0.1:9
        NO_PROXY: 127.0.0.1,localhost
      shell: bash
      run: |
        set -euo pipefail
        prefix="$(printf '%s' "$ACTIVE_SLICE" | tr '[:upper:]' '[:lower:]')"
        c0="$SUCCESSOR_EVIDENCE_DIR/${prefix}-c0-postgresql.xml"
        c1="$SUCCESSOR_EVIDENCE_DIR/${prefix}-c1-postgresql.xml"
        python -m pytest \
          production_studio/tests/test_browser_contract.py \
          production_studio/tests/test_claim_boundaries.py \
          production_studio/tests/test_read_only_http.py \
          production_studio/tests/test_read_only_static_contracts.py \
          --junitxml="$c0"
        python -m pytest \
          production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests \
          --junitxml="$c1"
        python - "$ACTIVE_SLICE" "$c0" "$c1" \
          "$SUCCESSOR_EVIDENCE_DIR/c2a-portable-postgresql.xml" <<'PY'
        import pathlib
        import sys
        import xml.etree.ElementTree as ET

        active_slice, c0_path, c1_path, c2a_path = sys.argv[1:]

        def passed_count(path):
            root = ET.parse(path).getroot()
            cases = root.findall(".//testcase")
            assert not root.findall(".//failure"), path
            assert not root.findall(".//error"), path
            assert not root.findall(".//skipped"), path
            return len(cases)

        c0_count = passed_count(c0_path)
        c1_count = passed_count(c1_path)
        assert (c0_count, c1_count) == (19, 8)
        if active_slice == "C2A":
            portable_count = passed_count(pathlib.Path(c2a_path))
            assert portable_count == 13
            assert c0_count + c1_count + portable_count == 40
        print(f"{active_slice}_POSTGRESQL_C0_19_C1_8_PRODUCT_TOTAL=PASS")
        PY
    - name: Run C0 and C1 successor regression on SQLite
      env:
        USE_SQLITE: 'true'
        SQLITE_PATH: ${{ runner.temp }}/successor-product-sqlite.sqlite3
      shell: bash
      run: |
        set -euo pipefail
        prefix="$(printf '%s' "$ACTIVE_SLICE" | tr '[:upper:]' '[:lower:]')"
        c0="$SUCCESSOR_EVIDENCE_DIR/${prefix}-c0-sqlite.xml"
        c1="$SUCCESSOR_EVIDENCE_DIR/${prefix}-c1-sqlite.xml"
        python -m pytest \
          production_studio/tests/test_browser_contract.py \
          production_studio/tests/test_claim_boundaries.py \
          production_studio/tests/test_read_only_http.py \
          production_studio/tests/test_read_only_static_contracts.py \
          --junitxml="$c0"
        python -m pytest \
          production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests \
          --junitxml="$c1"
        python - "$ACTIVE_SLICE" "$c0" "$c1" \
          "$SUCCESSOR_EVIDENCE_DIR/c2a-portable-sqlite.xml" <<'PY'
        import pathlib
        import sys
        import xml.etree.ElementTree as ET

        active_slice, c0_path, c1_path, c2a_path = sys.argv[1:]

        def passed_count(path):
            root = ET.parse(path).getroot()
            cases = root.findall(".//testcase")
            assert not root.findall(".//failure"), path
            assert not root.findall(".//error"), path
            assert not root.findall(".//skipped"), path
            return len(cases)

        c0_count = passed_count(c0_path)
        c1_count = passed_count(c1_path)
        assert (c0_count, c1_count) == (19, 8)
        if active_slice == "C2A":
            portable_count = passed_count(pathlib.Path(c2a_path))
            assert portable_count == 13
            assert c0_count + c1_count + portable_count == 40
        print(f"{active_slice}_SQLITE_C0_19_C1_8_PRODUCT_TOTAL=PASS")
        PY
    - name: Run exact inherited Product 55 and C2A Product 68 on both engines
      shell: bash
      run: |
        set -euo pipefail
        c0="production_studio/tests/test_browser_contract.py production_studio/tests/test_claim_boundaries.py production_studio/tests/test_read_only_http.py production_studio/tests/test_read_only_static_contracts.py"
        c1="production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests"
        c2a="production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests"
        g7="production_player/tests/test_player_g7.py::ProductionPlayerG7Tests"
        g8="production_player/tests/test_player_g8.py::ProductionPlayerG8Tests"
        g9="production_player/tests/test_player_g9_evidence.py::ProductionPlayerG9EvidenceTests"
        STUDIO_C0_WHEEL="$STUDIO_C0_WHEEL" python -m pytest \
          $c0 $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider \
          --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-product-full-postgresql.xml"
        USE_SQLITE=true \
          SQLITE_PATH="$RUNNER_TEMP/c2a-product-full.sqlite3" \
          STUDIO_C0_WHEEL="$STUDIO_C0_WHEEL" python -m pytest \
          $c0 $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider \
          --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-product-full-sqlite.xml"
