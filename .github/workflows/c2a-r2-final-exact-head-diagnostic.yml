    - name: Inspect the same exact successor wheel in isolation
      shell: bash
      run: |
        set -euo pipefail
        test -n "${STUDIO_C0_WHEEL:-}"
        wheel="$STUDIO_C0_WHEEL"
        test -f "$wheel"
        test "$(basename "$wheel")" = conflict_analysis-0.1.0-py3-none-any.whl
        test "$wheel" = "$SUCCESSOR_EVIDENCE_DIR/conflict_analysis-0.1.0-py3-none-any.whl"

        isolated_venv="${RUNNER_TEMP}/successor-wheel-venv"
        python -m venv --system-site-packages "$isolated_venv"
        "$isolated_venv/bin/python" -m pip install \
          --disable-pip-version-check --force-reinstall --no-deps "$wheel"
        (
          cd "$RUNNER_TEMP"
          "$isolated_venv/bin/python" - \
            "$ACTIVE_SLICE" \
            "$wheel" \
            "$SUCCESSOR_EVIDENCE_DIR/wheel-install.json" \
            "$GITHUB_WORKSPACE/software/conflict_analysis" \
            "$SLICE_BASE_HEAD" \
            "$SLICE_BASE_TREE" \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" <<'PY'
        import hashlib
        import importlib
        import json
        import os
        import pathlib
        import sys
        from importlib.resources import files
        from zipfile import ZipFile

        (
            active_slice,
            wheel_name,
            evidence_name,
            repository_root,
            base_head,
            base_tree,
            delivery_head,
            delivery_tree,
        ) = sys.argv[1:]
        wheel_path = pathlib.Path(wheel_name).resolve(strict=True)
        evidence_path = pathlib.Path(evidence_name)
        repository_root = pathlib.Path(repository_root).resolve(strict=True)
        venv_root = pathlib.Path(sys.prefix).resolve(strict=True)
        assert pathlib.Path.cwd().resolve() != repository_root

        os.environ.setdefault("DJANGO_SETTINGS_MODULE", "conflict_analysis.settings")
        import django
        django.setup()

        def installed_module(name):
            module = importlib.import_module(name)
            module_path = pathlib.Path(module.__file__).resolve(strict=True)
            assert module_path.is_relative_to(venv_root), (name, module_path, venv_root)
            assert not module_path.is_relative_to(repository_root), (name, module_path)
            return module

        with ZipFile(wheel_path) as archive:
            members = set(archive.namelist())
            assert archive.testzip() is None

        if active_slice == "F1":
            required_members = {
                "domain/__init__.py",
                "domain/migrations/__init__.py",
                "domain/migrations/0017_multilingual_evidence_lineage.py",
                "domain/services/__init__.py",
                "domain/services/document_lineage.py",
                "domain/services/evidence_drilldown.py",
                "domain/api/__init__.py",
                "domain/api/evidence.py",
            }
            assert required_members <= members, sorted(required_members - members)
            installed_module("domain.migrations.0017_multilingual_evidence_lineage")
            installed_module("domain.services.document_lineage")
            installed_module("domain.services.evidence_drilldown")
            installed_module("domain.api.evidence")
            repository_only = {
                "docs/adr/0012-multilingual-evidence-document-lineage.md",
            }
            assert all((repository_root / path).is_file() for path in repository_only)
            assert not {
                member for member in members
                if any(member == path or member.endswith(f"/{path}") for path in repository_only)
            }
            checks = [
                "wheel_built_exactly_once",
                "isolated_install",
                "migration_0017_discovered",
                "document_lineage_imported",
                "evidence_drilldown_imported",
                "domain_api_evidence_imported",
                "adr_repository_only",
            ]
        else:
            required_members = {
                "production_studio/__init__.py",
                "production_studio/lifecycle_claim_boundaries.py",
                "production_studio/urls.py",
                "production_studio/views.py",
                "production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json",
                "production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json.sha256",
                "production_studio/templates/production_studio/lifecycle_publication_definition.html",
                "production_studio/static/production_studio/lifecycle_publication.css",
                "production_studio/static/production_studio/lifecycle_publication.js",
            }
            assert required_members <= members, sorted(required_members - members)
            installed_module("production_studio")
            installed_module("production_studio.lifecycle_claim_boundaries")
            installed_module("production_studio.urls")
            installed_module("production_studio.views")
            resource_root = files("production_studio")
            contract = resource_root.joinpath(
                "contracts/lifecycle_publication_claim_boundaries_v1.ru.json"
            )
            digest_file = resource_root.joinpath(
                "contracts/lifecycle_publication_claim_boundaries_v1.ru.json.sha256"
            )
            template = resource_root.joinpath(
                "templates/production_studio/lifecycle_publication_definition.html"
            )
            stylesheet = resource_root.joinpath(
                "static/production_studio/lifecycle_publication.css"
            )
            javascript = resource_root.joinpath(
                "static/production_studio/lifecycle_publication.js"
            )
            assert all(
                resource.is_file()
                for resource in (contract, digest_file, template, stylesheet, javascript)
            )
            expected_digest = digest_file.read_text(encoding="utf-8").split()[0]
            assert hashlib.sha256(contract.read_bytes()).hexdigest() == expected_digest
            repository_only = {
                "README.md",
                "docs/adr/0009-production-studio-c-lifecycle-publication.md",
                "docs/production-studio-c-read-only-runtime.md",
            }
            assert all((repository_root / path).is_file() for path in repository_only)
            assert not {
                member for member in members
                if any(member == path or member.endswith(f"/{path}") for path in repository_only)
            }
            checks = [
                "wheel_built_exactly_once",
                "isolated_install",
                "production_studio_imported",
                "lifecycle_claim_boundaries_imported",
                "contract_payload_present",
                "template_payload_present",
                "static_payload_present",
                "docs_repository_only",
            ]

        evidence = {
            "schema": "POST_F0L_WHEEL_INSTALL_EVIDENCE_V1",
            "active_slice": active_slice,
            "base_head": base_head,
            "base_tree": base_tree,
            "delivery_head": delivery_head,
            "delivery_tree": delivery_tree,
            "wheel_sha256": hashlib.sha256(wheel_path.read_bytes()).hexdigest(),
            "source_tree_fallback": False,
            "checks": checks,
        }
        evidence_path.write_text(
            json.dumps(evidence, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        print(f"{active_slice}_ISOLATED_WHEEL_AND_PACKAGE_DATA=PASS")
        PY
        )
    - name: Prove the exact C2A synthetic merge tree
