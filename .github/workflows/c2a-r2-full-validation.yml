name: C2A R2 exact candidate validation

on:
  push:
    branches:
      - agent/c2a-r2-builder
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c2a-r2-exact-candidate
  cancel-in-progress: true

jobs:
  exact-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      USE_SQLITE: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      ACTIVE_SLICE: C2A
      SLICE_BASE_HEAD: 561ef5327bf655a558adb21c54d0fdf0559d7024
      SLICE_BASE_TREE: 5b209c782e1ac1a4783b01391dd59d813559ce57
      R1_HEAD: 22f0f173a941de88d6920b6e19821168e9b30cc8
      R1_TREE: f407e609adb2a8b94770b521a1302feb79281822
      PATCH_SOURCE_COMMIT: fe54ac184bd654e9830b2cd6f1f35609fe51024e
      PATCH_TEXT_SHA256: b7c6f45c77881672c6f1fb024e3fa8c39601e1ce6d38eaeb875333b9d3711aa9
      PATCH_GZIP_SHA256: d6c79334d9066a7f68efb6ef0055f8e34d1c5847592cc0c4c7dc577b5951b641
      PATCH_BASE64_SHA256: 42f90f9476241d5d152c7e451edb0000549cd209803f4e97f7eac950b64c872d
      C2A_CHROME_VERSION: 152.0.7977.64
      C2A_CHROME_LINUX64_SHA256: 8b592f066af71f054aab2cc80fc26f73c775c6d44ebb99d16ade924b24756c2e
      TARGET_STAGING_BRANCH: agent/c2a-r2-emergency-staging

    steps:
      - name: Check out exact immutable R1
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 22f0f173a941de88d6920b6e19821168e9b30cc8
          persist-credentials: true

      - name: Verify immutable base and remote staging ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R1_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$R1_TREE"
          test "$(git rev-parse HEAD^)" = "$SLICE_BASE_HEAD"
          test "$(git rev-parse "$SLICE_BASE_HEAD^{tree}")" = "$SLICE_BASE_TREE"
          test -z "$(git replace -l)"
          test -z "$(git status --porcelain=v1)"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_STAGING_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$R1_HEAD"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch, verify and apply exact candidate patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload_b64="$RUNNER_TEMP/c2a-r2-full.patch.gz.b64"
          payload_gz="$RUNNER_TEMP/c2a-r2-full.patch.gz"
          payload_patch="$RUNNER_TEMP/c2a-r2-full.patch"
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/.github/c2a-r2/full.patch.gz.b64?ref=$PATCH_SOURCE_COMMIT" \
            --jq .content \
            | tr -d '\n' \
            | base64 --decode > "$payload_b64"
          test "$(sha256sum "$payload_b64" | awk '{print $1}')" = "$PATCH_BASE64_SHA256"
          base64 --decode "$payload_b64" > "$payload_gz"
          test "$(sha256sum "$payload_gz" | awk '{print $1}')" = "$PATCH_GZIP_SHA256"
          gzip --decompress --stdout "$payload_gz" > "$payload_patch"
          test "$(sha256sum "$payload_patch" | awk '{print $1}')" = "$PATCH_TEXT_SHA256"
          git apply --check "$payload_patch"
          git apply --index "$payload_patch"

      - name: Verify exact twelve-path staged inventory and blob identities
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-paths.txt"
          actual="$RUNNER_TEMP/actual-paths.txt"
          cat > "$expected" <<'EOF'
          M	.github/workflows/conflict-analysis.yml
          M	software/conflict_analysis/README.md
          M	software/conflict_analysis/docs/adr/0009-production-studio-c-lifecycle-publication.md
          M	software/conflict_analysis/docs/production-studio-c-read-only-runtime.md
          M	software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs
          M	software/conflict_analysis/production_studio/browser_tests/lifecycle_publication.mjs
          M	software/conflict_analysis/production_studio/static/production_studio/lifecycle_publication.js
          M	software/conflict_analysis/production_studio/templates/production_studio/lifecycle_publication_definition.html
          M	software/conflict_analysis/production_studio/tests/test_lifecycle_publication.py
          M	software/conflict_analysis/production_studio/tests/test_read_only_static_contracts.py
          M	software/conflict_analysis/production_studio/views.py
          M	software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py
          EOF
          git diff --cached --name-status --no-renames | LC_ALL=C sort > "$actual"
          LC_ALL=C sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          test "$(wc -l < "$actual" | tr -d ' ')" = "12"
          test -z "$(git diff --name-only)"
          while IFS=$'\t' read -r status path; do
            test "$status" = M
            test "$(git ls-files -s -- "$path" | awk '{print $1}')" = 100644
          done < "$actual"
          python - <<'PY'
          import pathlib
          import subprocess

          expected = {
              ".github/workflows/conflict-analysis.yml": "21c4b624d78f25670285f1699b67bd0d6e393f26",
              "software/conflict_analysis/README.md": "e0da5bcf5f24809f6ca788a1a8f6b0f0144bf1f3",
              "software/conflict_analysis/docs/adr/0009-production-studio-c-lifecycle-publication.md": "c0889c969db86b55af2613fe2f633cfa2123866a",
              "software/conflict_analysis/docs/production-studio-c-read-only-runtime.md": "f50dd1fbc0cf967ad658327f37cd0ea70eba6a8f",
              "software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs": "4e10f954441abf25ec5b5d60b1f310071f923d99",
              "software/conflict_analysis/production_studio/browser_tests/lifecycle_publication.mjs": "11ccf3ce90b629f14443b96ee9020a8a4ee35a2e",
              "software/conflict_analysis/production_studio/static/production_studio/lifecycle_publication.js": "12efd1dc9dc5fcb922be2844df1a716f4cb66f09",
              "software/conflict_analysis/production_studio/templates/production_studio/lifecycle_publication_definition.html": "a1e7e9f3fac0be61bbce6a2a4f6e8bb221f62101",
              "software/conflict_analysis/production_studio/tests/test_lifecycle_publication.py": "8b80117a10fe8ebc804e5eed33846e0f60b09cc3",
              "software/conflict_analysis/production_studio/tests/test_read_only_static_contracts.py": "4190bcc1871679a3b1e0a29f6991e3dc6876c912",
              "software/conflict_analysis/production_studio/views.py": "955e715cb083f7e4467836ace77281de30ef1d39",
              "software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py": "7fc40292e4c478dbfd5afea271d0a23413f5f5ab",
          }
          for path, expected_blob in expected.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert actual == expected_blob, (path, actual, expected_blob)
              assert pathlib.Path(path).is_file(), path
          print("C2A_R2_EXACT_12_BLOBS=PASS")
          PY
          git diff --cached --check

      - name: Install application and exact test dependencies
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check

      - name: Run static, syntax and verifier self-check gates
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_production_studio_c_allowlist.py --self-check \
            | tee "$RUNNER_TEMP/verifier-self-check.json"
          python -m compileall -q conflict_analysis domain production_studio scripts
          node --check production_studio/static/production_studio/lifecycle_publication.js
          node --check production_studio/browser_tests/lifecycle_publication.mjs
          node --check production_studio/browser_tests/audited_authoring.mjs
          node --unhandled-rejections=strict \
            production_studio/browser_tests/audited_authoring.mjs \
            --self-check-observation
          git -C "$GITHUB_WORKSPACE" diff --cached --check

      - name: Check clean PostgreSQL migration and Django state
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check
          base_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only \
            "$SLICE_BASE_HEAD" -- software/conflict_analysis/domain/migrations)"
          candidate_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only \
            "$R1_HEAD" -- software/conflict_analysis/domain/migrations)"
          test "$candidate_migrations" = "$base_migrations"

      - name: Build one exact candidate wheel
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/successor-evidence"
          mkdir -p "$evidence"
          python -m pip wheel --no-deps --wheel-dir "$evidence" .
          mapfile -t wheels < <(find "$evidence" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          test "$(basename "${wheels[0]}")" = conflict_analysis-0.1.0-py3-none-any.whl
          printf 'SUCCESSOR_EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
          printf 'STUDIO_C0_WHEEL=%s\n' "${wheels[0]}" >> "$GITHUB_ENV"

      - name: Run exact PostgreSQL Foundation and Product gates
        working-directory: software/conflict_analysis
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python -m pytest \
            production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-portable-postgresql.xml"
          python -m pytest domain/tests -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-postgresql.xml"
          python -m pytest \
            production_studio/tests/test_browser_contract.py \
            production_studio/tests/test_claim_boundaries.py \
            production_studio/tests/test_read_only_http.py \
            production_studio/tests/test_read_only_static_contracts.py \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c0-postgresql.xml"
          python -m pytest \
            production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c1-postgresql.xml"
          c0="production_studio/tests/test_browser_contract.py production_studio/tests/test_claim_boundaries.py production_studio/tests/test_read_only_http.py production_studio/tests/test_read_only_static_contracts.py"
          c1="production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests"
          c2a="production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests"
          g7="production_player/tests/test_player_g7.py::ProductionPlayerG7Tests"
          g8="production_player/tests/test_player_g8.py::ProductionPlayerG8Tests"
          g9="production_player/tests/test_player_g9_evidence.py::ProductionPlayerG9EvidenceTests"
          STUDIO_C0_WHEEL="$STUDIO_C0_WHEEL" python -m pytest \
            $c0 $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-product-full-postgresql.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          expected = {
              "c2a-portable-postgresql.xml": (13, 0),
              "c2a-foundation-postgresql.xml": (350, 0),
              "c2a-c0-postgresql.xml": (19, 0),
              "c2a-c1-postgresql.xml": (8, 0),
              "c2a-product-full-postgresql.xml": (68, 0),
          }
          for name, (total, skipped) in expected.items():
              tree = ET.parse(root / name).getroot()
              cases = tree.findall(".//testcase")
              actual_skipped = sum(case.find("skipped") is not None for case in cases)
              assert len(cases) == total, (name, len(cases), total)
              assert actual_skipped == skipped, (name, actual_skipped, skipped)
              assert not tree.findall(".//failure"), name
              assert not tree.findall(".//error"), name
          print("C2A_POSTGRESQL_FOUNDATION_350_PRODUCT_68=PASS")
          PY

      - name: Run exact SQLite Foundation and Product gates
        working-directory: software/conflict_analysis
        shell: bash
        env:
          USE_SQLITE: "true"
          SQLITE_PATH: ${{ runner.temp }}/c2a-r2-sqlite.sqlite3
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python manage.py migrate --noinput
          python -m pytest \
            production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-portable-sqlite.xml"
          python -m pytest domain/tests -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-foundation-sqlite.xml"
          python -m pytest \
            production_studio/tests/test_browser_contract.py \
            production_studio/tests/test_claim_boundaries.py \
            production_studio/tests/test_read_only_http.py \
            production_studio/tests/test_read_only_static_contracts.py \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c0-sqlite.xml"
          python -m pytest \
            production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c1-sqlite.xml"
          c0="production_studio/tests/test_browser_contract.py production_studio/tests/test_claim_boundaries.py production_studio/tests/test_read_only_http.py production_studio/tests/test_read_only_static_contracts.py"
          c1="production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests"
          c2a="production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationTests"
          g7="production_player/tests/test_player_g7.py::ProductionPlayerG7Tests"
          g8="production_player/tests/test_player_g8.py::ProductionPlayerG8Tests"
          g9="production_player/tests/test_player_g9_evidence.py::ProductionPlayerG9EvidenceTests"
          STUDIO_C0_WHEEL="$STUDIO_C0_WHEEL" python -m pytest \
            $c0 $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-product-full-sqlite.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          expected = {
              "c2a-portable-sqlite.xml": (13, 0),
              "c2a-foundation-sqlite.xml": (350, 28),
              "c2a-c0-sqlite.xml": (19, 0),
              "c2a-c1-sqlite.xml": (8, 0),
              "c2a-product-full-sqlite.xml": (68, 0),
          }
          for name, (total, skipped) in expected.items():
              tree = ET.parse(root / name).getroot()
              cases = tree.findall(".//testcase")
              actual_skipped = sum(case.find("skipped") is not None for case in cases)
              assert len(cases) == total, (name, len(cases), total)
              assert actual_skipped == skipped, (name, actual_skipped, skipped)
              assert not tree.findall(".//failure"), name
              assert not tree.findall(".//error"), name
          print("C2A_SQLITE_FOUNDATION_322_PLUS_28_PRODUCT_68=PASS")
          PY

      - name: Run exact pinned real-Chromium gates on PostgreSQL
        working-directory: software/conflict_analysis
        shell: bash
        env:
          USE_SQLITE: "false"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/c2a-chrome-for-testing-linux64.zip"
          curl --fail --location --silent --show-error --retry 0 \
            "https://storage.googleapis.com/chrome-for-testing-public/$C2A_CHROME_VERSION/linux64/chrome-linux64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$C2A_CHROME_LINUX64_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/c2a-chrome"
          chrome="$RUNNER_TEMP/c2a-chrome/chrome-linux64/chrome"
          test -x "$chrome"
          "$chrome" --version | grep -F "$C2A_CHROME_VERSION"
          STUDIO_CHROME_BIN="$chrome" python -m pytest \
            production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringBrowserTests::test_authenticated_edit_save_reload_is_bounded_foundation_only_and_receipted \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-c1-chromium-postgresql.xml"
          STUDIO_CHROME_BIN="$chrome" python -m pytest \
            production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationBrowserTests \
            -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-chromium-postgresql.xml"
          c1="production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringBrowserTests::test_authenticated_edit_save_reload_is_bounded_foundation_only_and_receipted"
          c2a="production_studio/tests/test_lifecycle_publication.py::ProductionStudioLifecyclePublicationBrowserTests"
          g7="production_player/tests/test_player_g7.py::ProductionPlayerG7ChromiumTests"
          g8="production_player/tests/test_player_g8.py::ProductionPlayerG8ChromiumTests"
          g9="production_player/tests/test_player_g9_evidence.py::ProductionPlayerG9ChromiumTests"
          STUDIO_CHROME_BIN="$chrome" python -m pytest \
            $c1 $g7 $g8 $g9 $c2a -p no:cacheprovider \
            --junitxml="$SUCCESSOR_EVIDENCE_DIR/c2a-chromium-full-postgresql.xml"
          python - "$SUCCESSOR_EVIDENCE_DIR" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path(sys.argv[1])
          expected = {
              "c2a-c1-chromium-postgresql.xml": 1,
              "c2a-chromium-postgresql.xml": 2,
              "c2a-chromium-full-postgresql.xml": 10,
          }
          for name, total in expected.items():
              tree = ET.parse(root / name).getroot()
              cases = tree.findall(".//testcase")
              assert len(cases) == total, (name, len(cases), total)
              assert not tree.findall(".//failure"), name
              assert not tree.findall(".//error"), name
              assert not tree.findall(".//skipped"), name
          print("C2A_PINNED_CHROMIUM_10_WITH_C2A_2=PASS")
          PY

      - name: Create sole local R2 commit after complete precommit PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R1_HEAD"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 12
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          git config user.name "C2A R2 isolated builder"
          git config user.email "c2a-r2-builder@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-09-12T00:00:00Z"
          export GIT_COMMITTER_DATE="2026-09-12T00:00:00Z"
          git commit -m "fix: complete C2A lifecycle publication R2"
          test "$(git rev-parse HEAD^)" = "$R1_HEAD"
          test "$(git rev-list --count "$SLICE_BASE_HEAD..HEAD")" = 2
          test -z "$(git rev-list --merges "$SLICE_BASE_HEAD..HEAD")"
          printf 'R2_HEAD=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'R2_TREE=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Create exact postcommit evidence manifest and migration record
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          python - \
            "$SUCCESSOR_EVIDENCE_DIR/manifest.json" \
            "$SUCCESSOR_EVIDENCE_DIR/migration.json" \
            "$SLICE_BASE_HEAD" "$SLICE_BASE_TREE" "$R2_HEAD" "$R2_TREE" \
            "$C2A_CHROME_VERSION" "$C2A_CHROME_LINUX64_SHA256" <<'PY'
          import json
          import pathlib
          import sys

          manifest_path, migration_path, base_head, base_tree, head, tree, chrome_version, chrome_sha = sys.argv[1:]
          junit_files = [
              "c2a-portable-postgresql.xml",
              "c2a-portable-sqlite.xml",
              "c2a-foundation-postgresql.xml",
              "c2a-foundation-sqlite.xml",
              "c2a-c0-postgresql.xml",
              "c2a-c0-sqlite.xml",
              "c2a-c1-postgresql.xml",
              "c2a-c1-sqlite.xml",
              "c2a-c1-chromium-postgresql.xml",
              "c2a-chromium-postgresql.xml",
              "c2a-product-full-postgresql.xml",
              "c2a-product-full-sqlite.xml",
              "c2a-chromium-full-postgresql.xml",
          ]
          manifest = {
              "schema": "POST_F0L_SUCCESSOR_CI_EVIDENCE_V1",
              "active_slice": "C2A",
              "base_head": base_head,
              "base_tree": base_tree,
              "delivery_head": head,
              "delivery_tree": tree,
              "junit_files": junit_files,
              "migration_evidence": "migration.json",
              "wheel_file": "conflict_analysis-0.1.0-py3-none-any.whl",
              "wheel_install_evidence": "wheel-install.json",
              "synthetic_tree_evidence": "synthetic-tree.json",
              "chromium_archive_version": chrome_version,
              "chromium_archive_sha256": chrome_sha,
          }
          migration = {
              "schema": "POST_F0L_MIGRATION_EVIDENCE_V1",
              "active_slice": "C2A",
              "base_head": base_head,
              "base_tree": base_tree,
              "delivery_head": head,
              "delivery_tree": tree,
              "gates": [
                  "compileall",
                  "django_check",
                  "makemigrations_check",
                  "postgresql_clean_migrate_0016",
                  "sqlite_clean_migrate_0016",
                  "migration_filenames_unchanged",
              ],
          }
          pathlib.Path(manifest_path).write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          pathlib.Path(migration_path).write_text(json.dumps(migration, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Inspect the exact wheel in an isolated environment
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          wheel="$STUDIO_C0_WHEEL"
          test -f "$wheel"
          isolated="$RUNNER_TEMP/c2a-wheel-venv"
          python -m venv --system-site-packages "$isolated"
          "$isolated/bin/python" -m pip install \
            --disable-pip-version-check --force-reinstall --no-deps "$wheel"
          (
            cd "$RUNNER_TEMP"
            "$isolated/bin/python" - \
              "$wheel" "$SUCCESSOR_EVIDENCE_DIR/wheel-install.json" \
              "$GITHUB_WORKSPACE/software/conflict_analysis" \
              "$SLICE_BASE_HEAD" "$SLICE_BASE_TREE" "$R2_HEAD" "$R2_TREE" <<'PY'
          import hashlib
          import importlib
          import json
          import os
          import pathlib
          import sys
          from importlib.resources import files
          from zipfile import ZipFile

          wheel_name, evidence_name, repository_root, base_head, base_tree, head, tree = sys.argv[1:]
          wheel_path = pathlib.Path(wheel_name).resolve(strict=True)
          repository_root = pathlib.Path(repository_root).resolve(strict=True)
          venv_root = pathlib.Path(sys.prefix).resolve(strict=True)
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "conflict_analysis.settings")
          import django
          django.setup()

          def installed_module(name):
              module = importlib.import_module(name)
              path = pathlib.Path(module.__file__).resolve(strict=True)
              assert path.is_relative_to(venv_root), (name, path, venv_root)
              assert not path.is_relative_to(repository_root), (name, path)
              return module

          with ZipFile(wheel_path) as archive:
              members = set(archive.namelist())
              assert archive.testzip() is None
          required = {
              "production_studio/__init__.py",
              "production_studio/apps.py",
              "production_studio/lifecycle_claim_boundaries.py",
              "production_studio/urls.py",
              "production_studio/views.py",
              "production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json",
              "production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json.sha256",
              "production_studio/templates/production_studio/lifecycle_publication_definition.html",
              "production_studio/static/production_studio/lifecycle_publication.css",
              "production_studio/static/production_studio/lifecycle_publication.js",
          }
          assert required <= members, sorted(required - members)
          installed_module("production_studio")
          installed_module("production_studio.lifecycle_claim_boundaries")
          installed_module("production_studio.urls")
          installed_module("production_studio.views")
          root = files("production_studio")
          contract = root.joinpath("contracts/lifecycle_publication_claim_boundaries_v1.ru.json")
          digest_file = root.joinpath("contracts/lifecycle_publication_claim_boundaries_v1.ru.json.sha256")
          template = root.joinpath("templates/production_studio/lifecycle_publication_definition.html")
          stylesheet = root.joinpath("static/production_studio/lifecycle_publication.css")
          javascript = root.joinpath("static/production_studio/lifecycle_publication.js")
          assert all(item.is_file() for item in (contract, digest_file, template, stylesheet, javascript))
          expected_digest = digest_file.read_text(encoding="utf-8").split()[0]
          assert hashlib.sha256(contract.read_bytes()).hexdigest() == expected_digest
          repository_only = {
              "README.md",
              "docs/adr/0009-production-studio-c-lifecycle-publication.md",
              "docs/production-studio-c-read-only-runtime.md",
          }
          assert all((repository_root / path).is_file() for path in repository_only)
          assert not {
              member for member in members
              if any(member == path or member.endswith(f"/{path}") for path in repository_only)
          }
          evidence = {
              "schema": "POST_F0L_WHEEL_INSTALL_EVIDENCE_V1",
              "active_slice": "C2A",
              "base_head": base_head,
              "base_tree": base_tree,
              "delivery_head": head,
              "delivery_tree": tree,
              "wheel_sha256": hashlib.sha256(wheel_path.read_bytes()).hexdigest(),
              "source_tree_fallback": False,
              "checks": [
                  "wheel_built_exactly_once",
                  "isolated_install",
                  "production_studio_imported",
                  "lifecycle_claim_boundaries_imported",
                  "contract_payload_present",
                  "template_payload_present",
                  "static_payload_present",
                  "docs_repository_only",
              ],
          }
          pathlib.Path(evidence_name).write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          )

      - name: Prove exact synthetic merge tree and run postcommit verifier
        working-directory: software/conflict_analysis
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git -C "$GITHUB_WORKSPACE" merge-base "$SLICE_BASE_HEAD" "$R2_HEAD")"
          test "$merge_base" = "$SLICE_BASE_HEAD"
          synthetic="$(git -C "$GITHUB_WORKSPACE" merge-tree --write-tree "$SLICE_BASE_HEAD" "$R2_HEAD")"
          independent="$(git -C "$GITHUB_WORKSPACE" merge-tree --write-tree "$merge_base" "$R2_HEAD")"
          test "$synthetic" = "$R2_TREE"
          test "$independent" = "$R2_TREE"
          python - "$SUCCESSOR_EVIDENCE_DIR/synthetic-tree.json" \
            "$SLICE_BASE_HEAD" "$R2_HEAD" "$R2_TREE" "$synthetic" "$independent" <<'PY'
          import json
          import pathlib
          import sys
          output, base_head, head, tree, synthetic, independent = sys.argv[1:]
          payload = {
              "schema": "C2A_SYNTHETIC_TREE_EVIDENCE_V1",
              "base_head": base_head,
              "delivery_head": head,
              "parents": [base_head, head],
              "delivery_tree": tree,
              "synthetic_tree": synthetic,
              "independent_tree": independent,
          }
          pathlib.Path(output).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python scripts/verify_production_studio_c_allowlist.py \
            --slice C2A \
            --base-head "$SLICE_BASE_HEAD" \
            --base-tree "$SLICE_BASE_TREE" \
            --successor-evidence-dir "$SUCCESSOR_EVIDENCE_DIR" \
            --repo "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/c2a-r2-verifier.json"
          python - "$RUNNER_TEMP/c2a-r2-verifier.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["allowlist_result"] == "PASS", report
          assert report["active_slice"] == "C2A", report
          print("C2A_R2_POSTCOMMIT_VERIFIER=PASS")
          PY

      - name: Fast-forward isolated staging branch only after complete PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$R2_HEAD"
          test "$(git rev-parse HEAD^)" = "$R1_HEAD"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_STAGING_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$R1_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_STAGING_BRANCH"
          test "$(git ls-remote origin "refs/heads/$TARGET_STAGING_BRANCH" | awk '{print $1}')" = "$R2_HEAD"
          printf '{"status":"READY_FOR_DRAFT_PR","head":"%s","tree":"%s","parent":"%s"}\n' \
            "$R2_HEAD" "$R2_TREE" "$R1_HEAD" \
            | tee "$RUNNER_TEMP/c2a-r2-terminal.json"

      - name: Upload complete candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2a-r2-exact-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/successor-evidence
            ${{ runner.temp }}/verifier-self-check.json
            ${{ runner.temp }}/c2a-r2-verifier.json
            ${{ runner.temp }}/c2a-r2-terminal.json
          if-no-files-found: warn
          retention-days: 14
