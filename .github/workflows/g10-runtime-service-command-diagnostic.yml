                  state["zip"] = builder.build(repo,output)
                  state["rootfs"] = identity(output / builder.ROOTFS_NAME)
                  state["wheel"] = identity(output/"conflict_analysis-0.1.0-py3-none-any.whl")
                  require(state["zip"]==EXPECTED_ZIP and state["rootfs"]==EXPECTED_ROOTFS,"accepted Phase-A byte identity")
                  state["build_completed"] = True
                  state["phase"] = "runtime"
                  save()
                  image = "g10-service:"+os.environ["GITHUB_RUN_ID"]
                  imported,_ = command("docker_import_exact_rootfs",["docker","import",str(output/builder.ROOTFS_NAME),image],timeout=90)
                  require(imported["exit_code"]==0,"docker import")
                  container = "g10-service-"+os.environ["GITHUB_RUN_ID"]
                  created,_ = command("docker_run_network_none",["docker","run","--name",container,"--network=none","-d",
                                     "--entrypoint","/bin/sleep",image,"infinity"],timeout=45)
                  require(created["exit_code"]==0,"docker run")
                  network,raw = command("docker_network_mode",["docker","inspect","--format","{{.HostConfig.NetworkMode}}",container])
                  require(network["exit_code"]==0 and raw["stdout"].strip()==b"none","network none verification")
                  state["docker_network_mode"] = "none"
                  body = (temporary/"g10-service-bounded.py").read_bytes() + b"\n" + (temporary/"g10-service-container-probe.py").read_bytes()
                  state["external_probe_sha256"] = hashlib.sha256(body).hexdigest()
                  def probe(label, operation):
                      args = ["docker","exec","-i","-e","LD_LIBRARY_PATH=/opt/python-libs",container,
                              "/opt/owner-alpha/venv/bin/python","-B","-",operation,expected_supervisor]
                      meta,raw = command(label,args,data=body,timeout=180)
                      require(meta["exit_code"]==0 and not meta["timed_out"],label+" execution")
                      require(meta["stdout"]["bytes"]==len(raw["stdout"]),label+" bounded JSON")
                      data = json.loads(raw["stdout"])
                      require(isinstance(data,dict) and "probe_error" not in data,label+" observations")
                      return data
                  state["initialize_attempts"] += 1
                  save()
                  init,raw = command("initialize",["docker","exec","-i",container,SUPERVISOR,"initialize",str(PORT)],timeout=180)
                  state["initialize"] = {**init,**result_fields(raw)}
                  state["initialize"]["outcome"] = "PASS" if init["exit_code"]==0 and state["initialize"].get("phase")=="STOPPED" else "FAIL"
                  save()
                  require(state["initialize"]["outcome"]=="PASS","initialize must pass")
                  state["before_start"] = probe("state_before_start","snapshot")
                  state["start_attempts"] += 1
                  save()
                  started,raw = command("start",["docker","exec","-i",container,SUPERVISOR,"start"],timeout=180)
                  state["start"] = {**started,**result_fields(raw)}
                  save()
                  state["after_start"] = probe("state_after_start","snapshot")
                  require(started["exit_code"]!=0 and not started["timed_out"],"original start must fail")
                  state["phase"] = "exact_gunicorn_start"
                  save()
                  state["gunicorn_service"] = probe("exact_gunicorn_start","gunicorn-start")
                  save()
                  if state["gunicorn_service"].get("actually_started") is True:
                      state["phase"] = "exact_nginx_commands"
                      save()
                      state["nginx_service"] = probe("exact_nginx_commands","nginx-sequence")
                  else:
                      state["nginx_service"] = {"outcome":"NOT_EXECUTED","reason":"GUNICORN_DID_NOT_START",
                                                "config_attempts":0,"start_attempts":0}
                  state["after_service_commands"] = probe("state_after_service_commands","snapshot")
                  state["earliest_failure"] = classify(state)
                  key = {"GUNICORN_START_COMMAND":"gunicorn_service","NGINX_START_COMMAND":"nginx_service"}.get(state["earliest_failure"])
                  state["first_failing_service_command"] = state[key]["command"]["exact_command"] if key else None
                  state["phase"] = "completed"
              except Exception as exc:
                  # Exception values and tracebacks can carry private argv/output; omit them.
                  state["exception"] = {"type":type(exc).__name__,"phase":state["phase"],"details_suppressed":True}
              finally:
                  for label, action in {
                      "checked_out_target_after":lambda:revision(repo,"HEAD"),
                      "target_branch_sha_after":lambda:remote(repo),
                      "git_status_after":lambda:git(repo,"status","--porcelain=v1","--untracked-files=all"),
                      "tracked_snapshot_after":lambda:snapshot(repo),
                  }.items():
                      try:
                          state[label] = action()
                      except Exception as exc:
                          state[label] = {"error_type":type(exc).__name__}
                  for label,args in (
                      ("remove_owned_diagnostic_container",["docker","rm","-f",container] if container else None),
                      ("remove_owned_diagnostic_image",["docker","image","rm",image] if image else None),
                  ):
                      if args:
                          try:
                              meta,_ = bounded(label,args,timeout=60)
                              state["cleanup"].append(meta)
                          except Exception as exc:
                              state["cleanup"].append({"label":label,"error_type":type(exc).__name__})
                  state["no_tracked_source_changed"] = (
                      state.get("tracked_snapshot_before") is not None
                      and state.get("tracked_snapshot_after")==state["tracked_snapshot_before"]
                      and state.get("git_status_before")=="" and state.get("git_status_after")=="")
                  save()
          
          def finalize():
              repo, temporary, output, checkpoint = locations()
              state = json.loads(checkpoint.read_bytes()) if checkpoint.is_file() else {
                  "expected_target":TARGET,"diagnostic_branch":BRANCH,"earliest_failure":"UNRESOLVED",
                  "exception":{"type":"HarnessNotExecuted","details_suppressed":True}}
              state["step_outcomes"] = {key:os.environ.get(key,"UNKNOWN") for key in
                                       ("CHECKOUT_OUTCOME","TOOLING_OUTCOME","EXECUTE_OUTCOME")}
              state["output_safety"] = {
                  "max_captured_stdout_stderr_combined_per_probe":8192,
                  "raw_probe_text_published":False,"environment_values_published":False,
                  "secret_session_principal_database_backup_values_published":False,
                  "process_identity":"numeric PID plus /proc/<pid>/comm only",
                  "allowed_artifact_files":[REPORT],
                  "derived_output":"fixed error enums, finite errno set and fixed known paths only",
              }
              predicates = {
                  "steps":all(v=="success" for v in state["step_outcomes"].values()),
                  "one_build":state.get("build_calls")==1 and state.get("build_completed") is True,
                  "one_initialize":state.get("initialize_attempts")==1 and state.get("initialize",{}).get("outcome")=="PASS",
                  "one_failed_start":state.get("start_attempts")==1 and state.get("start",{}).get("exit_code") not in (None,0),
                  "network_none":state.get("docker_network_mode")=="none",
                  "observations_completed":state.get("phase")=="completed" and state.get("exception") is None,
                  "service_sequence_complete":state.get("gunicorn_service",{}).get("attempts")==1
                      and ((state["gunicorn_service"].get("actually_started") is True
                            and state.get("nginx_service",{}).get("config_attempts")==1
                            and state.get("nginx_service",{}).get("start_attempts")==1)
                           or (state["gunicorn_service"].get("actually_started") is not True
                               and state.get("nginx_service",{}).get("config_attempts")==0
                               and state.get("nginx_service",{}).get("start_attempts")==0)),
                  "source_unchanged":state.get("no_tracked_source_changed") is True,
                  "target_checkout_before":state.get("checked_out_target_before")==TARGET,
                  "target_checkout_after":state.get("checked_out_target_after")==TARGET,
                  "target_branch_before":state.get("target_branch_sha_before")==TARGET["head"],
                  "target_branch_after":state.get("target_branch_sha_after")==TARGET["head"],
              }
              state["completion_predicates"] = predicates
              state["diagnostic_completed"] = all(predicates.values())
              state["runtime_start_pass"] = state.get("start",{}).get("exit_code")==0
              payload = canonical(state)
              state["report_integrity"] = {"payload_definition":"canonical JSON with report_integrity omitted",
                  "payload_bytes":len(payload),"payload_sha256":hashlib.sha256(payload).hexdigest(),
                  "file_bytes":0,"full_file_sha256_location":"GitHub job summary, computed after serialization"}
              for _ in range(10):
                  raw = canonical(state)
                  if len(raw)==state["report_integrity"]["file_bytes"]:
                      break
                  state["report_integrity"]["file_bytes"] = len(raw)
              else:
                  raise RuntimeError("report byte length convergence")
              require(len(raw)<=256*1024,"bounded JSON size")
              path = temporary/REPORT
              path.write_bytes(raw)
              meta = identity(path)
              summary = [
                  "G10 RUNTIME-START SERVICE-COMMAND DIAGNOSTIC",
                  "Diagnostic HEAD: "+state.get("diagnostic_commit",{}).get("head",os.environ.get("GITHUB_SHA","UNKNOWN")),
                  "Target HEAD: "+state.get("checked_out_target_before",{}).get("head","UNKNOWN"),
                  "Earliest failure: "+state["earliest_failure"],
                  "Diagnostic completed: "+str(state["diagnostic_completed"]),
                  "Initialize result: "+state.get("initialize",{}).get("outcome","NOT_EXECUTED"),
                  "Start exit: "+str(state.get("start",{}).get("exit_code")),
                  "Report bytes: "+str(meta["bytes"]),
                  "Report SHA-256: "+meta["sha256"],
              ]
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as stream:
                  stream.write("\n\n".join(summary)+"\n")
              print(json.dumps({"earliest_failure":state["earliest_failure"],"diagnostic_completed":state["diagnostic_completed"],"report":meta}))
          
          def gate():
              _, temporary, _, _ = locations()
              raw = (temporary/REPORT).read_bytes()
              data = json.loads(raw)
              integrity = data.pop("report_integrity")
              payload = canonical(data)
              require(integrity["file_bytes"]==len(raw) and integrity["payload_bytes"]==len(payload)
                      and integrity["payload_sha256"]==hashlib.sha256(payload).hexdigest(),"report integrity")
              require(os.environ.get("UPLOAD_OUTCOME")=="success","artifact upload")
              require(data["diagnostic_completed"],"G10_RUNTIME_SERVICE_COMMAND_DIAGNOSTIC_INCOMPLETE")
          
          if __name__=="__main__":
              {"execute":execute,"finalize":finalize,"gate":gate}[sys.argv[1]]()
          PY
      - name: Prepare hash-bound CI tooling outside the checkout
        id: tooling
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/g10-tooling"
          "$RUNNER_TEMP/g10-tooling/bin/python" - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path("software/conflict_analysis/scripts").resolve()))
          import build_owner_alpha_package as b
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "g10-ci-inputs"
          for pin in b.PINS["wheels"]:
              b.download(pin, root / "wheels")
          (root / "ci.lock").write_text(b.lock_text(b.PINS["wheels"]), encoding="utf-8")
          PY
          "$RUNNER_TEMP/g10-tooling/bin/python" -m pip install --no-index --no-deps --require-hashes --find-links="$RUNNER_TEMP/g10-ci-inputs/wheels" -r "$RUNNER_TEMP/g10-ci-inputs/ci.lock"
      - name: Exact build, original start and bounded service commands
        id: execute
        if: always()
        timeout-minutes: 25
        env:
          CHECKOUT_OUTCOME: ${{ steps.target.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/g10-tooling/bin/python"
          if [ "$TOOLING_OUTCOME" != success ]; then python=python3.12; fi
          timeout --kill-after=30s 23m "$python" -B "$RUNNER_TEMP/g10-service-driver.py" execute
      - name: Collect private-safe bounded JSON
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.target.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -B "$RUNNER_TEMP/g10-service-driver.py" finalize
      - name: Upload only the diagnostic JSON
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g10-runtime-service-command-diagnostic
          if-no-files-found: error
          overwrite: false
          path: ${{ runner.temp }}/g10-runtime-service-command-diagnostic.json
      - name: Enforce diagnostic completion after upload
        if: always()
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -B "$RUNNER_TEMP/g10-service-driver.py" gate
