name: G10 runtime service-command diagnostic

on:
  push:
    branches: [codex/g10-runtime-service-command-diagnostic-20260914]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DJANGO_SETTINGS_MODULE: conflict_analysis.settings
  DJANGO_DEBUG: "false"

jobs:
  runtime-service-command:
    if: github.repository == 'dshatrov7575-max/Conflict'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frozen target
        id: target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4a0f0cb42aaea8d9d5f368cdc3d3de15db2f6d03
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Prepare external bounded diagnostic harness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/g10-service-bounded.py" <<'PY'
          import hashlib
          import subprocess
          import threading
          
          def bounded(label, args, *, data=None, timeout=60, env=None):
              """Drain both streams, hash every byte, retain at most 8192 bytes combined."""
              process = subprocess.Popen(args, stdin=subprocess.PIPE if data is not None else subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env)
              budget = [8192]
              lock = threading.Lock()
              streams = {}
              private = {}
              def drain(name, stream):
                  digest, size, kept = hashlib.sha256(), 0, bytearray()
                  while True:
                      chunk = stream.read(4096)
                      if not chunk:
                          break
                      digest.update(chunk)
                      size += len(chunk)
                      with lock:
                          count = min(len(chunk), budget[0])
                          budget[0] -= count
                      kept.extend(chunk[:count])
                  streams[name] = {"bytes": size, "sha256": digest.hexdigest(),
                                   "captured_bytes": len(kept), "text_recorded": False}
                  private[name] = bytes(kept)
              threads = [threading.Thread(target=drain, args=(name, stream), daemon=True)
                         for name, stream in (("stdout", process.stdout), ("stderr", process.stderr))]
              for thread in threads:
                  thread.start()
              if data is not None:
                  try:
                      process.stdin.write(data)
                      process.stdin.close()
                  except BrokenPipeError:
                      pass
              timed_out = False
              try:
                  code = process.wait(timeout=timeout)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  process.kill()
                  code = process.wait()
              for thread in threads:
                  thread.join()
              return {"label": label, "exit_code": code, "timed_out": timed_out,
                      "capture_limit_combined": 8192, "stdout": streams["stdout"], "stderr": streams["stderr"]}, private
          
          PY
          cat > "$RUNNER_TEMP/g10-service-container-probe.py" <<'PY'
          import ast
          import contextlib
          import hashlib
          import ipaddress
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          
          PORT = 8765
          RUN = Path("/run/owner-alpha")
          SUPERVISOR = Path("/opt/owner-alpha/owner-alpha-supervisor.sh")
          FILES = [RUN, RUN/"nginx.conf", RUN/"gunicorn.pid", RUN/"nginx.pid", RUN/"gunicorn.sock",
                   Path("/run/owner-alpha-pg"), Path("/run/owner-alpha-pg/.s.PGSQL.5432")]
          PHASES = {"EMPTY", "READY", "STOPPED", "RESTORED"}
          ENVIRONMENT = {
              "LD_LIBRARY_PATH": "/opt/python-libs",
              "PATH": "/opt/owner-alpha/venv/bin:/usr/lib/postgresql/18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
              "PYTHONDONTWRITEBYTECODE": "1", "PYTHONHASHSEED": "0",
          }
          
          def failure(exc):
              return {"outcome": "FAIL", "exception_type": type(exc).__name__}
          
          def metadata(path):
              row = {"path": str(path), "exists": False}
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return row
              kind = ("directory" if stat.S_ISDIR(info.st_mode) else "regular" if stat.S_ISREG(info.st_mode)
                      else "socket" if stat.S_ISSOCK(info.st_mode) else "symlink" if stat.S_ISLNK(info.st_mode) else "other")
              row.update(exists=True, uid=info.st_uid, gid=info.st_gid, mode=oct(stat.S_IMODE(info.st_mode)),
                         type=kind, bytes=info.st_size)
              return row
          
          def process_identity(pid):
              row = {"pid": pid, "exists": False, "comm": None}
              try:
                  raw = Path("/proc") / str(pid) / "comm"
                  comm = raw.read_bytes()[:64].decode("ascii", errors="strict").strip()
                  row["exists"] = True
                  row["comm"] = comm if re.fullmatch(r"[A-Za-z0-9_. ():-]{1,63}", comm) else "UNSAFE_COMM_SUPPRESSED"
              except FileNotFoundError:
                  pass
              return row
          
          def pidfile(path):
              row = {"pidfile": str(path), "pid": None, "exists": False, "comm": None}
              if not path.exists():
                  return row
              with path.open("rb") as stream:
                  line = stream.readline(32).strip()
              if not re.fullmatch(rb"[1-9][0-9]{0,9}", line):
                  row["invalid_pidfile"] = True
                  return row
              row.update(process_identity(int(line)))
              return row
          
          def listeners():
              rows = {}
              for filename in ("tcp", "tcp6"):
                  path = Path("/proc/net") / filename
                  result = []
                  with path.open() as stream:
                      next(stream)
                      for line in stream:
                          columns = line.split()
                          if columns[3] != "0A":
                              continue
                          address, port = columns[1].split(":")
                          raw = bytes.fromhex(address)
                          decoded = ipaddress.ip_address(raw[::-1] if filename == "tcp" else
                                                         b"".join(raw[i:i+4][::-1] for i in range(0, 16, 4)))
                          result.append({"address": str(decoded), "port": int(port, 16),
                                         "loopback": decoded.is_loopback, "state": "LISTEN"})
                          if len(result) > 64:
                              raise RuntimeError("listener bound")
                  rows[str(path)] = result
              return rows
          
          def snapshot():
              phase = json.loads(Path("/var/lib/owner-alpha/state.json").read_bytes()).get("phase")
              if phase not in PHASES:
                  raise RuntimeError("phase not allowlisted")
              pg_processes = []
              for path in Path("/proc").iterdir():
                  if path.name.isdigit():
                      item = process_identity(int(path.name))
                      if item["comm"] == "postgres":
                          pg_processes.append(item)
              if len(pg_processes) > 64:
                  raise RuntimeError("process bound")
              return {"state_phase": phase, "paths": {str(p): metadata(p) for p in FILES},
                      "pidfiles": {name: pidfile(path) for name, path in {
                          "postgres": Path("/var/lib/owner-alpha/postgres/postmaster.pid"),
                          "gunicorn": RUN/"gunicorn.pid", "nginx": RUN/"nginx.pid"}.items()},
                      "postgres_processes": sorted(pg_processes, key=lambda p: p["pid"]),
                      "listeners": listeners()}
          
          def load_definitions(expected_sha):
              raw = SUPERVISOR.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_sha:
                  raise RuntimeError("supervisor source identity")
              code = raw.decode().split("<<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
              module = ast.parse(code)
              if not isinstance(module.body[-1], ast.Try):
                  raise RuntimeError("supervisor dispatch structure")
              # Evaluate unchanged declarations only. Never execute its final main() dispatch.
              declarations = ast.Module(body=module.body[:-1], type_ignores=[])
              namespace = {"__name__": "frozen_supervisor_diagnostic"}
              exec(compile(declarations, str(SUPERVISOR), "exec"), namespace)
              return namespace
          
          import time
          
          GUNICORN_COMMAND = ["/opt/owner-alpha/venv/bin/gunicorn", "--config",
                              "/opt/owner-alpha/gunicorn.conf.py", "conflict_analysis.wsgi:application"]
          NGINX_CONFIG_COMMAND = ["nginx", "-t", "-c", "/run/owner-alpha/nginx.conf"]
          NGINX_START_COMMAND = ["nginx", "-c", "/run/owner-alpha/nginx.conf"]
          KNOWN_PATHS = (
              "/run/owner-alpha/gunicorn.pid", "/run/owner-alpha/gunicorn.sock",
              "/run/owner-alpha/nginx.conf", "/run/owner-alpha/nginx.pid",
              "/run/owner-alpha/client", "/run/owner-alpha/proxy", "/run/owner-alpha-pg/.s.PGSQL.5432",
              "/var/log/nginx/error.log", "/var/log/nginx/access.log", "/var/lib/nginx/body",
              "/var/lib/nginx/fastcgi", "/var/lib/nginx/proxy", "/var/lib/nginx/scgi",
              "/var/lib/nginx/uwsgi", "/var/lib/nginx", "/tmp", "/dev/null",
              "/opt/owner-alpha/venv/bin/gunicorn", "/opt/owner-alpha/gunicorn.conf.py",
          )
          ERROR_RULES = (
              ("PERMISSION_DENIED", 13, rb"(?:PermissionError|Permission denied|\[Errno 13\]|\(13:)"),
              ("NOT_FOUND", 2, rb"(?:FileNotFoundError|No such file or directory|\[Errno 2\]|\(2:)"),
              ("ADDRESS_IN_USE", 98, rb"(?:Address already in use|\[Errno 98\]|\(98:)"),
              ("CONNECTION_REFUSED", 111, rb"(?:Connection refused|\[Errno 111\]|\(111:)"),
              ("NO_SPACE", 28, rb"(?:No space left on device|\[Errno 28\]|\(28:)"),
              ("INVALID_ARGUMENT", 22, rb"(?:Invalid argument|\[Errno 22\]|\(22:)"),
              ("ALREADY_RUNNING", None, rb"(?:Already running|already running)"),
              ("IMPORT_ERROR", None, rb"(?:ImportError|ModuleNotFoundError)"),
              ("WORKER_BOOT_ERROR", None, rb"(?:Worker failed to boot|worker failed to boot)"),
          )
          
          def safe_error_facts(meta, private):
              # Only fixed enum values, errno numbers and fixed known paths can escape.
              raw = private.get("stdout", b"") + b"\n" + private.get("stderr", b"")
              classes, numbers = [], []
              for label, number, pattern in ERROR_RULES:
                  if re.search(pattern, raw):
                      classes.append(label)
                      if number is not None:
                          numbers.append(number)
              paths = [path for path in KNOWN_PATHS if path.encode() in raw]
              return {"error_class": "TIMEOUT" if meta["timed_out"] else
                      ("MULTIPLE" if len(classes)>1 else classes[0] if classes else
                       "NONE" if meta["exit_code"]==0 else "NONZERO_OUTPUT_SUPPRESSED"),
                      "allowlisted_error_classes":classes, "safe_errno":sorted(set(numbers)),
                      "known_paths":paths,
                      "known_path_metadata":[metadata(Path(path)) for path in paths]}
          
          def service_state(name):
              state = {"pid":pidfile(RUN/(name+".pid")), "pidfile":metadata(RUN/(name+".pid"))}
              if name=="gunicorn":
                  state["socket"] = metadata(RUN/"gunicorn.sock")
                  state["live_and_endpoint_present"] = state["pid"]["exists"] and state["socket"].get("type")=="socket"
              else:
                  state["listeners"] = listeners()
                  present = any(row["address"]=="127.0.0.1" and row["port"]==PORT
                                for rows in state["listeners"].values() for row in rows)
                  state["live_and_endpoint_present"] = state["pid"]["exists"] and present
              return state
          
          def settle(name):
              # Read-only observations; never retry a command or create a replacement process.
              start = time.monotonic()
              stable_since = None
              while True:
                  row = service_state(name)
                  now = time.monotonic()
                  if row["live_and_endpoint_present"]:
                      if stable_since is None:
                          stable_since = now
                      if now-stable_since >= 1.0:
                          row["stable_for_one_second"] = True
                          break
                  else:
                      stable_since = None
                  if now-start >= 5.0:
                      row["stable_for_one_second"] = False
                      break
                  time.sleep(0.25)
              row["observation_seconds"] = round(time.monotonic()-start,3)
              return row
          
          def prepare_environment(expected_sha):
              os.environ.update(ENVIRONMENT)
              with open(os.devnull,"w") as sink, contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                  namespace = load_definitions(expected_sha)
                  namespace["configure_env"]()
              if os.getcwd()!="/":
                  raise RuntimeError("frozen runtime cwd differs")
              return {"outcome":"PASS","method":"unchanged configure_env; values never recorded",
                      "cwd":"/","service_user":"owneralpha","supervisor_source_sha256":expected_sha}
          
          def run_service(label, command, timeout=60):
              meta, private = bounded(label,["runuser","-u","owneralpha","--",*command],timeout=timeout)
              return {**meta,"exact_command":command,"service_user":"owneralpha",**safe_error_facts(meta,private)}
          
          def gunicorn_start(expected_sha):
              result = {"environment":prepare_environment(expected_sha),"attempts":1}
              result["before"] = service_state("gunicorn")
              result["command"] = run_service("exact_gunicorn_start_as_owneralpha", GUNICORN_COMMAND)
              result["after"] = settle("gunicorn")
              result["actually_started"] = (result["command"]["exit_code"]==0
                                            and not result["command"]["timed_out"]
                                            and result["after"]["stable_for_one_second"])
              return result
          
          def nginx_sequence(expected_sha):
              result = {"environment":prepare_environment(expected_sha),"config_attempts":0,"start_attempts":0}
              result["gunicorn_before"] = service_state("gunicorn")
              if not result["gunicorn_before"]["live_and_endpoint_present"]:
                  result.update(outcome="NOT_EXECUTED",reason="GUNICORN_NO_LONGER_LIVE")
                  return result
              result["before"] = service_state("nginx")
              result["config_attempts"] = 1
              result["config_command"] = run_service("exact_nginx_test_as_owneralpha",NGINX_CONFIG_COMMAND,30)
              # The exact start is attempted even when -t fails, so a config-only result
              # cannot be substituted for a failing service command.
              result["start_attempts"] = 1
              result["command"] = run_service("exact_nginx_start_as_owneralpha",NGINX_START_COMMAND,30)
              result["after"] = settle("nginx")
              result["actually_started"] = (result["command"]["exit_code"]==0
                                            and not result["command"]["timed_out"]
                                            and result["after"]["stable_for_one_second"])
              return result
          
          try:
              operation = sys.argv[1]
              if operation=="snapshot":
                  answer=snapshot()
              elif operation=="gunicorn-start":
                  answer=gunicorn_start(sys.argv[2])
              elif operation=="nginx-sequence":
                  answer=nginx_sequence(sys.argv[2])
              else:
                  raise RuntimeError("probe not allowlisted")
              print(json.dumps(answer,sort_keys=True,separators=(",",":")))
          except Exception as exc:
              print(json.dumps({"probe_error":{"exception_type":type(exc).__name__}}))
              sys.exit(1)
          
