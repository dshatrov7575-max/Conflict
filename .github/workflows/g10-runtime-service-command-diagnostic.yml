              command=nginx.get("command",{})
              if command.get("timed_out") or command.get("exit_code") is None:
                  return "UNRESOLVED"
              if command["exit_code"]!=0:
                  return "UNRESOLVED" if nginx.get("before",{}).get("live_and_endpoint_present") else "NGINX_START_COMMAND"
              return "UNRESOLVED"
          
          def execute():
              repo, temporary, output, checkpoint = locations()
              state = {"schema":"G10_RUNTIME_SERVICE_COMMAND_DIAGNOSTIC_V1","expected_target":TARGET,
                       "controlling_comment":5669222662,
                       "diagnostic_branch":BRANCH,"port":PORT,"initialize_attempts":0,"start_attempts":0,
                       "build_calls":0,"build_completed":False,"observations":{},"cleanup":[],
                       "earliest_failure":"UNRESOLVED","phase":"precondition","exception":None}
              container, image = None, None
              def save():
                  checkpoint.write_bytes(canonical(state))
              def command(label, args, **kwargs):
                  meta, private = bounded(label,args,**kwargs)
                  state["observations"][label] = meta
                  return meta,private
              save()
              try:
                  require(os.environ.get("GITHUB_REPOSITORY")=="dshatrov7575-max/Conflict","repository identity")
                  require(os.environ.get("GITHUB_REF_NAME")==BRANCH,"diagnostic branch identity")
                  require(os.environ.get("CHECKOUT_OUTCOME")=="success","checkout outcome")
                  state["diagnostic_commit"] = revision(repo,os.environ["GITHUB_SHA"])
                  require(state["diagnostic_commit"]["parent"]==TARGET["head"],"diagnostic parent")
                  require(git(repo,"diff","--no-renames","--name-status",TARGET["head"],os.environ["GITHUB_SHA"])=="A\t"+REL,"diagnostic scope")
                  state["checked_out_target_before"] = revision(repo,"HEAD")
                  state["target_branch_sha_before"] = remote(repo)
                  state["git_status_before"] = git(repo,"status","--porcelain=v1","--untracked-files=all")
                  state["tracked_snapshot_before"] = snapshot(repo)
                  require(state["checked_out_target_before"]==TARGET and state["target_branch_sha_before"]==TARGET["head"]
