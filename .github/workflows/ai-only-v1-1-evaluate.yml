name: AI-only V1.1 technical repair evaluation

on:
  push:
    branches:
      - review/ai-only-research-beta-v1-1-fast-repair
    paths:
      - ".github/workflows/ai-only-v1-1-evaluate.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Compare, aggregate, and evaluate V1.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact evaluation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact frozen and retained blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "Blob mismatch for $path: expected=$expected actual=$actual" >&2
              exit 21
            }
          }

          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR
          r1=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1

          check_blob "$root/PROTOCOL_FREEZE_R1.md" 1981e1f45143723f1dfa9c1ded1966047af96719
          check_blob "$root/CARRY_FORWARD_MANIFEST_R1.json" fce96fefd7bb9d6626a33bed6fdddbe4f81197c2
          check_blob "$root/MODEL_B_SUBSTITUTION_GEMINI31PRO_R2.md" aa70161069c191470ace343861f4784185c424b
          check_blob "$root/omg_nov24_v1_0_1/06_AI1_STANDALONE_RU.md" 225bf43b4e90b1c049f136c77e7f2ce1c53aa0e3
          check_blob "$root/omg_nov24_v1_0_1/07_AI2_STANDALONE_RU.md" 9a5f103db14541c7379444886bc83b386224cacf
          check_blob "$root/omg_nov24_v1_0_1/compare_primary_v101.py" 3f62d8e164c48d1e0802f6a880000e927c7f7955
          check_blob "$root/aggregate_cohort_v101.py" 2aabe293a365ad5d5b811a569bcfefa7a97ece83
          check_blob "$root/raw/OMG_NOV24_V101_AI1_COMPLETED.json" 2c8c0576ec85ce6934e6c6605932f082fac03ca4
          check_blob "$root/raw/OMG_NOV24_V101_AI2_COMPLETED.json" 39606ae15758a2c66d26d62485719287e9981f60

          check_blob "$r1/executors/manual_dual_model_r1/derived/KBM_E02_V100_PRIMARY_COMPARISON.json" 2ea59f263ac83f34e458272d10202dc0b2829131
          check_blob "$r1/executors/manual_dual_model_r1/derived/KBM_E05_V100_PRIMARY_COMPARISON.json" 056e3bbda09afc2738fba82cce354a8a5f4a0a1e
          check_blob "$r1/executors/manual_dual_model_r1/derived/D25_E02_V100_PRIMARY_COMPARISON.json" e6dd3b0eca82496278417ddd7af91f0f8b9b7e3a
          check_blob "$r1/eligible_replay_r1/run_36844856009/ELIGIBLE_REPLAY_RESULT_R1.json" 1eb6d50e8ae8ba2e579ae3048cc622f59e1641a9
          check_blob "$r1/release_gate_r1/evaluate_release_gate_r1.py" 71bcfd8dd259364df6140be358ad265ce653443d

      - name: Validate exact executor identities and sealed attestations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/raw')
          ai1=json.loads((root/'OMG_NOV24_V101_AI1_COMPLETED.json').read_text(encoding='utf-8'))
          ai2=json.loads((root/'OMG_NOV24_V101_AI2_COMPLETED.json').read_text(encoding='utf-8'))
          assert ai1['actual_model_label']=='GPT-5.6 Sol Pro', ai1['actual_model_label']
          assert ai2['actual_model_label']=='Gemini 3.1 Pro', ai2['actual_model_label']
          assert ai1['run_id'] != ai2['run_id']
          for record in (ai1,ai2):
              assert record['completed_at_utc'].endswith('Z')
              assert all(value is False for value in record['attestation'].values())
          PY

      - name: Re-run comparator and aggregator self-tests
        shell: bash
        run: |
          set -euo pipefail
          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR
          python "$root/omg_nov24_v1_0_1/compare_primary_v101.py" --self-test | tee /tmp/comparator-self-test.json
          python "$root/aggregate_cohort_v101.py" --self-test | tee /tmp/aggregator-self-test.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/comparator-self-test.json')) == {'self_test':'PASS','cases':10}
          assert json.load(open('/tmp/aggregator-self-test.json')) == {'self_test':'PASS','cases':5}
          PY

      - name: Execute frozen V1.1 OMG comparison
        shell: bash
        run: |
          set -euo pipefail
          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR
          out="$RUNNER_TEMP/v1-1-evaluation"
          mkdir -p "$out"
          python "$root/omg_nov24_v1_0_1/compare_primary_v101.py" \
            --ai1 "$root/raw/OMG_NOV24_V101_AI1_COMPLETED.json" \
            --ai2 "$root/raw/OMG_NOV24_V101_AI2_COMPLETED.json" \
            --out "$out/OMG_NOV24_V101_PRIMARY_COMPARISON.json"

      - name: Aggregate the fixed four-lane cohort
        shell: bash
        run: |
          set -euo pipefail
          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR
          r1=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1
          out="$RUNNER_TEMP/v1-1-evaluation"
          python "$root/aggregate_cohort_v101.py" \
            --comparisons \
              "$r1/executors/manual_dual_model_r1/derived/KBM_E02_V100_PRIMARY_COMPARISON.json" \
              "$out/OMG_NOV24_V101_PRIMARY_COMPARISON.json" \
              "$r1/executors/manual_dual_model_r1/derived/KBM_E05_V100_PRIMARY_COMPARISON.json" \
              "$r1/executors/manual_dual_model_r1/derived/D25_E02_V100_PRIMARY_COMPARISON.json" \
            --out "$out/COHORT_AGGREGATE_V1_1_R1.json"

      - name: Build retained-evidence release-gate input
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v1-1-evaluation"
          replay=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/eligible_replay_r1/run_36844856009/ELIGIBLE_REPLAY_RESULT_R1.json
          python - "$out" "$replay" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          replay=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          comparison=json.loads((out/'OMG_NOV24_V101_PRIMARY_COMPARISON.json').read_text(encoding='utf-8'))
          aggregate=json.loads((out/'COHORT_AGGREGATE_V1_1_R1.json').read_text(encoding='utf-8'))
          eligible=aggregate['eligible_replay_lanes']
          assert eligible == ['AI_ONLY_DYAD_KBM_E02_V100','AI_ONLY_PAIR_KBM_E05_V100'], eligible
          assert replay['state']=='PASS'
          assert all(replay['lanes'][lane]['core_replay']['state']=='PASS_CORE_PARITY' for lane in eligible)
          payload={
            'cohort_fixed': True,
            'new_lane_after_results': False,
            'all_four_lanes_reported': True,
            'primary_roles': {
              'KBM_COMPANY_E02_V100_AI1':'VALID',
              'KBM_COMPANY_E02_V100_AI2':'VALID',
              'OMG_NOV24_V101_AI1':'VALID',
              'OMG_NOV24_V101_AI2':'VALID',
              'KBM_E05_V100_AI1':'VALID',
              'KBM_E05_V100_AI2':'VALID',
              'D25_E02_V100_AI1':'VALID',
              'D25_E02_V100_AI2':'VALID',
            },
            'primary_role_provenance': {
              'carry_forward_validated_roles': 6,
              'fresh_blind_roles': 2,
              'fresh_model_pair': ['GPT-5.6 Sol Pro','Gemini 3.1 Pro'],
            },
            'input_provenance_integrity':'PASS',
            'post_result_rebinding': False,
            'all_lane_comparators_executed': True,
            'coordinator_substitution_used': False,
            'targeted_content_review_used': False,
            'all_lane_outcomes_retained': True,
            'lane_states': aggregate['lane_states'],
            'omg_v101_state': comparison['state'],
            'cohort_aggregator_test':'PASS',
            'cohort_aggregate_schema':'PASS',
            'denominator_rule_preserved': True,
            'weight_grid_unchanged': True,
            'weight_runner_test':'PASS',
            'weights_inferred_from_evidence_or_outcome': False,
            'eligible_lanes': eligible,
            'eligible_lane_core_replay': {lane:'PASS' for lane in eligible},
            'required_label':'AI-кодирование; человеческая проверка не проводилась; исследовательская версия; прогнозная точность не установлена.',
            'claims': {
              'historical_snapshot':'NOT_ESTABLISHED',
              'historical_area_UNO':'NOT_COMPUTED',
              'human_validation':'NOT_PERFORMED',
              'human_reliability':'NOT_PERFORMED',
              'predictive_probability_risk_validation':'NOT_CLAIMED',
            },
          }
          (out/'RELEASE_GATE_INPUT_V1_1_R1.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Execute frozen release gate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v1-1-evaluation"
          evaluator=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/release_gate_r1/evaluate_release_gate_r1.py
          python "$evaluator" \
            --input "$out/RELEASE_GATE_INPUT_V1_1_R1.json" \
            --out "$out/RELEASE_GATE_OUTPUT_V1_1_R1.json"

      - name: Verify deterministic derived states
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v1-1-evaluation"
          python - "$out" <<'PY'
          import json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          comparison=json.loads((out/'OMG_NOV24_V101_PRIMARY_COMPARISON.json').read_text(encoding='utf-8'))
          aggregate=json.loads((out/'COHORT_AGGREGATE_V1_1_R1.json').read_text(encoding='utf-8'))
          gate=json.loads((out/'RELEASE_GATE_OUTPUT_V1_1_R1.json').read_text(encoding='utf-8'))
          assert comparison['state']=='HOLD_DISAGREEMENT', comparison
          assert [row['triage'] for row in comparison['entries']] == [
            'CONSENSUS_NUMERIC','CONSENSUS_NUMERIC','CONSENSUS_NUMERIC','HOLD_DISAGREEMENT'
          ]
          assert aggregate['state']=='COMPLETE'
          assert aggregate['observed_decisions']==aggregate['expected_decisions']==12
          assert aggregate['overall']['exact_agreement_count']==11
          assert aggregate['overall']['numeric_consensus_count']==9
          assert aggregate['overall']['shared_unknown_count']==2
          assert aggregate['overall']['disagreement_count']==1
          assert aggregate['overall']['unresolved_count']==0
          assert gate['state']=='AI_ONLY_RESEARCH_BETA_RC_PASS_WITH_VISIBLE_INCOMPLETENESS', gate
          assert all(value=='PASS' for value in gate['gates'].values()), gate['gates']
          PY

      - name: Write immutable evaluation receipt
        shell: bash
        env:
          EVAL_HEAD: ${{ github.sha }}
          EVAL_RUN_ID: ${{ github.run_id }}
          EVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v1-1-evaluation"
          python - "$out" <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          out=pathlib.Path(sys.argv[1])
          files={}
          for path in sorted(out.glob('*.json')):
              data=path.read_bytes()
              files[path.name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          tracked=[
            'docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/raw/OMG_NOV24_V101_AI1_COMPLETED.json',
            'docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/raw/OMG_NOV24_V101_AI2_COMPLETED.json',
            'docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/omg_nov24_v1_0_1/compare_primary_v101.py',
            'docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/aggregate_cohort_v101.py',
            'docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/MODEL_B_SUBSTITUTION_GEMINI31PRO_R2.md',
            'docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/release_gate_r1/evaluate_release_gate_r1.py',
          ]
          receipt={
            'schema':'AI_ONLY_RESEARCH_BETA_V1_1_EVALUATION_RECEIPT_R1',
            'github_run_id':os.environ['EVAL_RUN_ID'],
            'github_run_attempt':os.environ['EVAL_RUN_ATTEMPT'],
            'github_head_sha':os.environ['EVAL_HEAD'],
            'artifact_files':files,
            'pinned_git_blobs':{
              path:subprocess.check_output(['git','hash-object',path],text=True).strip()
              for path in tracked
            },
            'scientific_boundaries':{
              'r1_raw_outputs_edited':False,
              'coordinator_substitution':False,
              'targeted_adjudication':False,
              'old_omg_kvs5_pol50_restored':False,
              'historical_area_UNO':'NOT_COMPUTED',
              'human_validation':'NOT_PERFORMED',
              'predictive_validation':'NOT_CLAIMED',
              'auto_merge':False,
            },
          }
          target=out/'V1_1_EVALUATION_RECEIPT_R1.json'
          target.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload immutable V1.1 evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-only-v1-1-evaluation-r1
          path: ${{ runner.temp }}/v1-1-evaluation/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve release boundary
        shell: bash
        run: |
          echo 'R1_RAW_OUTPUTS_EDITED=false'
          echo 'OLD_OMG_KVS5_POL50_RESTORED=false'
          echo 'OMG_V101_CORE_REPLAY_EXECUTED=false'
          echo 'HISTORICAL_AREA_UNO_COMPUTED=false'
          echo 'HUMAN_VALIDATION_PERFORMED=false'
          echo 'AUTO_MERGE=false'
