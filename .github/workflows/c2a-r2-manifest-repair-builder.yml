# Temporary MAIN-authorized carrier builder. Must never enter canonical R2.
name: C2A R2 evidence-manifest repair payload carrier
'on':
  push:
    branches:
      - agent/c2a-r2-manifest-repair-builder-20260914
permissions:
  contents: write
concurrency:
  group: c2a-r2-manifest-repair-payload-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish-payload-blob:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish modified workflow bytes at a non-workflow carrier path
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=122360697634f8690299cad7254022039399a517
          CURRENT_TREE=9238eaf427280373c70b530d6885e3297aa36ece
          OLD_BLOB=1c7e5ae8d2603a9c51feedc5ab1d48177abc7f16
          WORKFLOW=.github/workflows/conflict-analysis.yml
          PAYLOAD=c2a-r2-manifest-repair-workflow-payload.txt

          git config user.name "OpenAI MAIN diagnostic"
          git config user.email "openai-main@users.noreply.github.com"
          test "$(git rev-parse "$CURRENT^{tree}")" = "$CURRENT_TREE"
          test "$(git rev-parse "$CURRENT:$WORKFLOW")" = "$OLD_BLOB"

          if [[ -f "$PAYLOAD" ]]; then
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            echo "PAYLOAD_ALREADY_PUBLISHED_SHA=$(git hash-object "$PAYLOAD")"
            exit 0
          fi

          git show "$CURRENT:$WORKFLOW" > "$PAYLOAD"
          python - "$PAYLOAD" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          delivery = '            "$delivery_tree" ' + chr(92)
          chrome_version_arg = '            "$C2A_CHROME_VERSION" ' + chr(92)
          chrome_sha_arg = '            "$C2A_CHROME_LINUX64_SHA256" <<\'PY\''
          positions = [
              i for i, line in enumerate(lines)
              if line == delivery
              and i + 2 < len(lines)
              and lines[i + 1] == chrome_version_arg
              and lines[i + 2] == chrome_sha_arg
          ]
          assert len(positions) == 1, positions
          i = positions[0]
          lines[i] = '            "$delivery_tree" <<\'PY\''
          del lines[i + 1:i + 3]
          remove = (
              "              chromium_archive_version,",
              "              chromium_archive_sha256,",
              '              "chromium_archive_version": chromium_archive_version,',
              '              "chromium_archive_sha256": chromium_archive_sha256,',
          )
          for needle in remove:
              assert lines.count(needle) == 1, (needle, lines.count(needle))
              lines.remove(needle)
          updated = "\n".join(lines) + "\n"
          assert '"chromium_archive_version": chromium_archive_version' not in updated
          assert '"chromium_archive_sha256": chromium_archive_sha256' not in updated
          path.write_text(updated, encoding="utf-8")
          print("CANONICAL_MANIFEST_SCHEMA_TWO_FIELD_REMOVAL=PASS")
          PY

          new_blob="$(git hash-object "$PAYLOAD")"
          test "$new_blob" != "$OLD_BLOB"
          git add -- "$PAYLOAD"
          test "$(git diff --cached --name-status)" = $'A\tc2a-r2-manifest-repair-workflow-payload.txt'
          git commit -m "ci: carry exact C2A manifest-repair workflow bytes"
          git push origin HEAD:refs/heads/agent/c2a-r2-manifest-repair-builder-20260914
          echo "PAYLOAD_BLOB_SHA=$new_blob"
