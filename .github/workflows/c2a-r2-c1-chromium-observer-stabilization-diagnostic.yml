# Temporary independent control-plane diagnostic. The tested checkout is the immutable candidate below.
name: C2A R2 C1 Chromium stabilization exact-head diagnostic
'on':
  push:
    branches:
      - agent/c2a-r2-c1-chromium-observer-stabilization-diagnostic-20260914
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: c2a-r2-c1-chromium-stabilization-diagnostic-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  exact-head-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: software/conflict_analysis
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_CONN_MAX_AGE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      C2A_R1_HEAD: 22f0f173a941de88d6920b6e19821168e9b30cc8
      C2A_R1_TREE: f407e609adb2a8b94770b521a1302feb79281822
      C2A_CHROME_VERSION: 152.0.7977.64
      C2A_CHROME_LINUX64_SHA256: 8b592f066af71f054aab2cc80fc26f73c775c6d44ebb99d16ade924b24756c2e
      USE_SQLITE: 'false'
      ACTIVE_SLICE: C2A
      SLICE_BASE_HEAD: 561ef5327bf655a558adb21c54d0fdf0559d7024
      SLICE_BASE_TREE: 5b209c782e1ac1a4783b01391dd59d813559ce57
      EXACT_FINAL_HEAD: 123f2b081ce2a09d7d193f9e4b20644f5802d7fe
      EXACT_FINAL_TREE: d67e39cbb965483f3c9cabcc91f724d8bf986fb4
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out literal stabilized R2 candidate detached
        uses: actions/checkout@v4
        with:
          ref: 123f2b081ce2a09d7d193f9e4b20644f5802d7fe
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute independently repinned proven diagnostic run blocks
        shell: bash
        run: |
          set -euo pipefail
          OLD_DIAG_BRANCH=agent/c2a-r2-canonical-manifest-repair-diagnostic-20260914
          OLD_DIAG_COMMIT=f87bace6cbfc961713f683ac5efa26e4352253fc
          OLD_DIAG_PATH=.github/workflows/c2a-r2-final-exact-head-diagnostic-order-repair.yml
          NEW_STAGING=agent/c2a-r2-c1-chromium-observer-stabilization-staging-20260914
          CURRENT_PR94_HEAD=244562c24cef21aa38b30d0b394c5706632876c8
          OLD_FINAL_HEAD=244562c24cef21aa38b30d0b394c5706632876c8
          OLD_FINAL_TREE=fb9660304decfb51a100befb73688466f861fa5c
          OLD_AUDITED_BLOB=6ce3fededdae818d0b13b92ebc04bfff982e5162
          NEW_AUDITED_BLOB=5ef172fc7cafddba2e8940e15343ea8381cf08f1
          OLD_STAGING=agent/c2a-r2-canonical-manifest-repair-staging-20260914
          OLD_PR94_EXPECTED=122360697634f8690299cad7254022039399a517
          OLD_DIAG_REF=agent/c2a-r2-canonical-manifest-repair-diagnostic-20260914
          NEW_DIAG_REF=agent/c2a-r2-c1-chromium-observer-stabilization-diagnostic-20260914

          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+refs/heads/${OLD_DIAG_BRANCH}:refs/remotes/origin/old-c2a-diagnostic"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/old-c2a-diagnostic)" = "$OLD_DIAG_COMMIT"
          raw="$RUNNER_TEMP/prior-diagnostic.yml"
          patched="$RUNNER_TEMP/repinned-diagnostic.yml"
          git -C "$GITHUB_WORKSPACE" show "$OLD_DIAG_COMMIT:$OLD_DIAG_PATH" > "$raw"

          python - "$raw" "$patched" <<'PY'
          from pathlib import Path
          import os
          import sys

          source, output = map(Path, sys.argv[1:])
          text = source.read_text(encoding='utf-8')
          replacements = {
              os.environ['OLD_FINAL_HEAD']: os.environ['EXACT_FINAL_HEAD'],
              os.environ['OLD_FINAL_TREE']: os.environ['EXACT_FINAL_TREE'],
              os.environ['OLD_AUDITED_BLOB']: os.environ['NEW_AUDITED_BLOB'],
              os.environ['OLD_STAGING']: os.environ['NEW_STAGING'],
              os.environ['OLD_PR94_EXPECTED']: os.environ['CURRENT_PR94_HEAD'],
              os.environ['OLD_DIAG_REF']: os.environ['NEW_DIAG_REF'],
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new)
              assert old not in text, old
          output.write_text(text, encoding='utf-8')
          print('DIAGNOSTIC_REPIN_IN_MEMORY=PASS')
          PY

          export OLD_FINAL_HEAD OLD_FINAL_TREE OLD_AUDITED_BLOB OLD_STAGING OLD_PR94_EXPECTED OLD_DIAG_REF
          export NEW_AUDITED_BLOB NEW_STAGING CURRENT_PR94_HEAD NEW_DIAG_REF

          scripts_dir="$RUNNER_TEMP/diagnostic-run-blocks"
          mkdir -p "$scripts_dir"
          python - "$patched" "$scripts_dir" <<'PY'
          from pathlib import Path
          import json
          import sys

          source = Path(sys.argv[1])
          out = Path(sys.argv[2])
          lines = source.read_text(encoding='utf-8').splitlines()
          steps = []
          current_name = None
          index = 0
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('    - name: '):
                  current_name = line[len('    - name: '):].strip()
                  i += 1
                  continue
              if line == '      run: |':
                  assert current_name
                  i += 1
                  body = []
                  while i < len(lines):
                      candidate = lines[i]
                      if candidate == '':
                          body.append('')
                          i += 1
                          continue
                      if candidate.startswith('        '):
                          body.append(candidate[8:])
                          i += 1
                          continue
                      break
                  index += 1
                  path = out / f'{index:02d}.sh'
                  path.write_text('\n'.join(body) + '\n', encoding='utf-8')
                  steps.append({'index': index, 'name': current_name, 'file': path.name})
                  current_name = None
                  continue
              i += 1
          assert len(steps) >= 15, len(steps)
          (out / 'steps.json').write_text(json.dumps(steps, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(steps, indent=2))
          print(f'DIAGNOSTIC_RUN_BLOCK_COUNT={len(steps)}')
          PY

          export_env_file() {
            if [[ ! -f "$GITHUB_ENV" ]]; then return 0; fi
            while IFS='=' read -r key value; do
              [[ -n "$key" ]] || continue
              [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$GITHUB_ENV"
          }

          mapfile -t step_rows < <(python - "$scripts_dir/steps.json" <<'PY'
          import json, sys
          for step in json.load(open(sys.argv[1], encoding='utf-8')):
              print(f"{step['index']}\t{step['file']}\t{step['name']}")
          PY
          )
          for row in "${step_rows[@]}"; do
            IFS=$'\t' read -r idx file name <<< "$row"
            export USE_SQLITE=false
            unset SQLITE_PATH HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY READBACK_PHASE ACCEPTANCE_JOB_STATUS || true
            case "$name" in
              "Read PR94 and protected refs before acceptance") export READBACK_PHASE=before ;;
              "Read PR94 and protected refs after acceptance") export READBACK_PHASE=after ;;
              "Run exact portable 13 and Foundation PostgreSQL registries"|"Run C0 and C1 successor regression on PostgreSQL")
                export HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 NO_PROXY=127.0.0.1,localhost ;;
              "Run exact portable 13 and Foundation SQLite registries")
                export USE_SQLITE=true SQLITE_PATH="$RUNNER_TEMP/successor-foundation-sqlite.sqlite3" ;;
              "Run C0 and C1 successor regression on SQLite")
                export USE_SQLITE=true SQLITE_PATH="$RUNNER_TEMP/successor-product-sqlite.sqlite3" ;;
              "Record separate diagnostic artifact inventory and observed runtime") export ACCEPTANCE_JOB_STATUS=success ;;
            esac
            echo "===== DIAGNOSTIC STEP $idx: $name ====="
            bash "$scripts_dir/$file"
            export_env_file
          done
          echo "INDEPENDENT_REPINNED_EXACT_HEAD_DIAGNOSTIC_RUN_BLOCKS=PASS"
      - name: Upload exact-checkout acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2a-r2-chromium-stabilization-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/successor-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Upload independent diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2a-r2-chromium-stabilization-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostic-evidence
          if-no-files-found: error
          retention-days: 30
