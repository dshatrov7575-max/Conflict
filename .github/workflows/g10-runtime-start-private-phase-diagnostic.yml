name: G10 runtime-start private-phase diagnostic

on:
  push:
    branches: [codex/g10-runtime-start-private-phase-diagnostic-20260914]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DJANGO_SETTINGS_MODULE: conflict_analysis.settings
  DJANGO_DEBUG: "false"

jobs:
  runtime-start-private-phase:
    if: github.repository == 'dshatrov7575-max/Conflict'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frozen target
        id: target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4a0f0cb42aaea8d9d5f368cdc3d3de15db2f6d03
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Prepare external bounded diagnostic harness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/g10-runtime-bounded.py" <<'PY'
          import hashlib
          import subprocess
          import threading
          
          def bounded(label, args, *, data=None, timeout=60, env=None):
              """Drain both streams, hash every byte, retain at most 8192 bytes combined."""
              process = subprocess.Popen(args, stdin=subprocess.PIPE if data is not None else subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env)
              budget = [8192]
              lock = threading.Lock()
              streams = {}
              private = {}
              def drain(name, stream):
                  digest, size, kept = hashlib.sha256(), 0, bytearray()
                  while True:
                      chunk = stream.read(4096)
                      if not chunk:
                          break
                      digest.update(chunk)
                      size += len(chunk)
                      with lock:
                          count = min(len(chunk), budget[0])
                          budget[0] -= count
                      kept.extend(chunk[:count])
                  streams[name] = {"bytes": size, "sha256": digest.hexdigest(),
                                   "captured_bytes": len(kept), "text_recorded": False}
                  private[name] = bytes(kept)
              threads = [threading.Thread(target=drain, args=(name, stream), daemon=True)
                         for name, stream in (("stdout", process.stdout), ("stderr", process.stderr))]
              for thread in threads:
                  thread.start()
              if data is not None:
                  try:
                      process.stdin.write(data)
                      process.stdin.close()
                  except BrokenPipeError:
                      pass
              timed_out = False
              try:
                  code = process.wait(timeout=timeout)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  process.kill()
                  code = process.wait()
              for thread in threads:
                  thread.join()
              return {"label": label, "exit_code": code, "timed_out": timed_out,
                      "capture_limit_combined": 8192, "stdout": streams["stdout"], "stderr": streams["stderr"]}, private
          
          PY
          cat > "$RUNNER_TEMP/g10-runtime-container-probe.py" <<'PY'
