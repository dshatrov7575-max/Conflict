          def load_definitions(expected_sha):
              raw = SUPERVISOR.read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_sha:
                  raise RuntimeError("supervisor source identity")
              code = raw.decode().split("<<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
              module = ast.parse(code)
              if not isinstance(module.body[-1], ast.Try):
                  raise RuntimeError("supervisor dispatch structure")
              # Evaluate unchanged declarations only. Never execute its final main() dispatch.
              declarations = ast.Module(body=module.body[:-1], type_ignores=[])
              namespace = {"__name__": "frozen_supervisor_diagnostic"}
              exec(compile(declarations, str(SUPERVISOR), "exec"), namespace)
              return namespace
          
          def controlled_checks(expected_sha):
              result = {}
              os.environ.update(ENVIRONMENT)
              pg, _ = bounded("postgres_isready_as_owneralpha",
                              ["runuser", "-u", "owneralpha", "--", "/usr/lib/postgresql/18/bin/pg_isready",
                               "-h", "/run/owner-alpha-pg", "-d", "conflict_analysis", "-U", "owneralpha"], timeout=15)
              pg["status"] = {0:"ACCEPTING",1:"REJECTING",2:"NO_RESPONSE",3:"NO_ATTEMPT"}.get(pg["exit_code"], "UNKNOWN")
              result["postgres_status"] = pg
              namespace = None
              try:
                  # The existing secret is consumed only by the unchanged configure_env();
                  # no environment, state mapping, user object or exception text is emitted.
                  with open(os.devnull, "w") as sink, contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                      namespace = load_definitions(expected_sha)
                      namespace["configure_env"]()
                  result["environment"] = {"outcome":"PASS","method":"unchanged configure_env; values never recorded"}
              except Exception as exc:
                  result["environment"] = failure(exc)
              if result["environment"]["outcome"] == "PASS":
                  try:
                      with open(os.devnull, "w") as sink, contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                          from django.db import connection
                          from django.db.migrations.executor import MigrationExecutor
                          connection.ensure_connection()
                          executor = MigrationExecutor(connection)
                          leaf = executor.loader.graph.leaf_nodes("domain")
                          exact = leaf == [("domain", "0018_workspace_assessment_projection")]
                          pending = len(executor.migration_plan(executor.loader.graph.leaf_nodes()))
                          applied = ("domain", "0018_workspace_assessment_projection") in executor.loader.applied_migrations
                      result["migrations"] = {"outcome":"PASS" if exact and applied and pending == 0 else "FAIL",
                                              "exact_leaf": exact, "leaf_0018_applied": applied, "pending_migrations":pending}
                  except Exception as exc:
                      result["migrations"] = failure(exc)
                  try:
                      with open(os.devnull, "w") as sink, contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                          namespace["users"]()
                      result["canonical_users"] = {"outcome":"PASS","method":"unchanged users(create=False); no user data recorded"}
                  except Exception as exc:
                      result["canonical_users"] = failure(exc)
                  try:
                      with open(os.devnull, "w") as sink, contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                          from django.db import connection
                          with connection.cursor() as cursor:
                              cursor.execute("SELECT version(), current_database(), inet_server_addr()")
                              row = cursor.fetchone()
                          predicates = {"postgresql_18_4":row[0].startswith("PostgreSQL 18.4 "),
                                        "database_expected":row[1]=="conflict_analysis","server_address_is_null":row[2] is None}
                      result["database_health_predicates"] = {"outcome":"PASS" if all(predicates.values()) else "FAIL", **predicates}
                  except Exception as exc:
                      result["database_health_predicates"] = failure(exc)
                  command, _ = bounded("gunicorn_check_config_as_owneralpha",
                      ["runuser","-u","owneralpha","--","/opt/owner-alpha/venv/bin/gunicorn",
                       "--check-config","--config","/opt/owner-alpha/gunicorn.conf.py",
                       "conflict_analysis.wsgi:application"], timeout=45)
                  result["gunicorn_check_config"] = command
                  if (RUN/"nginx.conf").is_file():
                      command, _ = bounded("nginx_test_config_as_owneralpha",
                          ["runuser","-u","owneralpha","--","nginx","-t","-c","/run/owner-alpha/nginx.conf"], timeout=30)
                      result["nginx_test_config"] = command
                  else:
                      result["nginx_test_config"] = {"outcome":"NOT_EXECUTED","reason":"CONFIG_ABSENT"}
              else:
                  for key in ("migrations","canonical_users","database_health_predicates","gunicorn_check_config","nginx_test_config"):
                      result[key] = {"outcome":"NOT_EXECUTED","reason":"EXACT_RUNTIME_ENV_UNAVAILABLE"}
              return result
          
          def readiness():
              rows = listeners()
              available = any(item["address"] == "127.0.0.1" and item["port"] == PORT
                              for items in rows.values() for item in items)
              result = {"attempts":0,"status":None,"result_class":"NO_REQUESTED_LOOPBACK_LISTENER"}
              if available:
                  result["attempts"] = 1
                  connection = http.client.HTTPConnection("127.0.0.1", PORT, timeout=10)
                  try:
                      # No redirect, response body, headers or cookies are read into evidence.
                      connection.request("GET", "/player/")
                      response = connection.getresponse()
                      result["status"] = response.status
                      result["result_class"] = ("READY" if response.status == 200 else "AUTH_BOUNDARY"
                                                if response.status in (401,403) else "UNEXPECTED_HTTP_STATUS")
                      response.close()
                  except Exception:
                      result["result_class"] = "TRANSPORT_ERROR"
                  finally:
                      connection.close()
              return result
          
          try:
              operation = sys.argv[1]
              if operation == "snapshot":
