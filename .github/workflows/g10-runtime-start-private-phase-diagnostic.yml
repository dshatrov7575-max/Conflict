              "PYTHONDONTWRITEBYTECODE": "1", "PYTHONHASHSEED": "0",
          }
          
          def failure(exc):
              return {"outcome": "FAIL", "exception_type": type(exc).__name__}
          
          def metadata(path):
              row = {"path": str(path), "exists": False}
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return row
              kind = ("directory" if stat.S_ISDIR(info.st_mode) else "regular" if stat.S_ISREG(info.st_mode)
                      else "socket" if stat.S_ISSOCK(info.st_mode) else "symlink" if stat.S_ISLNK(info.st_mode) else "other")
              row.update(exists=True, uid=info.st_uid, gid=info.st_gid, mode=oct(stat.S_IMODE(info.st_mode)),
                         type=kind, bytes=info.st_size)
              return row
          
          def process_identity(pid):
              row = {"pid": pid, "exists": False, "comm": None}
              try:
                  raw = Path("/proc") / str(pid) / "comm"
                  comm = raw.read_bytes()[:64].decode("ascii", errors="strict").strip()
                  row["exists"] = True
                  row["comm"] = comm if re.fullmatch(r"[A-Za-z0-9_. ():-]{1,63}", comm) else "UNSAFE_COMM_SUPPRESSED"
              except FileNotFoundError:
                  pass
              return row
          
          def pidfile(path):
              row = {"pidfile": str(path), "pid": None, "exists": False, "comm": None}
              if not path.exists():
                  return row
              with path.open("rb") as stream:
                  line = stream.readline(32).strip()
              if not re.fullmatch(rb"[1-9][0-9]{0,9}", line):
                  row["invalid_pidfile"] = True
                  return row
              row.update(process_identity(int(line)))
              return row
          
          def listeners():
              rows = {}
              for filename in ("tcp", "tcp6"):
                  path = Path("/proc/net") / filename
                  result = []
                  with path.open() as stream:
                      next(stream)
                      for line in stream:
                          columns = line.split()
                          if columns[3] != "0A":
                              continue
                          address, port = columns[1].split(":")
                          raw = bytes.fromhex(address)
                          decoded = ipaddress.ip_address(raw[::-1] if filename == "tcp" else
                                                         b"".join(raw[i:i+4][::-1] for i in range(0, 16, 4)))
                          result.append({"address": str(decoded), "port": int(port, 16),
                                         "loopback": decoded.is_loopback, "state": "LISTEN"})
                          if len(result) > 64:
                              raise RuntimeError("listener bound")
                  rows[str(path)] = result
              return rows
          
          def snapshot():
              phase = json.loads(Path("/var/lib/owner-alpha/state.json").read_bytes()).get("phase")
              if phase not in PHASES:
                  raise RuntimeError("phase not allowlisted")
              pg_processes = []
              for path in Path("/proc").iterdir():
                  if path.name.isdigit():
                      item = process_identity(int(path.name))
                      if item["comm"] == "postgres":
                          pg_processes.append(item)
              if len(pg_processes) > 64:
                  raise RuntimeError("process bound")
              return {"state_phase": phase, "paths": {str(p): metadata(p) for p in FILES},
                      "pidfiles": {name: pidfile(path) for name, path in {
                          "postgres": Path("/var/lib/owner-alpha/postgres/postmaster.pid"),
                          "gunicorn": RUN/"gunicorn.pid", "nginx": RUN/"nginx.pid"}.items()},
