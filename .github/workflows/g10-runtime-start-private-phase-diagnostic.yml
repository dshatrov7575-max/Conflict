                  raise RuntimeError(label)
          
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",",":"), ensure_ascii=True)+"\n").encode()
          
          def identity(path):
              require(path.is_file() and not path.is_symlink(), "regular file identity")
              with path.open("rb") as stream:
                  sha = hashlib.file_digest(stream,"sha256").hexdigest()
              return {"filename":path.name,"bytes":path.stat().st_size,"sha256":sha}
          
          def git(repo, *args):
              return subprocess.check_output(["git","--no-optional-locks","-C",str(repo),*args],text=True,timeout=90).strip()
          
          def revision(repo, ref):
              return {"head":git(repo,"rev-parse",ref),"tree":git(repo,"rev-parse",ref+"^{tree}"),
                      "parent":git(repo,"show","-s","--format=%P",ref)}
          
          def remote(repo):
              lines = git(repo,"ls-remote","--heads","origin","refs/heads/"+TARGET_BRANCH).splitlines()
              require(len(lines)==1 and lines[0].split()[1]=="refs/heads/"+TARGET_BRANCH, "target remote ref")
              return lines[0].split()[0]
          
          def snapshot(repo):
              paths = subprocess.check_output(["git","--no-optional-locks","-C",str(repo),"ls-files","-z"])
              rows = []
              for name in sorted(x.decode() for x in paths.split(b"\0") if x):
                  path = repo / name
                  if path.is_symlink():
                      raw = os.readlink(path).encode()
                      rows.append([name,"symlink",len(raw),hashlib.sha256(raw).hexdigest()])
                  else:
                      meta = identity(path)
                      rows.append([name,"file",meta["bytes"],meta["sha256"]])
