name: AI-only V1.1 technical repair package preflight

on:
  push:
    branches:
      - review/ai-only-research-beta-v1-1-fast-repair
    paths:
      - ".github/workflows/ai-only-v1-1-package-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    name: Verify frozen prompts and comparator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact freeze head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact Git blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "Blob mismatch: $path expected=$expected actual=$actual" >&2
              exit 21
            }
          }
          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/omg_nov24_v1_0_1
          check_blob "$root/06_AI1_STANDALONE_RU.md" 225bf43b4e90b1c049f136c77e7f2ce1c53aa0e3
          check_blob "$root/07_AI2_STANDALONE_RU.md" 9a5f103db14541c7379444886bc83b386224cacf
          check_blob "$root/compare_primary_v101.py" 3f62d8e164c48d1e0802f6a880000e927c7f7955

      - name: Validate prompt contracts
        shell: bash
        run: |
          set -euo pipefail
          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/omg_nov24_v1_0_1
          grep -F 'OMG_NOV24_V101_AI1' "$root/06_AI1_STANDALONE_RU.md"
          grep -F 'OMG_NOV24_V101_AI2' "$root/07_AI2_STANDALONE_RU.md"
          for file in "$root/06_AI1_STANDALONE_RU.md" "$root/07_AI2_STANDALONE_RU.md"; do
            grep -F '"run_id"' "$file"
            grep -F '"completed_at_utc"' "$file"
            grep -F '"actual_model_label"' "$file"
            grep -F '"model_label_source"' "$file"
          done

      - name: Comparator self-test
        shell: bash
        run: |
          set -euo pipefail
          python docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/omg_nov24_v1_0_1/compare_primary_v101.py --self-test | tee /tmp/self-test.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/self-test.json', encoding='utf-8'))
          assert x == {'self_test':'PASS','cases':10}, x
          PY

      - name: Preserve scientific boundary
        shell: bash
        run: |
          echo 'SCIENTIFIC_INPUT_CHANGED=false'
          echo 'R1_RAW_OUTPUTS_EDITED=false'
          echo 'OLD_OMG_KVS5_POL50_RESTORED=false'
          echo 'READY_FOR_ONE_AI1_AND_ONE_AI2_DISPATCH=true'
