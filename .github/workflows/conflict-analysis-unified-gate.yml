name: Conflict Analysis Unified Product Gate

on:
  pull_request:
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis-unified-gate.yml"
  push:
    branches:
      - main
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis-unified-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conflict-analysis-unified-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-product-gate:
    name: Required / Unified Product Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        shell: bash
        working-directory: software/conflict_analysis

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-deployment
      DJANGO_DEBUG: "false"
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      USE_SQLITE: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PLAYER_INTEGRATION_BROWSER: "1"
      SCENARIO_BROWSER: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install build and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev]"

      - name: Locate Chromium
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --version
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "STUDIO_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"

      - name: Build the single supported wheel
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/conflict-analysis-wheel"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          sha256sum "$wheel"
          echo "CONFLICT_ANALYSIS_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "STUDIO_C0_WHEEL=$wheel" >> "$GITHUB_ENV"

      - name: Verify isolated installed-wheel composition
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/conflict-analysis-installed-wheel"
          static_root="$RUNNER_TEMP/conflict-analysis-static"
          rm -rf "$target" "$static_root"
          mkdir -p "$target" "$static_root"
          python -m pip install --no-deps --target "$target" "$CONFLICT_ANALYSIS_WHEEL"
          cd "$RUNNER_TEMP"
          PYTHONPATH="$target" CONFLICT_STATIC_ROOT="$static_root" python - <<'PY'
          import os
          from pathlib import Path

          target = Path(os.environ["PYTHONPATH"]).resolve()
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "conflict_analysis.settings")

          import conflict_analysis
          import player_integration
          import scenario_modeling
          import django

          for module in (conflict_analysis, player_integration, scenario_modeling):
              assert Path(module.__file__).resolve().is_relative_to(target), module.__file__

          django.setup()
          from django.core.checks import run_checks
          from django.core.management import call_command
          from django.template.loader import get_template
          from django.test.utils import override_settings
          from django.urls import reverse
          from django.contrib.staticfiles import finders

          assert not run_checks()
          assert reverse("player_integration:start") == "/player/calculations/"
          assert reverse("scenario_modeling:update") == "/player/calculations/scenarios/"
          for name in (
              "player_integration/start.html",
              "player_integration/result.html",
              "scenario_modeling/result.html",
          ):
              get_template(name)
          for name in (
              "player_integration/result.css",
              "scenario_modeling/scenario.css",
              "scenario_modeling/scenario.js",
          ):
              assert finders.find(name), name
          with override_settings(STATIC_ROOT=os.environ["CONFLICT_STATIC_ROOT"]):
              call_command("collectstatic", interactive=False, verbosity=0, clear=True)
          print("INSTALLED_WHEEL_COMPOSITION=PASS")
          PY

      - name: Verify migrations and Django configuration
        run: |
          set -euo pipefail
          python manage.py check --settings=conflict_analysis.settings
          python manage.py makemigrations --check --dry-run --settings=conflict_analysis.settings
          python manage.py migrate --noinput --settings=conflict_analysis.settings

      - name: Run the complete PostgreSQL product gate
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          set -euo pipefail
          python -m pytest --junitxml="$RUNNER_TEMP/conflict-analysis-unified.xml"

      - name: Verify generated test receipt
        if: always()
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/conflict-analysis-unified.xml"
          if [[ "${{ job.status }}" == "success" ]]; then
            test -s "$receipt"
            python - "$receipt" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          failures = root.findall(".//failure") + root.findall(".//error")
          skipped = root.findall(".//skipped")
          assert not failures, len(failures)
          assert not skipped, len(skipped)
          tests = sum(int(node.attrib.get("tests", "0")) for node in root.findall(".//testsuite"))
          assert tests > 0
          print(f"UNIFIED_REQUIRED_GATE=PASS tests={tests}")
          PY
          fi
