name: MVP7 exact C restore and test harness diagnostics
'on':
  push:
    branches:
    - codex/mvp7-c-restore-diagnostic-20260917
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp7-c-restore-diagnostic-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  HEAD_C: ce522813cfbfd26c3a06fd53fbde54939559e4d9
  TREE_C: 266bc4de81b6fb60fabc12175f9dd4773fa4104d
  PARENT_C: 7011f31c8b4a8a21986b85da18d5337e64c7aa28
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Prove one diagnostic commit and detached exact installer C
      run: |
        set -euo pipefail
        test "$(git show -s --format=%P HEAD)" = "$HEAD_C"
        test "$(git show -s --format=%B HEAD)" = 'test(installer): isolate MVP7 restore failure'
        test "$(git rev-list --count "$HEAD_C..HEAD")" = 1
        test "$(git diff --name-status --no-renames "$HEAD_C" HEAD)" = $'A\t.github/workflows/mvp7-c-restore-diagnostic.yml'
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        git worktree add --detach "$RUNNER_TEMP/exact-c" "$HEAD_C"
        test "$(git -C "$RUNNER_TEMP/exact-c" rev-parse HEAD)" = "$HEAD_C"
        test "$(git -C "$RUNNER_TEMP/exact-c" rev-parse HEAD^{tree})" = "$TREE_C"
        test "$(git -C "$RUNNER_TEMP/exact-c" show -s --format=%P HEAD)" = "$PARENT_C"
        test -z "$(git -C "$RUNNER_TEMP/exact-c" branch --show-current)"
        test -z "$(git -C "$RUNNER_TEMP/exact-c" status --porcelain=v1 --untracked-files=all)"
        test "$(gh api repos/dshatrov7575-max/Conflict/git/ref/heads/codex/mvp7-r1-windows-setup-20260917 --jq '.object.sha')" = "$HEAD_C"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Fetch exact C frozen Linux build closure
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/exact-c"
        python3.12 software/conflict_analysis/installer/fetch_inputs.py --output "$RUNNER_TEMP/mvp7-inputs"
        docker pull --platform linux/amd64 docker.io/library/python@sha256:2fe5997d249a808b8eeea52c58a1dbffbba28754dc11699ef5c029f2d818ce79
        docker pull --platform linux/amd64 docker.io/library/postgres@sha256:4cc13dede823cab4e05290c7fb3350fb4e599ecabd9b07e6706b5d5e8f5bc929
        python3.12 -m venv "$RUNNER_TEMP/mvp7-tooling"
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -m pip install --no-index --no-deps --require-hashes --find-links="$RUNNER_TEMP/mvp7-inputs" -r "$RUNNER_TEMP/mvp7-inputs/ci.lock"
    - name: Rebuild exact C inner ZIP twice with original frozen pipeline
      env:
        MVP7_INPUT_CACHE: ${{ runner.temp }}/mvp7-inputs
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/exact-c"
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -B software/conflict_analysis/scripts/build_owner_alpha_package.py --repository "$RUNNER_TEMP/exact-c" --output "$RUNNER_TEMP/mvp7-inner"
    - name: Create restore observer only in RUNNER_TEMP
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/diagnostic-harness" "$RUNNER_TEMP/safe-evidence"
        cat > "$RUNNER_TEMP/diagnostic-harness/sitecustomize.py" <<'DIAGNOSTIC_FILE'
        import ast,atexit,hashlib,json,os,re,sys
        from pathlib import Path
        SOURCE=Path('/opt/owner-alpha/owner-alpha-supervisor.sh')
        OUT=Path('/diagnostic-output/restore-observation.json')
        def meta(data):
            assert isinstance(data,bytes)
            return {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
        def canonical(value):
            return (json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False)+'\n').encode()
        def setup(shell):
            global offset,anchors,streams,exceptions,fatal,failed_command,trace_fault,graph_values,graph_evidence,role_evidence
            prefix,body=shell.split("<<'PY'\n",1);offset=prefix.count('\n')+1
            code=body.rsplit('\nPY',1)[0];module=ast.parse(code)
            node=next(n for n in module.body if isinstance(n,ast.FunctionDef) and n.name=='restore_stream')
            lines=code.splitlines()
            def line(needle):
                matches=[i+1 for i in range(node.lineno-1,node.end_lineno) if needle in lines[i]]
                assert len(matches)==1
                return matches[0]
            anchors=sorted((line(needle),name) for name,needle in [
                ('RESTORE_PHASE_EMPTY','need(state()["phase"]=="EMPTY"'),
                ('ARCHIVE_MEMBER_SET','candidate=STATE/"restore-candidate"'),
                ('ARCHIVE_MEMBER_TYPE','for member in members:'),
                ('MANIFEST_SCHEMA','manifest=read(candidate/"private-manifest.json")'),
                ('BACKUP_RUNTIME_IDENTITY','need(manifest["runtime_id"]==runtime_id()'),
                ('OBJECT_SET','need(set(manifest["objects"])'),
                ('OBJECT_HASH','for name,meta in manifest["objects"].items():'),
                ('ROLE_BASELINE','globals_sql=(candidate/"globals.sql").read_text()'),
                ('GLOBAL_ROLE_SET','created=re.findall('),
                ('GLOBAL_ROLE_RECONCILIATION','globals_sql=re.sub('),
                ('PG_RESTORE','pgcommand(["pg_restore"'),
                ('FULL_GRAPH_EQUAL','need(graph()==read(candidate/"logical.json")'),
                ('PRINCIPAL_RESTORE','shutil.copyfile(candidate/"principals.json"'),
                ('USER_SCOPE_VERIFY','configure_env(); users()'),
                ('MIGRATION_PLAN','from django.db import connection'),
                ('SESSION_REVOKE','session_revoke()'),
                ('GRAPH_WITHOUT_SESSIONS_EQUAL','need(graph(False)==read(candidate/"logical-without-sessions.json"'),
            ])
            streams={};exceptions={};fatal=None;failed_command=None;trace_fault=False
            graph_values={};graph_evidence=None;role_evidence=None
            return code

        def ancestor(frame,name):
            while frame:
                if frame.f_code.co_filename=='<stdin>' and frame.f_code.co_name==name:return frame
                frame=frame.f_back
            return None

        def label(frame):
            owner=ancestor(frame,'restore_stream')
            if owner is None:return None
            return next((name for number,name in reversed(anchors) if number<=owner.f_lineno),'RESTORE_PHASE_EMPTY')

        def graph_summary(before,after):
            assert isinstance(before,dict) and isinstance(after,dict)
            different=sorted(k for k in before.keys()|after.keys() if before.get(k)!=after.get(k))
            def count(value):
                if isinstance(value,dict) and type(value.get('rows')) is int:return value['rows']
                if isinstance(value,list):return len(value)
                return None
            return {'equal':before==after,'key_count_before':len(before),'key_count_after':len(after),
                'differing_key_names':different,'differences':[{'key':key,
                    'sha256_before':hashlib.sha256(canonical(before.get(key))).hexdigest(),
                    'sha256_after':hashlib.sha256(canonical(after.get(key))).hexdigest(),
                    'row_count_before':count(before.get(key)),'row_count_after':count(after.get(key))} for key in different]}

        def trace(frame,event,arg):
            global fatal,failed_command,trace_fault,graph_evidence,role_evidence
            try:
                filename=frame.f_code.co_filename.replace('\\','/');name=frame.f_code.co_name
                if name=='_translate_newlines' and filename.endswith('/subprocess.py') and event=='call':
                    owner=ancestor(frame,'execute')
                    if owner is not None:
                        raw=frame.f_locals.get('data');parent=frame.f_back
                        if isinstance(raw,bytes):
                            for stream in ('stdout','stderr'):
                                if parent.f_locals.get(stream) is raw:streams.setdefault(id(owner),{})[stream]=meta(raw)
                if filename!='<stdin>':return None
                phase=label(frame)
                if name=='execute' and event=='call':streams[id(frame)]={}
                if name=='execute' and event=='line' and 'result' in frame.f_locals:
                    result=frame.f_locals['result']
                    if result.returncode!=0 and failed_command is None:
                        record=streams.get(id(frame),{})
                        for stream in ('stdout','stderr'):
                            raw=getattr(result,stream)
                            if isinstance(raw,bytes):record[stream]=meta(raw)
                        failed_command={'exit_code':result.returncode,'stdout':record.get('stdout'),
                            'stderr':record.get('stderr'),'raw_pipe_hashes_complete':set(record)=={'stdout','stderr'}}
                if phase in ('FULL_GRAPH_EQUAL','GRAPH_WITHOUT_SESSIONS_EQUAL') and event=='return' and arg is not None:
                    if name=='graph':graph_values.setdefault(phase,{})['after']=arg
                    if name=='read' and frame.f_back.f_code.co_name=='restore_stream':graph_values.setdefault(phase,{})['before']=arg
                if name=='need' and event=='call' and frame.f_locals.get('value') is False:
                    if phase in graph_values:
                        pair=graph_values[phase]
                        if set(pair)=={'before','after'}:graph_evidence=graph_summary(pair['before'],pair['after'])
                    if phase in ('ROLE_BASELINE','GLOBAL_ROLE_SET'):
                        owner=ancestor(frame,'restore_stream')
                        names=owner.f_locals.get('roles' if phase=='ROLE_BASELINE' else 'created',[])
                        assert all(isinstance(x,str) and len(x)<=128 for x in names)
                        role_evidence={'names':names,'count':len(names)}
                if event=='exception' and isinstance(arg[1],Exception):
                    exc=arg[1]
                    code=getattr(exc,'code',None)
                    if not isinstance(code,str) or not re.fullmatch('BLOCKED_[A-Z0-9_]+',code):code=None
                    entry={'function':name,'line':frame.f_lineno+offset,'phase':phase,
                           'exception_type':type(exc).__name__,'public_halt_code':code}
                    if name=='need':entry['predicate_result']=frame.f_locals.get('value') if type(frame.f_locals.get('value')) is bool else None
                    bucket=exceptions.setdefault(id(exc),{'exception':exc,'entries':[]})['entries'];bucket.append(entry)
                    if name=='<module>' and fatal is None:
                        origin=bucket[0];site=next((x for x in bucket if x['function'] not in ('need','<module>')),origin)
                        fatal={**site,'assertion':origin['function']=='need'}
                        if origin['function']=='need':fatal['predicate_result']=origin.get('predicate_result')
            except Exception:trace_fault=True
            return trace

        def result():
            classification='ROOT_CAUSE_NOT_YET_PROVEN'
            if fatal and fatal['phase'] and not trace_fault:
                if failed_command and failed_command['raw_pipe_hashes_complete']:classification='RESTORE_COMMAND_FAILURE_PROVEN'
                elif fatal['assertion'] and failed_command is None:classification='FIRST_RESTORE_ASSERTION_PROVEN'
            report={'classification':classification,'FIRST_RESTORE_PHASE':fatal['phase'] if fatal else None,
                'failure':fatal,'failed_command':failed_command,'trace_fault':trace_fault}
            if fatal and fatal['phase'] in ('FULL_GRAPH_EQUAL','GRAPH_WITHOUT_SESSIONS_EQUAL') and graph_evidence is not None:
                report['graph_equality']=graph_evidence
            if fatal and fatal['phase'] in ('ROLE_BASELINE','GLOBAL_ROLE_SET') and role_evidence is not None:
                report['roles']=role_evidence
            return report

        def finish():
            sys.settrace(None)
            try:
                report=result();report['supervisor_sha256']=hashlib.sha256(SOURCE.read_bytes()).hexdigest()
                OUT.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
            except Exception:
                OUT.write_text(json.dumps({'classification':'ROOT_CAUSE_NOT_YET_PROVEN','FIRST_RESTORE_PHASE':None,'harness_fault':True})+'\n')

        if sys.argv==['-','restore'] and os.environ.get('MVP7_RESTORE_DIAGNOSTIC')=='1' and os.geteuid()==0:
            setup(SOURCE.read_text());atexit.register(finish);sys.settrace(trace)
        DIAGNOSTIC_FILE
    - name: Create exact probe and restore driver only in RUNNER_TEMP
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/diagnostic-harness/driver.py" <<'DIAGNOSTIC_FILE'
        import ast,hashlib,json,os,subprocess,sys,uuid
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP']);source=root/'exact-c';app=source/'software/conflict_analysis'
        sys.path.insert(0,str(app/'scripts'))
        import verify_owner_alpha_package as verify
        output=root/'mvp7-inner';archive_path=output/'conflict-analysis-partner-demo-win-x64-mvp7.zip'
        verify.verify_zip(archive_path,expected_bytes=590868984,expected_sha256='2280c51b8f7a0c02123a1aafd38c909fbe88dfc4de80114a7d855bb720f99dcb')
        identity=verify.delivery_identity(source)
        assert identity=={'head':os.environ['HEAD_C'],'tree':os.environ['TREE_C'],'parent':os.environ['PARENT_C']}
        rootfs=output/'conflict-analysis-functional-alpha-rootfs.tar'
        rootfs_hash=verify.sha256_file(rootfs)
        script=app/'owner_alpha_package/linux/owner-alpha-supervisor.sh'
        script_hash=verify.sha256_file(script)
        tests_path=app/'owner_alpha_package/tests/test_linux_contract.py'
        tests_hash=verify.sha256_file(tests_path)
        module=ast.parse(tests_path.read_text())
        functions={n.name:n for n in module.body if isinstance(n,ast.FunctionDef)}
        def literal(function,name):
            candidates=[n.value.value for n in ast.walk(functions[function]) if isinstance(n,ast.Assign)
                and any(isinstance(t,ast.Name) and t.id==name for t in n.targets)
                and isinstance(n.value,ast.Constant) and isinstance(n.value.value,str)]
            assert len(candidates)==1
            return candidates[0]
        readiness=literal('_assert_actual_daemon_readiness','proof')
        prepare=literal('test_preexisting_empty_private_pid_files_start_and_restart_without_traceback','prepare')
        workspace_values=[n.value for n in ast.walk(functions['test_mvp7_zero_permission_profile_matrix_geography_write_and_restart_persistence'])
            if isinstance(n,ast.Constant) and isinstance(n.value,str) and n.value.startswith('from domain.services.zhanaozen_typed_manifest import WORKSPACE_ID;')]
        assert len(workspace_values)==1
        fixture_values=[n.args[0].value for n in ast.walk(functions['test_backup_restore_stop_reset_and_uninstall_have_exact_nondestructive_or_destructive_boundaries'])
            if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='sql'
            and n.args and isinstance(n.args[0],ast.Constant) and isinstance(n.args[0].value,str)
            and 'CREATE TABLE g10_parent' in n.args[0].value]
        assert len(fixture_values)==1
        fixture=fixture_values[0]

        def run(args,*,input=None,ok=True):
            result=subprocess.run([str(x) for x in args],input=input,capture_output=True)
            if ok and result.returncode:raise RuntimeError('DIAGNOSTIC_COMMAND_FAILED')
            return result

        def metadata(result):
            return {'exit_code':result.returncode,**{name:{'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                for name,data in [('stdout',result.stdout),('stderr',result.stderr)]}}

        image='mvp7-c-diagnostic:'+uuid.uuid4().hex;containers=[]
        harness=root/'diagnostic-harness';scratch=root/'restore-observation';scratch.mkdir(mode=0o700)
        (scratch/'restore-observation.json').write_text('{}');(scratch/'restore-observation.json').chmod(0o600)
        evidence=root/'safe-evidence'
        common={'exact_c_checkout_clean_before':True,'source':identity,'inner_zip':verify.identity(archive_path),'supervisor_sha256':script_hash,'tests_sha256':tests_hash}
        probes={**common,'classification':'INSUFFICIENT_EVIDENCE','probes':[],'harness_gate_complete':False}
        restored={**common,'classification':'ROOT_CAUSE_NOT_YET_PROVEN','FIRST_RESTORE_PHASE':None,'restore_count':0,'harness_gate_complete':False}

        def create(port=8765,empty=False,observe=False):
            name='mvp7-c-diagnostic-'+uuid.uuid4().hex
            args=['docker','run','--name',name,'--network=none']
            if observe:args+=['--mount','type=bind,src='+str(harness)+',dst=/diagnostic-harness,readonly',
                '--mount','type=bind,src='+str(scratch)+',dst=/diagnostic-output']
            args+=['-d','--entrypoint','/bin/sleep',image,'infinity']
            run(args);containers.append(name)
            assert json.loads(run(['docker','inspect','--format','{{json .HostConfig.NetworkMode}}',name]).stdout)=='none'
            assert run(['docker','exec',name,'sha256sum','/opt/owner-alpha/owner-alpha-supervisor.sh']).stdout.decode().split()[0]==script_hash
            invoke(name,'restore-empty' if empty else 'initialize',str(port))
            return name

        def invoke(name,*args,input=None,observe=False,ok=True):
            cmd=['docker','exec','-i']
            if observe:cmd+=['-e','PYTHONPATH=/diagnostic-harness','-e','MVP7_RESTORE_DIAGNOSTIC=1']
            return run(cmd+[name,'/opt/owner-alpha/owner-alpha-supervisor.sh',*args],input=input,ok=ok)

        def probe(name,code,title):
            original=run(['docker','exec',name,'/opt/owner-alpha/venv/bin/python','-c',code],ok=False)
            exact=run(['docker','exec',name,'env','LD_LIBRARY_PATH=/opt/python-libs','/opt/owner-alpha/venv/bin/python','-c',code],ok=False)
            item={'probe':title,'source_sha256':hashlib.sha256(code.encode()).hexdigest(),
                'original':metadata(original),'runtime_library_environment':metadata(exact)}
            if title=='WORKSPACE_ID' and exact.returncode==0:
                item['valid_workspace_uuid']=str(uuid.UUID(exact.stdout.decode().strip()))==exact.stdout.decode().strip()
            probes['probes'].append(item)

        try:
            run(['docker','import',rootfs,image])
            ready=create();assert json.loads(invoke(ready,'start').stdout)['phase']=='READY'
            probe(ready,readiness,'daemon-readiness helper')
            empty=create();probe(empty,prepare,'empty PID preparation')
            probe(ready,workspace_values[0],'WORKSPACE_ID')
            assert len(probes['probes'])==3
            if all(p['original']['exit_code']==127 and p['runtime_library_environment']['exit_code']==0 for p in probes['probes']):
                probes['classification']='TEST_HARNESS_ENVIRONMENT_GAP_PROVEN'
            # A probe failure alone never proves a product defect; retain insufficient evidence.
            probes['harness_gate_complete']=True
        except Exception:
            probes['classification']='INSUFFICIENT_EVIDENCE'

        try:
            origin=create()
            assert json.loads(invoke(origin,'start').stdout)['phase']=='READY'
            invoke(origin,'access')  # Secret response stays in memory and is discarded.
            run(['docker','exec','-i','-u','postgres',origin,'/usr/lib/postgresql/18/bin/psql',
                '-X','-A','-t','-v','ON_ERROR_STOP=1','-h','/run/owner-alpha-pg','-d','conflict_analysis'],input=fixture.encode())
            invoke(origin,'graph')
            backup=invoke(origin,'backup').stdout
            assert backup
            candidate=create(8766,empty=True,observe=True)
            restored['restore_count']=1
            outcome=invoke(candidate,'restore',input=backup,observe=True,ok=False)
            del backup
            # Do not emit even hashes of backup dump bytes, access/session values or graph rows.
            restored['restore_exit_code']=outcome.returncode
            observed=json.loads((scratch/'restore-observation.json').read_bytes())
            restored.update(observed)
            restored['supervisor_unchanged']=run(['docker','exec',candidate,'sha256sum','/opt/owner-alpha/owner-alpha-supervisor.sh']).stdout.decode().split()[0]==script_hash==observed.get('supervisor_sha256')
            assert restored['supervisor_unchanged'] and not restored.get('trace_fault',True)
            if outcome.returncode==0:
                restored['classification']='ROOT_CAUSE_NOT_YET_PROVEN';restored['FIRST_RESTORE_PHASE']=None
            restored['harness_gate_complete']=True
        except Exception:
            restored['classification']='ROOT_CAUSE_NOT_YET_PROVEN'
        finally:
            for name in containers:run(['docker','rm','-f',name],ok=False)
            run(['docker','image','rm',image],ok=False)
            clean=run(['git','-C',source,'status','--porcelain=v1','--untracked-files=all']).stdout==b''
            unchanged=clean and verify.sha256_file(rootfs)==rootfs_hash and verify.sha256_file(script)==script_hash and verify.sha256_file(tests_path)==tests_hash
            for report,filename in [(probes,'mvp7-c-test-harness-diagnostic.json'),(restored,'mvp7-c-restore-diagnostic.json')]:
                report['exact_c_checkout_clean_after']=clean;report['frozen_sources_and_rootfs_unchanged']=unchanged
                (evidence/filename).write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
        assert probes['harness_gate_complete'] and restored['harness_gate_complete'] and unchanged,'DIAGNOSTIC_INCOMPLETE'
        print('THREE_PAIRED_PROBES_AND_ONE_RESTORE_CAPTURED')
        DIAGNOSTIC_FILE
    - name: Self-test observer line mapping, graph redaction and raw pipe hashes
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -B - <<'PY'
        import ast,copy,hashlib,importlib.util,os,subprocess,sys
        from pathlib import Path
        assert os.name=='posix','RAW_TEXT_PIPE_SELFTEST_REQUIRES_POSIX'
        root=Path(os.environ['RUNNER_TEMP'])
        spec=importlib.util.spec_from_file_location('restore_observer_selftest',root/'diagnostic-harness/sitecustomize.py')
        observer=importlib.util.module_from_spec(spec);spec.loader.exec_module(observer)
        shell=(root/'exact-c/software/conflict_analysis/owner_alpha_package/linux/owner-alpha-supervisor.sh').read_text()
        code=observer.setup(shell);module=ast.parse(code)
        functions={n.name:n for n in module.body if isinstance(n,(ast.FunctionDef,ast.ClassDef))}
        def namespace(statement):
            restore=copy.deepcopy(functions['restore_stream']);restore.body=[statement]
            mocks=ast.parse('def graph():\n    return after\ndef read(path):\n    return before\n').body
            nodes=[functions[name] for name in ('Halt','need','execute')]+mocks+[restore]
            scope={'subprocess':subprocess,'candidate':Path('/synthetic-not-read'),
                   'before':{'domain_synthetic':{'rows':1,'sha256':'0'*64}},
                   'after':{'domain_synthetic':{'rows':2,'sha256':'1'*64}}}
            exec(compile(ast.fix_missing_locations(ast.Module(body=nodes,type_ignores=[])),'<stdin>','exec'),scope)
            return scope
        def observe(scope):
            sys.settrace(observer.trace)
            try:exec(compile('try:\n    restore_stream()\nexcept Halt:\n    pass\n','<stdin>','exec'),scope)
            finally:sys.settrace(None)
            assert not observer.trace_fault
            return observer.result()
        full_line=next(line for line,label in observer.anchors if label=='FULL_GRAPH_EQUAL')
        original=next(n for n in functions['restore_stream'].body if n.lineno==full_line)
        r=observe(namespace(copy.deepcopy(original)))
        assert r['classification']=='FIRST_RESTORE_ASSERTION_PROVEN' and r['FIRST_RESTORE_PHASE']=='FULL_GRAPH_EQUAL'
        assert r['failure']['line']==full_line+observer.offset and r['failure']['predicate_result'] is False
        assert r['graph_equality']['differing_key_names']==['domain_synthetic']
        assert r['graph_equality']['key_count_before']==r['graph_equality']['key_count_after']==1
        assert r['graph_equality']['differences'][0]['row_count_before']==1 and r['graph_equality']['differences'][0]['row_count_after']==2
        observer.setup(shell)
        pg_line=next(line for line,label in observer.anchors if label=='PG_RESTORE')
        original=next(n for n in functions['restore_stream'].body if n.lineno==pg_line)
        statement=ast.copy_location(ast.Expr(value=ast.Call(func=ast.Name(id='execute',ctx=ast.Load()),args=[ast.Name(id='args',ctx=ast.Load())],keywords=[])),original)
        scope=namespace(statement)
        scope['args']=[sys.executable,'-c',"import os;os.write(1,b'PIPE_OUT\\r\\n');os.write(2,b'PIPE_ERR\\r\\n');raise SystemExit(7)"]
        r=observe(scope)
        assert r['classification']=='RESTORE_COMMAND_FAILURE_PROVEN' and r['FIRST_RESTORE_PHASE']=='PG_RESTORE'
        assert r['failed_command']['exit_code']==7 and r['failed_command']['raw_pipe_hashes_complete']
        for name,data in [('stdout',b'PIPE_OUT\r\n'),('stderr',b'PIPE_ERR\r\n')]:
            assert r['failed_command'][name]=={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
        assert r['failure']['line']==next(i+1 for i,line in enumerate(shell.splitlines()) if 'need(result.returncode==0' in line)
        assert 'PIPE_OUT' not in str(r) and 'PIPE_ERR' not in str(r) and 'args' not in r
        print('RESTORE_OBSERVER_EXACT_LINES_PREDICATES_GRAPH_HASHES_AND_RAW_PIPE_HASHES=PASS')
        PY
    - name: Run three paired original probes and one instrumented original restore
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -B "$RUNNER_TEMP/diagnostic-harness/driver.py"
    - name: Prove exact C checkout and target branch unchanged
      if: always()
      id: target_integrity
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test -z "$(git -C "$RUNNER_TEMP/exact-c" status --porcelain=v1 --untracked-files=all)"
        test -z "$(git -C "$RUNNER_TEMP/exact-c" diff --stat)"
        test "$(git -C "$RUNNER_TEMP/exact-c" rev-parse HEAD)" = "$HEAD_C"
        test "$(git -C "$RUNNER_TEMP/exact-c" rev-parse HEAD^{tree})" = "$TREE_C"
        test "$(git -C "$RUNNER_TEMP/exact-c" show -s --format=%P HEAD)" = "$PARENT_C"
        test "$(gh api repos/dshatrov7575-max/Conflict/git/ref/heads/codex/mvp7-r1-windows-setup-20260917 --jq '.object.sha')" = "$HEAD_C"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
    - name: Validate only two allowlisted safe JSON schemas
      if: always()
      id: safe_evidence
      run: |
        set -euo pipefail
        python3.12 - <<'PY'
        import json,os,re
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])/'safe-evidence'
        expected={'mvp7-c-test-harness-diagnostic.json','mvp7-c-restore-diagnostic.json'}
        assert {p.name for p in root.iterdir()}==expected
        probes=json.loads((root/'mvp7-c-test-harness-diagnostic.json').read_bytes())
        restore=json.loads((root/'mvp7-c-restore-diagnostic.json').read_bytes())
        common={'source','inner_zip','supervisor_sha256','tests_sha256','harness_gate_complete','exact_c_checkout_clean_before','exact_c_checkout_clean_after','frozen_sources_and_rootfs_unchanged','classification'}
        assert set(probes)==common|{'probes'}
        assert set(restore)<=common|{'FIRST_RESTORE_PHASE','restore_count','restore_exit_code','failure','failed_command','trace_fault','supervisor_unchanged','graph_equality','roles','harness_fault'}
        assert probes['classification'] in {'TEST_HARNESS_ENVIRONMENT_GAP_PROVEN','PRODUCT_RUNTIME_DEFECT_PROVEN','INSUFFICIENT_EVIDENCE'}
        assert restore['classification'] in {'FIRST_RESTORE_ASSERTION_PROVEN','RESTORE_COMMAND_FAILURE_PROVEN','ROOT_CAUSE_NOT_YET_PROVEN'}
        def digest(value):assert isinstance(value,str) and re.fullmatch('[0-9a-f]{64}',value)
        def stream(value):
            assert set(value)=={'bytes','sha256'} and type(value['bytes']) is int and value['bytes']>=0
            digest(value['sha256'])
        def command(value):
            assert set(value)=={'exit_code','stdout','stderr'} and type(value['exit_code']) is int
            stream(value['stdout']);stream(value['stderr'])
        for report in (probes,restore):
            assert report['source']=={'head':os.environ['HEAD_C'],'tree':os.environ['TREE_C'],'parent':os.environ['PARENT_C']}
            assert report['exact_c_checkout_clean_before'] and report['exact_c_checkout_clean_after'] and report['frozen_sources_and_rootfs_unchanged']
            assert report['inner_zip']=={'filename':'conflict-analysis-partner-demo-win-x64-mvp7.zip','bytes':590868984,'sha256':'2280c51b8f7a0c02123a1aafd38c909fbe88dfc4de80114a7d855bb720f99dcb'}
            digest(report['supervisor_sha256']);digest(report['tests_sha256'])
            for flag in ('harness_gate_complete','exact_c_checkout_clean_before','exact_c_checkout_clean_after','frozen_sources_and_rootfs_unchanged'):assert type(report[flag]) is bool
        assert len(probes['probes'])<=3
        for item in probes['probes']:
            assert set(item)<={'probe','source_sha256','original','runtime_library_environment','valid_workspace_uuid'}
            assert item['probe'] in {'daemon-readiness helper','empty PID preparation','WORKSPACE_ID'}
            digest(item['source_sha256']);command(item['original']);command(item['runtime_library_environment'])
        if probes['classification']=='TEST_HARNESS_ENVIRONMENT_GAP_PROVEN':
            assert len(probes['probes'])==3 and all(x['original']['exit_code']==127 and x['runtime_library_environment']['exit_code']==0 for x in probes['probes'])
        phases={'RESTORE_PHASE_EMPTY','ARCHIVE_MEMBER_SET','ARCHIVE_MEMBER_TYPE','MANIFEST_SCHEMA','BACKUP_RUNTIME_IDENTITY','OBJECT_SET','OBJECT_HASH','ROLE_BASELINE','GLOBAL_ROLE_SET','GLOBAL_ROLE_RECONCILIATION','PG_RESTORE','FULL_GRAPH_EQUAL','PRINCIPAL_RESTORE','USER_SCOPE_VERIFY','MIGRATION_PLAN','SESSION_REVOKE','GRAPH_WITHOUT_SESSIONS_EQUAL'}
        assert restore['FIRST_RESTORE_PHASE'] is None or restore['FIRST_RESTORE_PHASE'] in phases
        assert type(restore['restore_count']) is int and restore['restore_count'] in (0,1)
        failure=restore.get('failure')
        if failure:
            assert set(failure)<={'function','line','phase','exception_type','public_halt_code','assertion','predicate_result'}
            assert re.fullmatch('[a-zA-Z_][a-zA-Z0-9_]*',failure['function']) and type(failure['line']) is int
            assert re.fullmatch('[a-zA-Z_][a-zA-Z0-9_]*',failure['exception_type']) and failure['phase'] in phases
            assert failure['public_halt_code'] is None or re.fullmatch('BLOCKED_[A-Z0-9_]+',failure['public_halt_code'])
            assert failure.get('predicate_result') in (None,False,True) and type(failure['assertion']) is bool
        failed=restore.get('failed_command')
        if failed:
            assert set(failed)=={'exit_code','stdout','stderr','raw_pipe_hashes_complete'}
            assert type(failed['exit_code']) is int and type(failed['raw_pipe_hashes_complete']) is bool
            for name in ('stdout','stderr'):
                if failed[name] is not None:stream(failed[name])
            if failed['raw_pipe_hashes_complete']:command({k:v for k,v in failed.items() if k!='raw_pipe_hashes_complete'})
        graph=restore.get('graph_equality')
        if graph:
            assert restore['FIRST_RESTORE_PHASE'] in {'FULL_GRAPH_EQUAL','GRAPH_WITHOUT_SESSIONS_EQUAL'}
            assert set(graph)=={'equal','key_count_before','key_count_after','differing_key_names','differences'}
            assert graph['equal'] is False and type(graph['key_count_before']) is int and type(graph['key_count_after']) is int
            assert all(re.fullmatch('[$a-zA-Z_][a-zA-Z0-9_$]*',x) for x in graph['differing_key_names'])
            assert [x['key'] for x in graph['differences']]==graph['differing_key_names']
            for entry in graph['differences']:
                assert set(entry)=={'key','sha256_before','sha256_after','row_count_before','row_count_after'}
                digest(entry['sha256_before']);digest(entry['sha256_after'])
                assert all(x is None or type(x) is int for x in [entry['row_count_before'],entry['row_count_after']])
        if 'roles' in restore:
            assert restore['FIRST_RESTORE_PHASE'] in {'ROLE_BASELINE','GLOBAL_ROLE_SET'}
            assert set(restore['roles'])=={'names','count'} and len(restore['roles']['names'])==restore['roles']['count']
            assert all(isinstance(x,str) and len(x)<=128 for x in restore['roles']['names'])
        print('EXACT_TWO_ALLOWLISTED_SAFE_JSON_ARTIFACTS=PASS')
        PY
    - name: Upload only safe probe and restore diagnostics
      if: ${{ always() && steps.safe_evidence.outcome == 'success' && steps.target_integrity.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mvp7-c-restore-diagnostic-${{ github.sha }}
        if-no-files-found: error
        path: |-
          ${{ runner.temp }}/safe-evidence/mvp7-c-test-harness-diagnostic.json
          ${{ runner.temp }}/safe-evidence/mvp7-c-restore-diagnostic.json
        retention-days: 14
