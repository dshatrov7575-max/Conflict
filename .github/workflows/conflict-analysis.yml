          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall(".//testcase")
          skipped = root.findall(".//skipped")
          failures = root.findall(".//failure") + root.findall(".//error")
          assert len(cases) == 254, len(cases)
          assert len(skipped) == 0, len(skipped)
          assert len(failures) == 0, len(failures)
          expected = {
              "ProjectPrimaryLanguageContractTests": 10,
              "FoundationStudioProjectLanguageWriteTests": 4,
              "FoundationStudioProjectLanguageHttpTests": 2,
              "ProjectPrimaryLanguageMigrationGateTests": 2,
          }
          for suffix, count in expected.items():
              actual = [c for c in cases if c.attrib.get("classname", "").endswith(suffix)]
              assert len(actual) == count, (suffix, len(actual))
          print("F0L_POSTGRESQL_254_AND_18_NODE_REGISTRY=PASS")
