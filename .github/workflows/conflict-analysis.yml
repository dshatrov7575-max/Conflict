      - name: Prove the exact C2A synthetic merge tree
        if: env.ACTIVE_SLICE == 'C2A'
        shell: bash
        run: |
          set -euo pipefail
          delivery_head="$(git rev-parse HEAD)"
          delivery_tree="$(git rev-parse HEAD^{tree})"
          merge_base="$(git merge-base "$SLICE_BASE_HEAD" "$delivery_head")"
          test "$merge_base" = "$SLICE_BASE_HEAD"
          synthetic_tree="$(git merge-tree --write-tree \
            "$SLICE_BASE_HEAD" "$delivery_head")"
          independent_tree="$(git merge-tree --write-tree \
            "$merge_base" "$delivery_head")"
          test "$synthetic_tree" = "$delivery_tree"
          test "$independent_tree" = "$delivery_tree"
          python - \
            "$SUCCESSOR_EVIDENCE_DIR/synthetic-tree.json" \
            "$SLICE_BASE_HEAD" \
            "$delivery_head" \
            "$delivery_tree" \
            "$synthetic_tree" \
            "$independent_tree" <<'PY'
          import json
          import pathlib
          import sys

          output, base_head, delivery_head, delivery_tree, synthetic_tree, independent_tree = sys.argv[1:]
          evidence = {
              "schema": "C2A_SYNTHETIC_TREE_EVIDENCE_V1",
              "base_head": base_head,
              "delivery_head": delivery_head,
              "parents": [base_head, delivery_head],
              "delivery_tree": delivery_tree,
              "synthetic_tree": synthetic_tree,
              "independent_tree": independent_tree,
          }
          pathlib.Path(output).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("C2A_SYNTHETIC_TREE_EQUALS_DELIVERY_TREE=PASS")
          PY

