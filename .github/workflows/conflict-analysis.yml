name: Conflict Analysis Foundation

on:
  pull_request:
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"
  push:
    branches:
      - main
      - codex/ca-i1-data-001
      - codex/ca-suite-i1-foundation
      - codex/ca-suite-i1-production-studio-c0-read-only
      - codex/ca-suite-i1-foundation-fd01-validation-preview
      - codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conflict-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-contract:
    name: Python 3.12 / PostgreSQL 18 / SQLite / FD01-FD05 slice gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: software/conflict_analysis

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      FD01_BASE_HEAD: c0b773573c8d37faf7b1b71e910f7a8d356000f4
      FD01_BASE_TREE: 914e3b0895e404cf699d651c8148da875528b4e7
      FD01_RC1_START_HEAD: 1e2fd10878236ee8f0a01a62773894dd9c0d5c40
      FD01_RC1_START_TREE: 671c0777cee1d4542ebe4eeb1128c0e0fecac4b3
      FD01_RC2_START_HEAD: 2bf40798dc2c4ba0ea3c742bf86b88fda4bde8d0
      FD01_RC2_START_TREE: 23161d6d2ba575d1ca92149f468e086ce43df129
      C0_BRANCH: codex/ca-suite-i1-production-studio-c0-read-only
      FD01_BRANCH: codex/ca-suite-i1-foundation-fd01-validation-preview
      FD05_BRANCH: codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
      AUTH_MAIN_HEAD: 19690eb3aede8b603a631d7c561fc74f9022537a
      AUTH_MAIN_TREE: 04d5b43fdf96637f58b8fc6f191323fbad302bbc
      FND_BASE_HEAD: f940a91a92658285063802ee1a43bf84360fc013
      FND_BASE_TREE: 1125b01a90da3ea324e661d729a845c58febb8e2
      FOUNDATION_B_HEAD: 5f73ebf2fd29a161a34ea047c7eead4fb0c582d4
      FOUNDATION_B_TREE: ea5ff9ab510cb76f0c2b1bfda1c02c1278812aae
      PR67_BASE_HEAD: b8a543c09cc89b1b7378f21215f70afa586b248d

    steps:
      - name: Check out exact delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact prerequisite slice from GitHub event refs
        shell: bash
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          delivery_head="$(git rev-parse HEAD)"
          active_pr_number=""

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test "$EVENT_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$EVENT_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$EVENT_HEAD_SHA" = "$delivery_head"
              [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              active_pr_number="$EVENT_PR_NUMBER"
              case "${EVENT_HEAD_REF}|${EVENT_BASE_REF}" in
                "${FD01_BRANCH}|${C0_BRANCH}")
                  test "$EVENT_PR_NUMBER" = "71"
                  active_slice="FD01"
                  slice_base_head="$FD01_BASE_HEAD"
                  test "$EVENT_BASE_SHA" = "$slice_base_head"
                  ;;
                "${FD05_BRANCH}|${FD01_BRANCH}")
                  active_slice="FD05"
                  slice_base_head="$EVENT_BASE_SHA"
                  ;;
                *)
                  echo "unsupported prerequisite pull-request ref pair: ${EVENT_HEAD_REF} -> ${EVENT_BASE_REF}" >&2
                  exit 1
                  ;;
              esac
              active_head_ref="$EVENT_HEAD_REF"
              active_base_ref="$EVENT_BASE_REF"
              ;;
            push)
              test "$GITHUB_SHA" = "$delivery_head"
              case "$GITHUB_REF" in
                "refs/heads/${FD01_BRANCH}")
                  active_slice="FD01"
                  slice_base_head="$FD01_BASE_HEAD"
                  active_head_ref="$FD01_BRANCH"
                  active_base_ref="$C0_BRANCH"
                  ;;
                "refs/heads/${FD05_BRANCH}")
                  active_slice="FD05"
                  git fetch --no-tags origin \
                    "+refs/heads/${FD01_BRANCH}:refs/remotes/origin/fd01-target"
                  slice_base_head="$(git rev-parse refs/remotes/origin/fd01-target)"
                  active_head_ref="$FD05_BRANCH"
                  active_base_ref="$FD01_BRANCH"
                  ;;
                *)
                  echo "unsupported prerequisite push ref: $GITHUB_REF" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unsupported prerequisite event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          [[ "$delivery_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$slice_base_head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$slice_base_head^{commit}"
          slice_base_tree="$(git rev-parse "$slice_base_head^{tree}")"
          [[ "$slice_base_tree" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$active_slice" = FD01 ]]; then
            test "$slice_base_tree" = "$FD01_BASE_TREE"
          else
            echo "FD05 base is event/live-target relational only; exact accepted H1/T1 equality remains an external MAIN oracle."
          fi

          {
            echo "ACTIVE_SLICE=$active_slice"
            echo "SLICE_BASE_HEAD=$slice_base_head"
            echo "SLICE_BASE_TREE=$slice_base_tree"
            echo "SLICE_HEAD_REF=$active_head_ref"
            echo "SLICE_BASE_REF=$active_base_ref"
            echo "SLICE_PR_NUMBER=$active_pr_number"
          } >> "$GITHUB_ENV"

      - name: Verify active-slice authorization drift, ancestry and synthetic merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delivery_head="$(git rev-parse HEAD)"
          test "$(git rev-parse "$FD01_BASE_HEAD^{tree}")" = "$FD01_BASE_TREE"
          test "$(git rev-parse "$FD01_RC1_START_HEAD^{tree}")" = "$FD01_RC1_START_TREE"
          test "$(git rev-parse "$FD01_RC2_START_HEAD^{tree}")" = "$FD01_RC2_START_TREE"
          test "$(git rev-parse "$SLICE_BASE_HEAD^{tree}")" = "$SLICE_BASE_TREE"
          test "$(git rev-parse "$FND_BASE_HEAD^{tree}")" = "$FND_BASE_TREE"
          test "$(git rev-parse "$FOUNDATION_B_HEAD^{tree}")" = "$FOUNDATION_B_TREE"
          test "$(git rev-parse "$AUTH_MAIN_HEAD^{tree}")" = "$AUTH_MAIN_TREE"
          git merge-base --is-ancestor "$AUTH_MAIN_HEAD" "$FND_BASE_HEAD"
          git merge-base --is-ancestor "$FND_BASE_HEAD" "$FOUNDATION_B_HEAD"
          git merge-base --is-ancestor "$AUTH_MAIN_HEAD" "$FOUNDATION_B_HEAD"
          git merge-base --is-ancestor "$FOUNDATION_B_HEAD" "$FD01_BASE_HEAD"
          git merge-base --is-ancestor "$FD01_BASE_HEAD" "$FD01_RC1_START_HEAD"
          git merge-base --is-ancestor "$FD01_RC1_START_HEAD" "$FD01_RC2_START_HEAD"
          git merge-base --is-ancestor "$FD01_RC2_START_HEAD" "$delivery_head"
          git merge-base --is-ancestor "$SLICE_BASE_HEAD" "$delivery_head"
          test -z "$(git rev-list --merges "$FD01_BASE_HEAD..$delivery_head")"
          if [[ "$ACTIVE_SLICE" = FD01 ]]; then
            test "$SLICE_BASE_HEAD" = "$FD01_BASE_HEAD"
            test "$SLICE_BASE_TREE" = "$FD01_BASE_TREE"
          else
            test "$ACTIVE_SLICE" = FD05
            git merge-base --is-ancestor "$FD01_RC2_START_HEAD" "$SLICE_BASE_HEAD"
          fi

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/codex/ca-suite-i1-foundation-application-gateways:refs/remotes/origin/foundation-b \
            +refs/heads/codex/ca-suite-i1-production-studio-c0-read-only:refs/remotes/origin/c0 \
            +refs/heads/codex/ca-suite-i1-foundation-fd01-validation-preview:refs/remotes/origin/fd01-target \
            +refs/pull/67/merge:refs/remotes/origin/pr67-merge \
            +refs/pull/69/merge:refs/remotes/origin/pr69-merge
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTH_MAIN_HEAD"
          test "$(git rev-parse refs/remotes/origin/foundation-b)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/c0)" = "$FD01_BASE_HEAD"
          if [[ "$ACTIVE_SLICE" = FD01 ]]; then
            test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$delivery_head"
          else
            test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$SLICE_BASE_HEAD"
          fi

          IFS=$'\t' read -r state67 draft67 merged67 head67 base67 mergeable67 <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/67" \
              --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .base.sha, (.mergeable|tostring)] | @tsv'
          )"
          test "$state67" = open
          test "$draft67" = true
          test "$merged67" = false
          test "$head67" = "$FOUNDATION_B_HEAD"
          test "$base67" = "$PR67_BASE_HEAD"
          test "$mergeable67" = true
          test "$(git rev-parse refs/remotes/origin/pr67-merge^1)" = "$PR67_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr67-merge^2)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr67-merge^{tree})" = "$FOUNDATION_B_TREE"

          IFS=$'\t' read -r state69 draft69 merged69 head69 base69 mergeable69 <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/69" \
              --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .base.sha, (.mergeable|tostring)] | @tsv'
          )"
          test "$state69" = open
          test "$draft69" = true
          test "$merged69" = false
          test "$head69" = "$FD01_BASE_HEAD"
          test "$base69" = "$FOUNDATION_B_HEAD"
          test "$mergeable69" = true
          test "$(git rev-parse refs/remotes/origin/pr69-merge^1)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr69-merge^2)" = "$FD01_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr69-merge^{tree})" = "$FD01_BASE_TREE"

          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            if [[ "$ACTIVE_SLICE" = FD01 ]]; then
              test "$SLICE_PR_NUMBER" = "71"
            fi

            IFS=$'\t' read -r state_slice draft_slice merged_slice head_slice headref_slice headrepo_slice base_slice baseref_slice <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${SLICE_PR_NUMBER}" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .head.repo.full_name, .base.sha, .base.ref] | @tsv'
            )"
            test "$state_slice" = open
            test "$draft_slice" = true
            test "$merged_slice" = false
            test "$head_slice" = "$delivery_head"
            test "$headref_slice" = "$SLICE_HEAD_REF"
            test "$headrepo_slice" = "$GITHUB_REPOSITORY"
            test "$base_slice" = "$SLICE_BASE_HEAD"
            test "$baseref_slice" = "$SLICE_BASE_REF"

            git fetch --no-tags origin \
              "+refs/pull/${SLICE_PR_NUMBER}/merge:refs/remotes/origin/active-slice-merge"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^1)" = "$SLICE_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^2)" = "$delivery_head"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^{tree})" = "$(git rev-parse "$delivery_head^{tree}")"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^{tree})" = "$(git merge-tree --write-tree "$SLICE_BASE_HEAD" "$delivery_head")"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Run offline deterministic FD01 and FD05 verifier contract self-check
        run: python scripts/verify_foundation_c1_prerequisites_allowlist.py --self-check-contracts

      - name: Set up Node.js 24 for Chromium harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check
          node --check production_studio/static/production_studio/studio.js
          node --check production_studio/browser_tests/cdp_client.mjs
          node --check production_studio/browser_tests/read_only_smoke.mjs

      - name: Verify exact active-slice allowlist and frozen accepted surfaces
        run: |
          python scripts/verify_foundation_c1_prerequisites_allowlist.py \
            --slice "$ACTIVE_SLICE" \
            --base-head "$SLICE_BASE_HEAD" \
            --base-tree "$SLICE_BASE_TREE"
          git diff --check "$SLICE_BASE_HEAD...HEAD"

      - name: Check package, schema, migrations and Django
        run: |
          python -m compileall -q conflict_analysis domain production_studio
          python -c "import json; from importlib.resources import files; root=files('domain.services').joinpath('schemas'); schemas=sorted((p for p in root.iterdir() if p.name.endswith('.json')), key=lambda p:p.name); assert schemas; [json.loads(p.read_text(encoding='utf-8')) for p in schemas]"
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check

      - name: Locate current Chromium and build isolated wheel
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" --version
          echo "STUDIO_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          wheel_dir="${{ runner.temp }}/foundation-prerequisite-wheel"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          echo "STUDIO_C0_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Run PostgreSQL 18 Foundation suite
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest domain/tests --junitxml="${{ runner.temp }}/postgresql-domain.xml"

      - name: Verify exact PostgreSQL 18 active-slice baseline
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          active_slice=os.environ["ACTIVE_SLICE"]
          expected_total={"FD01":183,"FD05":200}[active_slice]
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-domain.xml")).iter("testcase"))
          skipped=[c for c in cases if c.find("skipped") is not None]
          assert len(cases)==expected_total, f"expected {expected_total} Foundation tests for {active_slice}, got {len(cases)}"
          assert not skipped, f"unexpected PostgreSQL skips: {len(skipped)}"
          print(f"PostgreSQL 18 Foundation {active_slice}: {expected_total} passed, 0 skipped")
          PY

      - name: Run PostgreSQL C0 core and real Chromium zero-write regression
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest production_studio/tests --junitxml="${{ runner.temp }}/postgresql-c0.xml"

      - name: Verify PostgreSQL C0 remains 19/19
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-c0.xml")).iter("testcase"))
          skipped=[c for c in cases if c.find("skipped") is not None]
          assert len(cases)==19, f"expected 19 C0 tests, got {len(cases)}"
          assert not skipped
          print("PostgreSQL C0 regression: 19 passed, 0 skipped")
          PY

      - name: Run SQLite Foundation suite
        env:
          USE_SQLITE: "true"
          SQLITE_PATH: ${{ runner.temp }}/conflict-analysis-foundation-slice.sqlite3
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest domain/tests --junitxml="${{ runner.temp }}/sqlite-domain.xml"

      - name: Verify exact SQLite active-slice baseline and named skips
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          active_slice=os.environ["ACTIVE_SLICE"]
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/sqlite-domain.xml")).iter("testcase"))
          actual={(c.attrib["classname"],c.attrib["name"]) for c in cases if c.find("skipped") is not None}
          accepted_six={
            ("domain.tests.test_foundation_studio_bootstrap.FoundationStudioBootstrapConcurrencyTests","test_postgresql_concurrent_bootstrap_has_one_winner_and_one_explicit_conflict"),
            ("domain.tests.test_foundation_studio_bootstrap.FoundationStudioSuccessorConcurrencyTests","test_postgresql_competing_successors_have_one_winner_and_preserve_old_pin"),
            ("domain.tests.test_foundation_studio_bootstrap.FoundationStudioApplicationSuccessorConcurrencyTests","test_postgresql_application_wrapper_has_one_success_and_one_typed_conflict"),
            ("domain.tests.test_foundation_studio_bootstrap.FoundationStudioFirstProjectApplicationConcurrencyTests","test_postgresql_application_bootstrap_has_one_complete_winner_and_no_orphans"),
            ("domain.tests.test_foundation_studio_package.FoundationStudioCrossPathLockOrderTests","test_postgresql_import_initial_and_successor_paths_share_one_lock_order"),
            ("domain.tests.test_postgresql_migrations.PostgreSQLMigrationGateTests","test_clean_test_database_is_at_every_migration_leaf"),
          }
          fd05_five={
            ("domain.tests.test_foundation_studio_write_reconciliation.FoundationStudioWriteReconciliationConcurrencyTests","test_postgresql_concurrent_bootstrap_same_key_has_one_graph_one_audit_one_reconcile"),
            ("domain.tests.test_foundation_studio_write_reconciliation.FoundationStudioWriteReconciliationConcurrencyTests","test_postgresql_concurrent_create_same_key_has_one_commit_one_reconcile"),
            ("domain.tests.test_foundation_studio_write_reconciliation.FoundationStudioWriteReconciliationConcurrencyTests","test_postgresql_different_keys_same_create_or_clone_identity_have_one_typed_loser"),
            ("domain.tests.test_foundation_studio_write_reconciliation.FoundationStudioWriteReconciliationConcurrencyTests","test_postgresql_concurrent_stale_saves_have_one_commit_one_draft_stale"),
            ("domain.tests.test_foundation_studio_write_reconciliation.FoundationStudioWriteReconciliationConcurrencyTests","test_postgresql_save_validate_race_obeys_project_first_lock_order"),
          }
          expected_total={"FD01":183,"FD05":200}[active_slice]
          expected_passed={"FD01":177,"FD05":189}[active_slice]
          expected=accepted_six if active_slice=="FD01" else accepted_six|fd05_five
          assert len(cases)==expected_total, f"expected {expected_total} Foundation tests for {active_slice}, got {len(cases)}"
          assert actual==expected, f"SQLite skip drift: {sorted(actual)}"
          assert len(cases)-len(actual)==expected_passed
          print(f"SQLite Foundation {active_slice}: {expected_passed} passed, exact {len(expected)} PostgreSQL-only skips")
          PY

      - name: Run and verify SQLite C0 remains 19/19
        env:
          USE_SQLITE: "true"
          SQLITE_PATH: ${{ runner.temp }}/conflict-analysis-c0.sqlite3
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m pytest production_studio/tests --junitxml="${{ runner.temp }}/sqlite-c0.xml"
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/sqlite-c0.xml")).iter("testcase"))
          assert len(cases)==19
          assert not [c for c in cases if c.find("skipped") is not None]
          print("SQLite C0 regression: 19 passed, 0 skipped; no concurrency claim")
          PY

      - name: Inspect exact wheel and checksum-bound C0 assets
        shell: bash
        run: |
          source_root="$PWD"
          test -f "$STUDIO_C0_WHEEL"
          python - "$STUDIO_C0_WHEEL" <<'PY'
          from pathlib import Path
          import sys
          from zipfile import ZipFile
          wheel=Path(sys.argv[1])
          required={
            "production_studio/__init__.py",
            "production_studio/apps.py",
            "production_studio/claim_boundaries.py",
            "production_studio/urls.py",
            "production_studio/views.py",
            "production_studio/contracts/read_only_claim_boundaries_v1.ru.json",
            "production_studio/contracts/read_only_claim_boundaries_v1.ru.json.sha256",
            "production_studio/templates/production_studio/entry.html",
            "production_studio/templates/production_studio/definition.html",
            "production_studio/static/production_studio/studio.css",
            "production_studio/static/production_studio/studio.js",
          }
          forbidden={
            "production_studio/models.py",
            "production_studio/session.py",
            "production_studio/package.py",
            "production_studio/validation.py",
            "production_studio/evidence.py",
          }
          with ZipFile(wheel) as archive:
            names=set(archive.namelist())
            assert not (required-names), sorted(required-names)
            assert not (forbidden&names), sorted(forbidden&names)
