              echo "FD07_ACCEPTED_FD06_BASE_PIN=PASS"
              echo "FD07_SINGLE_FAST_FORWARD_HISTORY=PASS"
              echo "FD07_FROZEN_OBJECTS=PASS"
              ;;
            *)
              echo "unsupported active slice: $ACTIVE_SLICE" >&2
              exit 1
              ;;
          esac

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/codex/ca-suite-i1-foundation-application-gateways:refs/remotes/origin/foundation-b \
            +refs/heads/codex/ca-suite-i1-production-studio-c0-read-only:refs/remotes/origin/c0 \
            +refs/heads/codex/ca-suite-i1-foundation-fd01-validation-preview:refs/remotes/origin/fd01-target \
            +refs/pull/67/merge:refs/remotes/origin/pr67-merge \
            +refs/pull/69/merge:refs/remotes/origin/pr69-merge
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTH_MAIN_HEAD"
          test "$(git rev-parse refs/remotes/origin/foundation-b)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/c0)" = "$FD01_BASE_HEAD"
          case "$ACTIVE_SLICE" in
            FD01)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$delivery_head"
              ;;
            FD05)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$SLICE_BASE_HEAD"
              ;;
            R0|C1|FD02|FD03|FD06|FD07)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$FD01_ACCEPTED_HEAD"
              ;;
          esac

          if [[ "$ACTIVE_SLICE" = R0 || "$ACTIVE_SLICE" = C1 || "$ACTIVE_SLICE" = FD02 || "$ACTIVE_SLICE" = FD03 || "$ACTIVE_SLICE" = FD06 || "$ACTIVE_SLICE" = FD07 ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${FD05_BRANCH}:refs/remotes/origin/fd05-target" \
              +refs/pull/72/merge:refs/remotes/origin/pr72-merge
            test "$(git rev-parse refs/remotes/origin/fd05-target)" = "$FD05_ACCEPTED_HEAD"
            IFS=$'\t' read -r state72 draft72 merged72 head72 headref72 base72 baseref72 <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/72" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .base.sha, .base.ref] | @tsv'
