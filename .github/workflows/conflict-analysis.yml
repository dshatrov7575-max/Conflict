name: Conflict Analysis Foundation

on:
  pull_request:
    branches:
      - codex/ca-suite-i1-production-studio-c0-read-only
      - codex/ca-suite-i1-foundation-fd01-validation-preview
      - codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
      - codex/ca-suite-i1-production-studio-c1-authenticated-draft
      - codex/ca-suite-i1-foundation-fd02-studio-help-provisioning
      - codex/ca-suite-i1-foundation-fd03-lifecycle-read-result
      - codex/ca-suite-i1-foundation-fd06-publication-reconciliation
      - codex/ca-suite-i1-foundation-fd07-publication-readiness
      - codex/ca-suite-i1-project-language-bootstrap-f0l
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"
  push:
    branches:
      - codex/ca-suite-i1-foundation-fd01-validation-preview
      - codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
      - codex/ca-suite-i1-production-studio-c1-r0-ci-pin
      - codex/ca-suite-i1-production-studio-c1-authenticated-draft
      - codex/ca-suite-i1-foundation-fd02-studio-help-provisioning
      - codex/ca-suite-i1-foundation-fd03-lifecycle-read-result
      - codex/ca-suite-i1-foundation-fd06-publication-reconciliation
      - codex/ca-suite-i1-foundation-fd07-publication-readiness
      - codex/ca-suite-i1-project-language-bootstrap-f0l
      - codex/ca-suite-i1-evidence-multilingual-f1
      - codex/ca-suite-i1-production-studio-c2a-lifecycle-publication
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conflict-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-contract:
    name: Python 3.12 / PostgreSQL 18 / SQLite / FD01-FD05-R0-C1-FD02-FD03-FD06-FD07 slice gate
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref != 'codex/ca-suite-i1-project-language-bootstrap-f0l' &&
       github.event.pull_request.head.ref != 'codex/ca-suite-i1-evidence-multilingual-f1' &&
       github.event.pull_request.head.ref != 'codex/ca-suite-i1-production-studio-c2a-lifecycle-publication') ||
      (github.event_name == 'push' &&
       github.ref != 'refs/heads/codex/ca-suite-i1-project-language-bootstrap-f0l' &&
       github.ref != 'refs/heads/codex/ca-suite-i1-evidence-multilingual-f1' &&
       github.ref != 'refs/heads/codex/ca-suite-i1-production-studio-c2a-lifecycle-publication')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: software/conflict_analysis

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      FD01_BASE_HEAD: c0b773573c8d37faf7b1b71e910f7a8d356000f4
      FD01_BASE_TREE: 914e3b0895e404cf699d651c8148da875528b4e7
      FD01_RC1_START_HEAD: 1e2fd10878236ee8f0a01a62773894dd9c0d5c40
      FD01_RC1_START_TREE: 671c0777cee1d4542ebe4eeb1128c0e0fecac4b3
      FD01_RC2_START_HEAD: 2bf40798dc2c4ba0ea3c742bf86b88fda4bde8d0
      FD01_RC2_START_TREE: 23161d6d2ba575d1ca92149f468e086ce43df129
      FD01_RC3_START_HEAD: 6b502c985094799050e0970a7c40d5a4f9cd0724
      FD01_RC3_START_TREE: d527e34b8e9d3d67802be0118ac4928821cfd60b
      FD01_ACCEPTED_HEAD: "${{ vars.FD01_ACCEPTED_HEAD }}"
      FD01_ACCEPTED_TREE: "${{ vars.FD01_ACCEPTED_TREE }}"
      FD05_ACCEPTED_HEAD: "${{ vars.FD05_ACCEPTED_HEAD }}"
      FD05_ACCEPTED_TREE: "${{ vars.FD05_ACCEPTED_TREE }}"
      R0_AUTH_BASE_HEAD: ca16f7a99ff044f7fbccb83354d5a9112c99027a
      R0_AUTH_BASE_TREE: c25848dbbb19aabd5a2d4d642b69c66254879059
      C1_R0_START_HEAD: bd6e88c2a5f6552e057ea5b49fc63a1eb77ef4c6
      C1_R0_START_TREE: e1124839da8571408c258517c8afdf24622f1655
      FD02_BASE_HEAD: bbe852d2f30f1be042e9cd8c35a52fd120d65ae4
      FD02_BASE_TREE: 838364d0f10a9517160a6bb0a81b547f121e2447
      FD03_BASE_HEAD: 6b7d8977f9798fa21b9ccc3d12f9410a5165d6b5
      FD03_BASE_TREE: 09f9a2f93b0e63f7d90863131ffbe799b17475bf
      FD03_RC2_START_HEAD: bee7335d441c0b5d6d3501481fb14fb62a5de7a8
      FD03_RC2_START_TREE: a94e9c08bdc67d3f6b2e04952de44ac3f8339f99
      FD06_BASE_HEAD: feefd3899b5a168e650ddb3094881f48830acb96
      FD06_BASE_TREE: 0dad3448608b3bbab28c7f1bfc7399c30382a343
      FD06_BASE_DOMAIN_TREE: 8fd38b8d56177527473ac652978594593773c973
      FD06_RC4_INTERMEDIATE_HEAD: 0dd4ae788c765a0a0c24ac4d61582870d73e29e2
      FD06_RC4_INTERMEDIATE_TREE: b59baccfa73ba6b9cce6e89419cb540005564b64
      FD06_MODELS_BLOB: c6c5c2419989e7b0cf40bd1242ab65d37cc2e162
      FD06_ENUMS_BLOB: a701c3c83511b7d1706519d40fab4580d0a0d63e
      FD06_MIGRATIONS_TREE: b0cc214cd63086172c9d3801338a5a2302a7ce0f
      FD06_PRODUCTION_STUDIO_TREE: 31ba7273cfe4a6ae3c57054518de2e2ba98113ff
      FD06_STUDIO_DEFINITIONS_BASE_BLOB: bf6cdf29c49878025c73e2a984f61a1e326b0c8e
      FD06_POLICIES_BASE_BLOB: 697c72a91fe6fbe00ae54ec249ea89583d47ca93
      FD06_PROJECT_DEFINITIONS_BASE_BLOB: 9bb454a25a9621507662d5aa12e35ccd8a91dd1d
      FD06_URLS_BASE_BLOB: 127bde69d539844d59b53b74f81aa3483f865e66
      FD07_BASE_HEAD: b161ed387b3aec90bb8e4010e665fbe35d4b9ea6
      FD07_BASE_TREE: 42dab05a7cbf99e8e71f127ad196139da8b46734
      FD07_BASE_DOMAIN_TREE: 813315e1f2850fe8ebc5971eb3194721d636cc6f
      FD07_WORKFLOW_BASE_BLOB: ea6dc0c12897eb683ffa108b8e247639f6e34da1
      FD07_ADR_BASE_BLOB: 6544eedc45d0e77c2f89dbfbb4e52874337b7e63
      FD07_STUDIO_DEFINITIONS_BASE_BLOB: ff2680683af265b0c35258df21d15eb575ec1f47
      FD07_PROJECT_DEFINITIONS_BASE_BLOB: c4cbb6b426fdfe0359dfe30eff58e712baf1fd19
      FD07_HTTP_TEST_BASE_BLOB: 376122c7511df26477b2d1ec839d4fd2af00b1e5
      FD07_URLS_BASE_BLOB: e4ffdc3efc608fb9a1933c52298e10db0523aaa7
      FD07_VERIFIER_BASE_BLOB: 188abd70b4b89bd423c148da98240150a7a4d56f
      FD07_MODELS_BLOB: c6c5c2419989e7b0cf40bd1242ab65d37cc2e162
      FD07_ENUMS_BLOB: a701c3c83511b7d1706519d40fab4580d0a0d63e
      FD07_MIGRATIONS_TREE: b0cc214cd63086172c9d3801338a5a2302a7ce0f
      FD07_POLICIES_BLOB: 4b5eba67ab9d6ee4f70497a71d2b0af420ab9afb
      FD07_PRODUCTION_STUDIO_TREE: 31ba7273cfe4a6ae3c57054518de2e2ba98113ff
      FD07_FOUNDATION_PACKAGES_BLOB: 41c5a6ba2dddd39bdf01ccd398f8ab8213133986
      C0_BRANCH: codex/ca-suite-i1-production-studio-c0-read-only
      FD01_BRANCH: codex/ca-suite-i1-foundation-fd01-validation-preview
      FD05_BRANCH: codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
      R0_BRANCH: codex/ca-suite-i1-production-studio-c1-r0-ci-pin
      C1_BRANCH: codex/ca-suite-i1-production-studio-c1-authenticated-draft
      FD02_BRANCH: codex/ca-suite-i1-foundation-fd02-studio-help-provisioning
      FD03_BRANCH: codex/ca-suite-i1-foundation-fd03-lifecycle-read-result
      FD06_BRANCH: codex/ca-suite-i1-foundation-fd06-publication-reconciliation
      FD07_BRANCH: codex/ca-suite-i1-foundation-fd07-publication-readiness
      AUTH_MAIN_HEAD: 19690eb3aede8b603a631d7c561fc74f9022537a
      AUTH_MAIN_TREE: 04d5b43fdf96637f58b8fc6f191323fbad302bbc
      FND_BASE_HEAD: f940a91a92658285063802ee1a43bf84360fc013
      FND_BASE_TREE: 1125b01a90da3ea324e661d729a845c58febb8e2
      FOUNDATION_B_HEAD: 5f73ebf2fd29a161a34ea047c7eead4fb0c582d4
      FOUNDATION_B_TREE: ea5ff9ab510cb76f0c2b1bfda1c02c1278812aae
      PR67_BASE_HEAD: b8a543c09cc89b1b7378f21215f70afa586b248d

    steps:
      - name: Check out exact delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact prerequisite slice from GitHub event refs
        shell: bash
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          resolve_route() {
            local event_name="$1"
            local event_ref="$2"
            local pr_number="$3"
            local head_ref="$4"
            local base_ref="$5"

            active_slice=""
            slice_base_source=""
            active_head_ref=""
            active_base_ref=""
            active_pr_number=""
            case "$event_name" in
              pull_request)
                [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || {
                  echo "invalid prerequisite pull-request number: $pr_number" >&2
                  return 1
                }
                case "${head_ref}|${base_ref}" in
                  "${FD01_BRANCH}|${C0_BRANCH}")
                    test "$pr_number" = "71" || {
                      echo "FD01 delivery is authorized only through PR #71" >&2
                      return 1
                    }
                    active_slice="FD01"
                    slice_base_source="PINNED_C0"
                    ;;
                  "${FD05_BRANCH}|${FD01_BRANCH}")
                    active_slice="FD05"
                    slice_base_source="EVENT_FD01"
                    ;;
                  "${R0_BRANCH}|${FD05_BRANCH}")
                    active_slice="R0"
                    slice_base_source="EVENT_FD05"
                    ;;
                  "${C1_BRANCH}|${FD05_BRANCH}")
                    active_slice="C1"
                    slice_base_source="EVENT_FD05"
                    ;;
                  "${FD02_BRANCH}|${C1_BRANCH}")
                    active_slice="FD02"
                    slice_base_source="EVENT_C1"
                    ;;
                  "${FD03_BRANCH}|${FD02_BRANCH}")
                    active_slice="FD03"
                    slice_base_source="EVENT_FD02"
                    ;;
                  "${FD06_BRANCH}|${FD03_BRANCH}")
                    active_slice="FD06"
                    slice_base_source="EVENT_FD03"
                    ;;
                  "${FD07_BRANCH}|${FD06_BRANCH}")
                    active_slice="FD07"
                    slice_base_source="EVENT_FD06"
                    ;;
                  *)
                    echo "unsupported prerequisite pull-request ref pair: ${head_ref} -> ${base_ref}" >&2
                    return 1
                    ;;
                esac
                active_head_ref="$head_ref"
                active_base_ref="$base_ref"
                active_pr_number="$pr_number"
                ;;
              push)
                case "$event_ref" in
                  "refs/heads/${FD01_BRANCH}")
                    active_slice="FD01"
                    slice_base_source="PINNED_C0"
                    active_head_ref="$FD01_BRANCH"
                    active_base_ref="$C0_BRANCH"
                    ;;
                  "refs/heads/${FD05_BRANCH}")
                    active_slice="FD05"
                    slice_base_source="LIVE_FD01"
                    active_head_ref="$FD05_BRANCH"
                    active_base_ref="$FD01_BRANCH"
                    ;;
                  "refs/heads/${R0_BRANCH}")
                    active_slice="R0"
                    slice_base_source="LIVE_FD05"
                    active_head_ref="$R0_BRANCH"
                    active_base_ref="$FD05_BRANCH"
                    ;;
                  "refs/heads/${C1_BRANCH}")
                    active_slice="C1"
                    slice_base_source="LIVE_FD05"
                    active_head_ref="$C1_BRANCH"
                    active_base_ref="$FD05_BRANCH"
                    ;;
                  "refs/heads/${FD02_BRANCH}")
                    active_slice="FD02"
                    slice_base_source="LIVE_C1"
                    active_head_ref="$FD02_BRANCH"
                    active_base_ref="$C1_BRANCH"
                    ;;
                  "refs/heads/${FD03_BRANCH}")
                    active_slice="FD03"
                    slice_base_source="LIVE_FD02"
                    active_head_ref="$FD03_BRANCH"
                    active_base_ref="$FD02_BRANCH"
                    ;;
                  "refs/heads/${FD06_BRANCH}")
                    active_slice="FD06"
                    slice_base_source="PINNED_FD03"
                    active_head_ref="$FD06_BRANCH"
                    active_base_ref="$FD03_BRANCH"
                    ;;
                  "refs/heads/${FD07_BRANCH}")
                    active_slice="FD07"
                    slice_base_source="PINNED_FD06"
                    active_head_ref="$FD07_BRANCH"
                    active_base_ref="$FD06_BRANCH"
                    ;;
                  *)
                    echo "unsupported prerequisite push ref: $event_ref" >&2
                    return 1
                    ;;
                esac
                ;;
              *)
                echo "unsupported prerequisite event: $event_name" >&2
                return 1
                ;;
            esac
          }

          verify_fd05_pin() {
            local accepted_head="$1"
            local accepted_tree="$2"
            local actual_head="$3"
            local actual_tree="$4"
            [[ "$accepted_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD01_ACCEPTED_HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$accepted_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD01_ACCEPTED_TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            test "$actual_head" = "$accepted_head" || {
              echo "FD05 event/live base HEAD does not match FD01_ACCEPTED_HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$accepted_tree" || {
              echo "FD05 event/live base TREE does not match FD01_ACCEPTED_TREE" >&2
              return 1
            }
          }

          verify_r0_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local accepted_head="$3"
            local accepted_tree="$4"
            local actual_head="$5"
            local actual_tree="$6"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 authorized base HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 authorized base TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            [[ "$accepted_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD05_ACCEPTED_HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$accepted_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD05_ACCEPTED_TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 event/live base HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$actual_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 event/live base TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            test "$accepted_head" = "$authorized_head" || {
              echo "FD05_ACCEPTED_HEAD does not match the exact R0 authorized base HEAD" >&2
              return 1
            }
            test "$accepted_tree" = "$authorized_tree" || {
              echo "FD05_ACCEPTED_TREE does not match the exact R0 authorized base TREE" >&2
              return 1
            }
            test "$actual_head" = "$accepted_head" || {
              echo "R0 event/live base HEAD does not match FD05_ACCEPTED_HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$accepted_tree" || {
              echo "R0 event/live base TREE does not match FD05_ACCEPTED_TREE" >&2
              return 1
            }
          }

          verify_c1_start_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local resolved_head="$3"
            local resolved_tree="$4"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "C1 authorized R0 START HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "C1 authorized R0 START TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            test "$resolved_head" = "$authorized_head" || {
              echo "C1 resolved R0 START HEAD drifted from authorization" >&2
              return 1
            }
            test "$resolved_tree" = "$authorized_tree" || {
              echo "C1 resolved R0 START TREE drifted from authorization" >&2
              return 1
            }
          }

          verify_fd02_base_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local actual_head="$3"
            local actual_tree="$4"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD02 authorized C1 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD02 authorized C1 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD02 event/live C1 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD02 event/live C1 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            test "$actual_head" = "$authorized_head" || {
              echo "FD02 event/live base HEAD does not match accepted C1 HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$authorized_tree" || {
              echo "FD02 event/live base TREE does not match accepted C1 TREE" >&2
              return 1
            }
          }

          verify_fd03_base_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local actual_head="$3"
            local actual_tree="$4"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD03 authorized FD02 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD03 authorized FD02 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD03 event/live FD02 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD03 event/live FD02 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            test "$actual_head" = "$authorized_head" || {
              echo "FD03 event/live base HEAD does not match accepted FD02 HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$authorized_tree" || {
              echo "FD03 event/live base TREE does not match accepted FD02 TREE" >&2
              return 1
            }
          }

          verify_fd06_base_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local actual_head="$3"
            local actual_tree="$4"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD06 authorized FD03 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD06 authorized FD03 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD06 event/pinned FD03 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD06 event/pinned FD03 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            test "$actual_head" = "$authorized_head" || {
              echo "FD06 event/pinned base HEAD does not match accepted FD03 HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$authorized_tree" || {
              echo "FD06 event/pinned base TREE does not match accepted FD03 TREE" >&2
              return 1
            }
          }

          verify_fd07_base_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local actual_head="$3"
            local actual_tree="$4"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD07 authorized FD06 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD07 authorized FD06 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD07 event/pinned FD06 base HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$actual_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD07 event/pinned FD06 base TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            test "$actual_head" = "$authorized_head" || {
