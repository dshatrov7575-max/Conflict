  project-language-bootstrap:
    name: Python 3.12 / PostgreSQL 18 / SQLite / F0L-F1-C2A pin gate
    if: >-
      (github.event_name == 'pull_request' &&
       (github.event.pull_request.head.ref == 'codex/ca-suite-i1-project-language-bootstrap-f0l' ||
        github.event.pull_request.head.ref == 'codex/ca-suite-i1-evidence-multilingual-f1' ||
        github.event.pull_request.head.ref == 'codex/ca-suite-i1-production-studio-c2a-lifecycle-publication')) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/codex/ca-suite-i1-project-language-bootstrap-f0l' ||
        github.ref == 'refs/heads/codex/ca-suite-i1-evidence-multilingual-f1' ||
        github.ref == 'refs/heads/codex/ca-suite-i1-production-studio-c2a-lifecycle-publication'))
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: software/conflict_analysis

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      F0L_BASE_HEAD: 710b88f0db9ec2f0e2fae65c7e0c77025115771a
      F0L_BASE_TREE: 0a15bd4d6993f87199329d0907be372aec9e69ca
      F0L_BASE_BRANCH: codex/ca-suite-i1-foundation-fd07-publication-readiness
      F0L_BRANCH: codex/ca-suite-i1-project-language-bootstrap-f0l
      F1_BRANCH: codex/ca-suite-i1-evidence-multilingual-f1
      C2A_BRANCH: codex/ca-suite-i1-production-studio-c2a-lifecycle-publication
      F0L_ACCEPTED_HEAD: "${{ vars.F0L_ACCEPTED_HEAD }}"
      F0L_ACCEPTED_TREE: "${{ vars.F0L_ACCEPTED_TREE }}"

    steps:
      - name: Check out exact delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact F0L or accepted-F0L successor route
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          delivery_head="$(git rev-parse HEAD)"
          delivery_tree="$(git rev-parse HEAD^{tree})"
          [[ "$delivery_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$delivery_tree" =~ ^[0-9a-f]{40}$ ]]

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test "$EVENT_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$EVENT_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$EVENT_HEAD_SHA" = "$delivery_head"
              case "${EVENT_HEAD_REF}|${EVENT_BASE_REF}" in
                "${F0L_BRANCH}|${F0L_BASE_BRANCH}")
                  active_slice=F0L
                  ;;
                "${F1_BRANCH}|${F0L_BRANCH}")
                  active_slice=F1
                  ;;
                "${C2A_BRANCH}|${F0L_BRANCH}")
                  active_slice=C2A
                  ;;
                *)
                  echo "unsupported F0L/F1/C2A pull-request ref pair" >&2
                  exit 1
                  ;;
              esac
              slice_base_head="$EVENT_BASE_SHA"
              ;;
            push)
              test "$GITHUB_SHA" = "$delivery_head"
              case "$GITHUB_REF" in
                "refs/heads/${F0L_BRANCH}")
                  active_slice=F0L
                  slice_base_head="$F0L_BASE_HEAD"
                  ;;
                "refs/heads/${F1_BRANCH}")
                  active_slice=F1
                  ;;
                "refs/heads/${C2A_BRANCH}")
                  active_slice=C2A
                  ;;
                *)
                  echo "unsupported F0L/F1/C2A push ref" >&2
                  exit 1
                  ;;
              esac
              if [[ "$active_slice" != F0L ]]; then
                git fetch --no-tags origin \
                  "+refs/heads/${F0L_BRANCH}:refs/remotes/origin/accepted-f0l-base"
                slice_base_head="$(git rev-parse refs/remotes/origin/accepted-f0l-base)"
              fi
              ;;
            *)
              echo "unsupported workflow event" >&2
              exit 1
              ;;
          esac

          git cat-file -e "$slice_base_head^{commit}"
          slice_base_tree="$(git rev-parse "$slice_base_head^{tree}")"
          if [[ "$active_slice" = F0L ]]; then
            test "$slice_base_head" = "$F0L_BASE_HEAD"
            test "$slice_base_tree" = "$F0L_BASE_TREE"
            accepted_pin=NOT_APPLICABLE_CURRENT_F0L
          else
            [[ "$F0L_ACCEPTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
              echo "F0L_ACCEPTED_HEAD must be an exact lowercase 40-hex commit id" >&2
              exit 1
            }
            [[ "$F0L_ACCEPTED_TREE" =~ ^[0-9a-f]{40}$ ]] || {
              echo "F0L_ACCEPTED_TREE must be an exact lowercase 40-hex tree id" >&2
              exit 1
            }
            test "$slice_base_head" = "$F0L_ACCEPTED_HEAD"
            test "$slice_base_tree" = "$F0L_ACCEPTED_TREE"
            accepted_pin=PIN_VERIFIED_EXTERNAL
          fi

          {
            echo "ACTIVE_SLICE=$active_slice"
            echo "SLICE_BASE_HEAD=$slice_base_head"
            echo "SLICE_BASE_TREE=$slice_base_tree"
            echo "F0L_BASE_PIN=$accepted_pin"
          } >> "$GITHUB_ENV"
          echo "ACTIVE_SLICE=$active_slice"
          echo "F0L_BASE_PIN=$accepted_pin"

      - name: Run workflow route and external-pin self-checks
        shell: bash
        run: |
          set -euo pipefail
          resolve_declared_route() {
            local event_name="$1"
            local event_ref="$2"
            local head_ref="$3"
            local base_ref="$4"
            resolved=""
            case "$event_name" in
              push)
                case "$event_ref" in
                  "refs/heads/${F0L_BRANCH}") resolved=F0L ;;
                  "refs/heads/${F1_BRANCH}") resolved=F1 ;;
                  "refs/heads/${C2A_BRANCH}") resolved=C2A ;;
                  *) return 1 ;;
                esac
                ;;
              pull_request)
                case "${head_ref}|${base_ref}" in
                  "${F0L_BRANCH}|${F0L_BASE_BRANCH}") resolved=F0L ;;
                  "${F1_BRANCH}|${F0L_BRANCH}") resolved=F1 ;;
                  "${C2A_BRANCH}|${F0L_BRANCH}") resolved=C2A ;;
                  *) return 1 ;;
                esac
                ;;
              *) return 1 ;;
            esac
          }
          assert_route() {
            local expected="$1"
            shift
            resolve_declared_route "$@"
            test "$resolved" = "$expected"
          }
          assert_route_failure() {
            if resolve_declared_route "$@" >/dev/null 2>&1; then
              echo "workflow route self-check accepted an unsupported event" >&2
              return 1
            fi
          }
          assert_pin_pair() {
            local head="$1"
            local tree="$2"
            [[ "$head" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
          }
          assert_pin_failure() {
            if assert_pin_pair "$@" >/dev/null 2>&1; then
              echo "workflow accepted a malformed or partial F0L pin" >&2
              return 1
            fi
          }

          assert_route F0L push "refs/heads/${F0L_BRANCH}" "" ""
          assert_route F1 push "refs/heads/${F1_BRANCH}" "" ""
          assert_route C2A push "refs/heads/${C2A_BRANCH}" "" ""
          assert_route F0L pull_request "" "$F0L_BRANCH" "$F0L_BASE_BRANCH"
          assert_route F1 pull_request "" "$F1_BRANCH" "$F0L_BRANCH"
          assert_route C2A pull_request "" "$C2A_BRANCH" "$F0L_BRANCH"
          assert_route_failure pull_request "" "$F1_BRANCH" "$F0L_BASE_BRANCH"
          assert_route_failure pull_request "" "$C2A_BRANCH" "$F0L_BASE_BRANCH"
          assert_route_failure push "refs/heads/${F0L_BRANCH}-unexpected" "" ""
          assert_route_failure workflow_dispatch "" "" ""
          pin_head="$(printf 'a%.0s' {1..40})"
          pin_tree="$(printf 'b%.0s' {1..40})"
          assert_pin_pair "$pin_head" "$pin_tree"
          assert_pin_failure "" "$pin_tree"
          assert_pin_failure "$pin_head" ""
          assert_pin_failure "${pin_head^^}" "$pin_tree"
          echo "F0L_WORKFLOW_ROUTING_SELF_CHECK=PASS"
          echo "POST_F0L_EXTERNAL_PIN_SELF_CHECK=PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Set up Node.js 24 for real caller harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check

      - name: Run deterministic positive and bounded negative verifier self-checks
        run: python scripts/verify_production_studio_c_allowlist.py --self-check

      - name: Verify exact route, ancestry, 26-path allowlist and bounded fixture deltas
        if: env.ACTIVE_SLICE == 'F0L'
        run: |
          set -euo pipefail
          verifier_args=(
            --slice "$ACTIVE_SLICE"
            --base-head "$SLICE_BASE_HEAD"
            --base-tree "$SLICE_BASE_TREE"
            --repo "$GITHUB_WORKSPACE"
          )
          if [[ "$ACTIVE_SLICE" != F0L ]]; then
            verifier_args+=(
              --f0l-accepted-head "$F0L_ACCEPTED_HEAD"
              --f0l-accepted-tree "$F0L_ACCEPTED_TREE"
            )
          fi
          verifier_report="${RUNNER_TEMP}/project-language-verifier.json"
          python scripts/verify_production_studio_c_allowlist.py \
            "${verifier_args[@]}" | tee "$verifier_report"
          if [[ "$ACTIVE_SLICE" = F0L ]]; then
            python - "$verifier_report" <<'PY'
          import json
          import sys

          report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          assert report["exact_changed_path_count"] == 26
          assert len(report["changed_paths"]) == 26
          assert len(report["new_paths"]) == 4
          assert len(report["existing_base_blobs"]) == 22
          assert len(report["bounded_fixture_deltas"]) == 3
          print("F0L_EXACT_26_PATH_AND_FIXTURE_DELTA_GATE=PASS")
          PY
          fi
          git diff --check "$SLICE_BASE_HEAD...HEAD"

      - name: Bind exact F1 or C2A evidence directory
        if: env.ACTIVE_SLICE == 'F1' || env.ACTIVE_SLICE == 'C2A'
        shell: bash
        run: |
          set -euo pipefail
          printf 'SUCCESSOR_EVIDENCE_DIR=%s\n' \
            "$RUNNER_TEMP/successor-evidence" >> "$GITHUB_ENV"

      - name: Initialize exact F1 or C2A evidence manifest
        if: env.ACTIVE_SLICE == 'F1' || env.ACTIVE_SLICE == 'C2A'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$SUCCESSOR_EVIDENCE_DIR"
          delivery_head="$(git rev-parse HEAD)"
          delivery_tree="$(git rev-parse HEAD^{tree})"
          python - \
            "$SUCCESSOR_EVIDENCE_DIR/manifest.json" \
            "$ACTIVE_SLICE" \
            "$SLICE_BASE_HEAD" \
            "$SLICE_BASE_TREE" \
            "$delivery_head" \
            "$delivery_tree" <<'PY'
          import json
          import pathlib
          import sys

          output, active_slice, base_head, base_tree, delivery_head, delivery_tree = sys.argv[1:]
          junit_files = {
              "F1": [
                  "f1-focused-postgresql.xml",
                  "f1-focused-sqlite.xml",
                  "f1-foundation-postgresql.xml",
                  "f1-foundation-sqlite.xml",
                  "f1-c0-postgresql.xml",
                  "f1-c0-sqlite.xml",
                  "f1-c1-postgresql.xml",
                  "f1-c1-sqlite.xml",
                  "f1-c1-chromium-postgresql.xml",
              ],
              "C2A": [
                  "c2a-portable-postgresql.xml",
                  "c2a-portable-sqlite.xml",
                  "c2a-foundation-postgresql.xml",
                  "c2a-foundation-sqlite.xml",
                  "c2a-c0-postgresql.xml",
                  "c2a-c0-sqlite.xml",
                  "c2a-c1-postgresql.xml",
                  "c2a-c1-sqlite.xml",
                  "c2a-c1-chromium-postgresql.xml",
                  "c2a-chromium-postgresql.xml",
              ],
          }[active_slice]
          payload = {
              "schema": "POST_F0L_SUCCESSOR_CI_EVIDENCE_V1",
              "active_slice": active_slice,
              "base_head": base_head,
              "base_tree": base_tree,
              "delivery_head": delivery_head,
              "delivery_tree": delivery_tree,
              "junit_files": junit_files,
              "migration_evidence": "migration.json",
              "wheel_file": "conflict_analysis-0.1.0-py3-none-any.whl",
              "wheel_install_evidence": "wheel-install.json",
              "synthetic_tree_evidence": (
                  None if active_slice == "F1" else "synthetic-tree.json"
              ),
          }
          pathlib.Path(output).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"{active_slice}_SUCCESSOR_EVIDENCE_MANIFEST=PASS")
          PY

      - name: Check successor static contracts and clean PostgreSQL migrations
        if: env.ACTIVE_SLICE == 'F1' || env.ACTIVE_SLICE == 'C2A'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q conflict_analysis domain production_studio
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check

          if [[ "$ACTIVE_SLICE" = F1 ]]; then
            test -f domain/migrations/0017_multilingual_evidence_lineage.py
            test -f domain/services/document_lineage.py
            test -f domain/services/evidence_drilldown.py
            test -f domain/api/evidence.py
            test -f docs/adr/0012-multilingual-evidence-document-lineage.md
          else
            contract=production_studio/contracts/lifecycle_publication_claim_boundaries_v1.ru.json
            digest_file="${contract}.sha256"
            test -f production_studio/lifecycle_claim_boundaries.py
            test -f "$contract"
            test -f "$digest_file"
            test -f production_studio/templates/production_studio/lifecycle_publication_definition.html
            test -f production_studio/static/production_studio/lifecycle_publication.css
            test -f production_studio/static/production_studio/lifecycle_publication.js
            test -f production_studio/browser_tests/lifecycle_publication.mjs
            node --check production_studio/static/production_studio/lifecycle_publication.js
            node --check production_studio/browser_tests/lifecycle_publication.mjs
            node --check production_studio/static/production_studio/audited_draft.js
            read -r expected_digest _ < "$digest_file"
            actual_digest="$(sha256sum "$contract" | awk '{print $1}')"
            test "$actual_digest" = "$expected_digest"
            base_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only \
              "$SLICE_BASE_HEAD" -- software/conflict_analysis/domain/migrations)"
            delivery_migrations="$(git -C "$GITHUB_WORKSPACE" ls-tree -r --name-only \
              HEAD -- software/conflict_analysis/domain/migrations)"
