name: Conflict Analysis Foundation

on:
  pull_request:
    branches:
      - codex/ca-suite-i1-production-studio-c0-read-only
      - codex/ca-suite-i1-foundation-fd01-validation-preview
      - codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"
  push:
    branches:
      - codex/ca-suite-i1-foundation-fd01-validation-preview
      - codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
      - codex/ca-suite-i1-production-studio-c1-r0-ci-pin
      - codex/ca-suite-i1-production-studio-c1-authenticated-draft
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conflict-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-contract:
    name: Python 3.12 / PostgreSQL 18 / SQLite / FD01-FD05-R0-C1 slice gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: software/conflict_analysis

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      FD01_BASE_HEAD: c0b773573c8d37faf7b1b71e910f7a8d356000f4
      FD01_BASE_TREE: 914e3b0895e404cf699d651c8148da875528b4e7
      FD01_RC1_START_HEAD: 1e2fd10878236ee8f0a01a62773894dd9c0d5c40
      FD01_RC1_START_TREE: 671c0777cee1d4542ebe4eeb1128c0e0fecac4b3
      FD01_RC2_START_HEAD: 2bf40798dc2c4ba0ea3c742bf86b88fda4bde8d0
      FD01_RC2_START_TREE: 23161d6d2ba575d1ca92149f468e086ce43df129
      FD01_RC3_START_HEAD: 6b502c985094799050e0970a7c40d5a4f9cd0724
      FD01_RC3_START_TREE: d527e34b8e9d3d67802be0118ac4928821cfd60b
      FD01_ACCEPTED_HEAD: "${{ vars.FD01_ACCEPTED_HEAD }}"
      FD01_ACCEPTED_TREE: "${{ vars.FD01_ACCEPTED_TREE }}"
      FD05_ACCEPTED_HEAD: "${{ vars.FD05_ACCEPTED_HEAD }}"
      FD05_ACCEPTED_TREE: "${{ vars.FD05_ACCEPTED_TREE }}"
      R0_AUTH_BASE_HEAD: ca16f7a99ff044f7fbccb83354d5a9112c99027a
      R0_AUTH_BASE_TREE: c25848dbbb19aabd5a2d4d642b69c66254879059
      C1_R0_START_HEAD: bd6e88c2a5f6552e057ea5b49fc63a1eb77ef4c6
      C1_R0_START_TREE: e1124839da8571408c258517c8afdf24622f1655
      C0_BRANCH: codex/ca-suite-i1-production-studio-c0-read-only
      FD01_BRANCH: codex/ca-suite-i1-foundation-fd01-validation-preview
      FD05_BRANCH: codex/ca-suite-i1-foundation-fd05-audited-write-reconciliation
      R0_BRANCH: codex/ca-suite-i1-production-studio-c1-r0-ci-pin
      C1_BRANCH: codex/ca-suite-i1-production-studio-c1-authenticated-draft
      AUTH_MAIN_HEAD: 19690eb3aede8b603a631d7c561fc74f9022537a
      AUTH_MAIN_TREE: 04d5b43fdf96637f58b8fc6f191323fbad302bbc
      FND_BASE_HEAD: f940a91a92658285063802ee1a43bf84360fc013
      FND_BASE_TREE: 1125b01a90da3ea324e661d729a845c58febb8e2
      FOUNDATION_B_HEAD: 5f73ebf2fd29a161a34ea047c7eead4fb0c582d4
      FOUNDATION_B_TREE: ea5ff9ab510cb76f0c2b1bfda1c02c1278812aae
      PR67_BASE_HEAD: b8a543c09cc89b1b7378f21215f70afa586b248d

    steps:
      - name: Check out exact delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact prerequisite slice from GitHub event refs
        shell: bash
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          resolve_route() {
            local event_name="$1"
            local event_ref="$2"
            local pr_number="$3"
            local head_ref="$4"
            local base_ref="$5"

            active_slice=""
            slice_base_source=""
            active_head_ref=""
            active_base_ref=""
            active_pr_number=""
            case "$event_name" in
              pull_request)
                [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || {
                  echo "invalid prerequisite pull-request number: $pr_number" >&2
                  return 1
                }
                case "${head_ref}|${base_ref}" in
                  "${FD01_BRANCH}|${C0_BRANCH}")
                    test "$pr_number" = "71" || {
                      echo "FD01 delivery is authorized only through PR #71" >&2
                      return 1
                    }
                    active_slice="FD01"
                    slice_base_source="PINNED_C0"
                    ;;
                  "${FD05_BRANCH}|${FD01_BRANCH}")
                    active_slice="FD05"
                    slice_base_source="EVENT_FD01"
                    ;;
                  "${R0_BRANCH}|${FD05_BRANCH}")
                    active_slice="R0"
                    slice_base_source="EVENT_FD05"
                    ;;
                  "${C1_BRANCH}|${FD05_BRANCH}")
                    active_slice="C1"
                    slice_base_source="EVENT_FD05"
                    ;;
                  *)
                    echo "unsupported prerequisite pull-request ref pair: ${head_ref} -> ${base_ref}" >&2
                    return 1
                    ;;
                esac
                active_head_ref="$head_ref"
                active_base_ref="$base_ref"
                active_pr_number="$pr_number"
                ;;
              push)
                case "$event_ref" in
                  "refs/heads/${FD01_BRANCH}")
                    active_slice="FD01"
                    slice_base_source="PINNED_C0"
                    active_head_ref="$FD01_BRANCH"
                    active_base_ref="$C0_BRANCH"
                    ;;
                  "refs/heads/${FD05_BRANCH}")
                    active_slice="FD05"
                    slice_base_source="LIVE_FD01"
                    active_head_ref="$FD05_BRANCH"
                    active_base_ref="$FD01_BRANCH"
                    ;;
                  "refs/heads/${R0_BRANCH}")
                    active_slice="R0"
                    slice_base_source="LIVE_FD05"
                    active_head_ref="$R0_BRANCH"
                    active_base_ref="$FD05_BRANCH"
                    ;;
                  "refs/heads/${C1_BRANCH}")
                    active_slice="C1"
                    slice_base_source="LIVE_FD05"
                    active_head_ref="$C1_BRANCH"
                    active_base_ref="$FD05_BRANCH"
                    ;;
                  *)
                    echo "unsupported prerequisite push ref: $event_ref" >&2
                    return 1
                    ;;
                esac
                ;;
              *)
                echo "unsupported prerequisite event: $event_name" >&2
                return 1
                ;;
            esac
          }

          verify_fd05_pin() {
            local accepted_head="$1"
            local accepted_tree="$2"
            local actual_head="$3"
            local actual_tree="$4"
            [[ "$accepted_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD01_ACCEPTED_HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$accepted_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD01_ACCEPTED_TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            test "$actual_head" = "$accepted_head" || {
              echo "FD05 event/live base HEAD does not match FD01_ACCEPTED_HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$accepted_tree" || {
              echo "FD05 event/live base TREE does not match FD01_ACCEPTED_TREE" >&2
              return 1
            }
          }

          verify_r0_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local accepted_head="$3"
            local accepted_tree="$4"
            local actual_head="$5"
            local actual_tree="$6"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 authorized base HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 authorized base TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            [[ "$accepted_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD05_ACCEPTED_HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$accepted_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FD05_ACCEPTED_TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 event/live base HEAD must be an exact lowercase 40-hex commit id" >&2
              return 1
            }
            [[ "$actual_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "R0 event/live base TREE must be an exact lowercase 40-hex tree id" >&2
              return 1
            }
            test "$accepted_head" = "$authorized_head" || {
              echo "FD05_ACCEPTED_HEAD does not match the exact R0 authorized base HEAD" >&2
              return 1
            }
            test "$accepted_tree" = "$authorized_tree" || {
              echo "FD05_ACCEPTED_TREE does not match the exact R0 authorized base TREE" >&2
              return 1
            }
            test "$actual_head" = "$accepted_head" || {
              echo "R0 event/live base HEAD does not match FD05_ACCEPTED_HEAD" >&2
              return 1
            }
            test "$actual_tree" = "$accepted_tree" || {
              echo "R0 event/live base TREE does not match FD05_ACCEPTED_TREE" >&2
              return 1
            }
          }

          verify_c1_start_pin() {
            local authorized_head="$1"
            local authorized_tree="$2"
            local resolved_head="$3"
            local resolved_tree="$4"
            [[ "$authorized_head" =~ ^[0-9a-f]{40}$ ]] || {
              echo "C1 authorized R0 START HEAD must be exact lowercase 40-hex" >&2
              return 1
            }
            [[ "$authorized_tree" =~ ^[0-9a-f]{40}$ ]] || {
              echo "C1 authorized R0 START TREE must be exact lowercase 40-hex" >&2
              return 1
            }
            test "$resolved_head" = "$authorized_head" || {
              echo "C1 resolved R0 START HEAD drifted from authorization" >&2
              return 1
            }
            test "$resolved_tree" = "$authorized_tree" || {
              echo "C1 resolved R0 START TREE drifted from authorization" >&2
              return 1
            }
          }

          assert_route() {
            local expected="$1"
            shift
            resolve_route "$@"
            local actual="${active_slice}|${slice_base_source}|${active_head_ref}|${active_base_ref}|${active_pr_number}"
            test "$actual" = "$expected"
          }

          assert_route_failure() {
            if resolve_route "$@" >/dev/null 2>&1; then
              echo "routing self-check unexpectedly accepted an unsupported event" >&2
              return 1
            fi
          }

          assert_pin_failure() {
            if verify_fd05_pin "$@" >/dev/null 2>&1; then
              echo "FD05 pin self-check unexpectedly accepted invalid inputs" >&2
              return 1
            fi
          }

          assert_r0_pin_failure() {
            if verify_r0_pin "$@" >/dev/null 2>&1; then
              echo "R0 pin self-check unexpectedly accepted invalid inputs" >&2
              return 1
            fi
          }

          assert_c1_start_pin_failure() {
            if verify_c1_start_pin "$@" >/dev/null 2>&1; then
              echo "C1 R0 START pin self-check unexpectedly accepted invalid inputs" >&2
              return 1
            fi
          }

          pin_head="$(printf 'a%.0s' {1..40})"
          pin_tree="$(printf 'b%.0s' {1..40})"
          other_head="$(printf 'c%.0s' {1..40})"
          other_tree="$(printf 'd%.0s' {1..40})"
          assert_route "FD01|PINNED_C0|${FD01_BRANCH}|${C0_BRANCH}|" \
            push "refs/heads/${FD01_BRANCH}" "" "" ""
          assert_route "FD05|LIVE_FD01|${FD05_BRANCH}|${FD01_BRANCH}|" \
            push "refs/heads/${FD05_BRANCH}" "" "" ""
          assert_route "R0|LIVE_FD05|${R0_BRANCH}|${FD05_BRANCH}|" \
            push "refs/heads/${R0_BRANCH}" "" "" ""
          assert_route "C1|LIVE_FD05|${C1_BRANCH}|${FD05_BRANCH}|" \
            push "refs/heads/${C1_BRANCH}" "" "" ""
          assert_route "FD01|PINNED_C0|${FD01_BRANCH}|${C0_BRANCH}|71" \
            pull_request "" "71" "$FD01_BRANCH" "$C0_BRANCH"
          assert_route "FD05|EVENT_FD01|${FD05_BRANCH}|${FD01_BRANCH}|72" \
            pull_request "" "72" "$FD05_BRANCH" "$FD01_BRANCH"
          assert_route "R0|EVENT_FD05|${R0_BRANCH}|${FD05_BRANCH}|73" \
            pull_request "" "73" "$R0_BRANCH" "$FD05_BRANCH"
          assert_route "C1|EVENT_FD05|${C1_BRANCH}|${FD05_BRANCH}|74" \
            pull_request "" "74" "$C1_BRANCH" "$FD05_BRANCH"
          assert_route_failure push refs/heads/main "" "" ""
          assert_route_failure pull_request "" 72 "$FD01_BRANCH" "$C0_BRANCH"
          assert_route_failure pull_request "" 72 unrelated-head "$C0_BRANCH"
          assert_route_failure pull_request "" 73 "$R0_BRANCH" "$FD01_BRANCH"
          assert_route_failure pull_request "" 73 "$FD05_BRANCH" "$FD05_BRANCH"
          assert_route_failure pull_request "" 74 "$C1_BRANCH" "$R0_BRANCH"
          assert_route_failure pull_request "" 74 "$C1_BRANCH" "$FD01_BRANCH"
          assert_route_failure push "refs/heads/${R0_BRANCH}-unexpected" "" "" ""
          assert_route_failure push "refs/heads/${C1_BRANCH}-unexpected" "" "" ""
          assert_route_failure workflow_dispatch "" "" "" ""
          verify_fd05_pin "$pin_head" "$pin_tree" "$pin_head" "$pin_tree"
          assert_pin_failure "" "$pin_tree" "$pin_head" "$pin_tree"
          assert_pin_failure "$pin_head" "" "$pin_head" "$pin_tree"
          assert_pin_failure AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA "$pin_tree" "$pin_head" "$pin_tree"
          assert_pin_failure "$pin_head" BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB "$pin_head" "$pin_tree"
          assert_pin_failure "$pin_head" "$pin_tree" "$other_head" "$pin_tree"
          assert_pin_failure "$pin_head" "$pin_tree" "$pin_head" "$other_tree"
          verify_r0_pin "$pin_head" "$pin_tree" "$pin_head" "$pin_tree" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "" "" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "$pin_head" "" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "" "$pin_tree" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA "$pin_tree" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "$pin_head" BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "$other_head" "$pin_tree" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "$pin_head" "$other_tree" "$pin_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "$pin_head" "$pin_tree" "$other_head" "$pin_tree"
          assert_r0_pin_failure "$pin_head" "$pin_tree" "$pin_head" "$pin_tree" "$pin_head" "$other_tree"
          verify_c1_start_pin "$pin_head" "$pin_tree" "$pin_head" "$pin_tree"
          assert_c1_start_pin_failure "" "$pin_tree" "$pin_head" "$pin_tree"
          assert_c1_start_pin_failure "$pin_head" "" "$pin_head" "$pin_tree"
          assert_c1_start_pin_failure AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA "$pin_tree" "$pin_head" "$pin_tree"
          assert_c1_start_pin_failure "$pin_head" BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB "$pin_head" "$pin_tree"
          assert_c1_start_pin_failure "$pin_head" "$pin_tree" "$other_head" "$pin_tree"
          assert_c1_start_pin_failure "$pin_head" "$pin_tree" "$pin_head" "$other_tree"
          echo "ROUTING_MATRIX_SELF_CHECK=PASS"
          echo "FD05_EXTERNAL_PIN_SELF_CHECK=PASS"
          echo "R0_EXTERNAL_PIN_SELF_CHECK=PASS"
          echo "C1_ROUTING_SELF_CHECK=PASS"
          echo "C1_R0_START_PIN_SELF_CHECK=PASS"

          delivery_head="$(git rev-parse HEAD)"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test "$EVENT_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$EVENT_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
              test "$EVENT_HEAD_SHA" = "$delivery_head"
              ;;
            push)
              test "$GITHUB_SHA" = "$delivery_head"
              ;;
          esac
          resolve_route \
            "$GITHUB_EVENT_NAME" \
            "$GITHUB_REF" \
            "$EVENT_PR_NUMBER" \
            "$EVENT_HEAD_REF" \
            "$EVENT_BASE_REF"

          case "$slice_base_source" in
            PINNED_C0)
              slice_base_head="$FD01_BASE_HEAD"
              if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
                test "$EVENT_BASE_SHA" = "$slice_base_head"
              fi
              ;;
            EVENT_FD01)
              slice_base_head="$EVENT_BASE_SHA"
              ;;
            LIVE_FD01)
              git fetch --no-tags origin \
                "+refs/heads/${FD01_BRANCH}:refs/remotes/origin/fd01-target"
              slice_base_head="$(git rev-parse refs/remotes/origin/fd01-target)"
              ;;
            EVENT_FD05)
              slice_base_head="$EVENT_BASE_SHA"
              ;;
            LIVE_FD05)
              git fetch --no-tags origin \
                "+refs/heads/${FD05_BRANCH}:refs/remotes/origin/fd05-target"
              slice_base_head="$(git rev-parse refs/remotes/origin/fd05-target)"
              ;;
            *)
              echo "unsupported slice base source: $slice_base_source" >&2
              exit 1
              ;;
          esac

          [[ "$delivery_head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$slice_base_head" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$slice_base_head^{commit}"
          slice_base_tree="$(git rev-parse "$slice_base_head^{tree}")"
          [[ "$slice_base_tree" =~ ^[0-9a-f]{40}$ ]]
          case "$active_slice" in
            FD01)
              test "$slice_base_tree" = "$FD01_BASE_TREE"
              fd05_base_pin="NOT_APPLICABLE_CURRENT_FD01"
              r0_base_pin="NOT_APPLICABLE_CURRENT_FD01"
              ;;
            FD05)
              verify_fd05_pin \
                "$FD01_ACCEPTED_HEAD" \
                "$FD01_ACCEPTED_TREE" \
                "$slice_base_head" \
                "$slice_base_tree"
              fd05_base_pin="PIN_VERIFIED_EXTERNAL"
              r0_base_pin="NOT_APPLICABLE_CURRENT_FD05"
              ;;
            R0)
              verify_r0_pin \
                "$R0_AUTH_BASE_HEAD" \
                "$R0_AUTH_BASE_TREE" \
                "$FD05_ACCEPTED_HEAD" \
                "$FD05_ACCEPTED_TREE" \
                "$slice_base_head" \
                "$slice_base_tree"
              fd05_base_pin="PIN_VERIFIED_EXTERNAL"
              r0_base_pin="PIN_VERIFIED_EXTERNAL"
              ;;
            C1)
              verify_r0_pin \
                "$R0_AUTH_BASE_HEAD" \
                "$R0_AUTH_BASE_TREE" \
                "$FD05_ACCEPTED_HEAD" \
                "$FD05_ACCEPTED_TREE" \
                "$slice_base_head" \
                "$slice_base_tree"
              [[ "$C1_R0_START_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
                echo "C1 R0 START HEAD must be an exact lowercase 40-hex commit id" >&2
                exit 1
              }
              [[ "$C1_R0_START_TREE" =~ ^[0-9a-f]{40}$ ]] || {
                echo "C1 R0 START TREE must be an exact lowercase 40-hex tree id" >&2
                exit 1
              }
              git cat-file -e "$C1_R0_START_HEAD^{commit}"
              verify_c1_start_pin \
                "$C1_R0_START_HEAD" \
                "$C1_R0_START_TREE" \
                "$(git rev-parse "$C1_R0_START_HEAD")" \
                "$(git rev-parse "$C1_R0_START_HEAD^{tree}")"
              fd05_base_pin="PIN_VERIFIED_EXTERNAL"
              r0_base_pin="PIN_VERIFIED_AUTHORIZATION"
              ;;
            *)
              echo "unsupported active slice: $active_slice" >&2
              exit 1
              ;;
          esac

          {
            echo "ACTIVE_SLICE=$active_slice"
            echo "SLICE_BASE_HEAD=$slice_base_head"
            echo "SLICE_BASE_TREE=$slice_base_tree"
            echo "SLICE_BASE_SOURCE=$slice_base_source"
            echo "SLICE_HEAD_REF=$active_head_ref"
            echo "SLICE_BASE_REF=$active_base_ref"
            echo "SLICE_PR_NUMBER=$active_pr_number"
            echo "FD05_BASE_PIN=$fd05_base_pin"
            echo "R0_BASE_PIN=$r0_base_pin"
          } >> "$GITHUB_ENV"
          echo "FD05_BASE_PIN=$fd05_base_pin"
          echo "R0_BASE_PIN=$r0_base_pin"

      - name: Verify active-slice authorization drift, ancestry and synthetic merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delivery_head="$(git rev-parse HEAD)"
          test "$(git rev-parse "$FD01_BASE_HEAD^{tree}")" = "$FD01_BASE_TREE"
          test "$(git rev-parse "$FD01_RC1_START_HEAD^{tree}")" = "$FD01_RC1_START_TREE"
          test "$(git rev-parse "$FD01_RC2_START_HEAD^{tree}")" = "$FD01_RC2_START_TREE"
          test "$(git rev-parse "$FD01_RC3_START_HEAD^{tree}")" = "$FD01_RC3_START_TREE"
          test "$(git rev-parse "$SLICE_BASE_HEAD^{tree}")" = "$SLICE_BASE_TREE"
          test "$(git rev-parse "$FND_BASE_HEAD^{tree}")" = "$FND_BASE_TREE"
          test "$(git rev-parse "$FOUNDATION_B_HEAD^{tree}")" = "$FOUNDATION_B_TREE"
          test "$(git rev-parse "$AUTH_MAIN_HEAD^{tree}")" = "$AUTH_MAIN_TREE"
          git merge-base --is-ancestor "$AUTH_MAIN_HEAD" "$FND_BASE_HEAD"
          git merge-base --is-ancestor "$FND_BASE_HEAD" "$FOUNDATION_B_HEAD"
          git merge-base --is-ancestor "$AUTH_MAIN_HEAD" "$FOUNDATION_B_HEAD"
          git merge-base --is-ancestor "$FOUNDATION_B_HEAD" "$FD01_BASE_HEAD"
          git merge-base --is-ancestor "$FD01_BASE_HEAD" "$FD01_RC1_START_HEAD"
          git merge-base --is-ancestor "$FD01_RC1_START_HEAD" "$FD01_RC2_START_HEAD"
          git merge-base --is-ancestor "$FD01_RC2_START_HEAD" "$FD01_RC3_START_HEAD"
          git merge-base --is-ancestor "$FD01_RC3_START_HEAD" "$delivery_head"
          git merge-base --is-ancestor "$FD01_RC2_START_HEAD" "$delivery_head"
          git merge-base --is-ancestor "$SLICE_BASE_HEAD" "$delivery_head"
          test -z "$(git rev-list --merges "$FD01_BASE_HEAD..$delivery_head")"
          case "$ACTIVE_SLICE" in
            FD01)
              test "$SLICE_BASE_HEAD" = "$FD01_BASE_HEAD"
              test "$SLICE_BASE_TREE" = "$FD01_BASE_TREE"
              test "$SLICE_BASE_SOURCE" = "PINNED_C0"
              test "$FD05_BASE_PIN" = "NOT_APPLICABLE_CURRENT_FD01"
              test "$R0_BASE_PIN" = "NOT_APPLICABLE_CURRENT_FD01"
              test "$(git rev-list --count "$FD01_RC3_START_HEAD..$delivery_head")" = "1"
              test "$(git rev-parse "$delivery_head^")" = "$FD01_RC3_START_HEAD"
              ;;
            FD05)
              case "$SLICE_BASE_SOURCE" in
                EVENT_FD01|LIVE_FD01) ;;
                *) exit 1 ;;
              esac
              test "$FD05_BASE_PIN" = "PIN_VERIFIED_EXTERNAL"
              test "$R0_BASE_PIN" = "NOT_APPLICABLE_CURRENT_FD05"
              test "$SLICE_BASE_HEAD" = "$FD01_ACCEPTED_HEAD"
              test "$SLICE_BASE_TREE" = "$FD01_ACCEPTED_TREE"
              git merge-base --is-ancestor "$FD01_RC2_START_HEAD" "$SLICE_BASE_HEAD"
              git merge-base --is-ancestor "$FD01_RC3_START_HEAD" "$SLICE_BASE_HEAD"
              ;;
            R0)
              case "$SLICE_BASE_SOURCE" in
                EVENT_FD05|LIVE_FD05) ;;
                *) exit 1 ;;
              esac
              test "$FD05_BASE_PIN" = "PIN_VERIFIED_EXTERNAL"
              test "$R0_BASE_PIN" = "PIN_VERIFIED_EXTERNAL"
              test "$SLICE_BASE_HEAD" = "$R0_AUTH_BASE_HEAD"
              test "$SLICE_BASE_TREE" = "$R0_AUTH_BASE_TREE"
              test "$SLICE_BASE_HEAD" = "$FD05_ACCEPTED_HEAD"
              test "$SLICE_BASE_TREE" = "$FD05_ACCEPTED_TREE"
              test "$(git merge-base "$SLICE_BASE_HEAD" "$delivery_head")" = "$SLICE_BASE_HEAD"
              test -z "$(git rev-list --merges "$SLICE_BASE_HEAD..$delivery_head")"
              r0_workflow_seen=false
              r0_verifier_seen=false
              mapfile -t r0_changed_paths < <(
                git diff --name-only "$SLICE_BASE_HEAD...$delivery_head" --
              )
              test "${#r0_changed_paths[@]}" -eq 2
              for changed_path in "${r0_changed_paths[@]}"; do
                case "$changed_path" in
                  .github/workflows/conflict-analysis.yml)
                    r0_workflow_seen=true
                    ;;
                  software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py)
                    r0_verifier_seen=true
                    ;;
                  *)
                    echo "R0 changed path outside the exact two-path allowlist: $changed_path" >&2
                    exit 1
                    ;;
                esac
              done
              test "$r0_workflow_seen" = true
              test "$r0_verifier_seen" = true
              ;;
            C1)
              case "$SLICE_BASE_SOURCE" in
                EVENT_FD05|LIVE_FD05) ;;
                *) exit 1 ;;
              esac
              test "$FD05_BASE_PIN" = "PIN_VERIFIED_EXTERNAL"
              test "$R0_BASE_PIN" = "PIN_VERIFIED_AUTHORIZATION"
              test "$SLICE_BASE_HEAD" = "$FD05_ACCEPTED_HEAD"
              test "$SLICE_BASE_TREE" = "$FD05_ACCEPTED_TREE"
              test "$SLICE_BASE_HEAD" = "$R0_AUTH_BASE_HEAD"
              test "$SLICE_BASE_TREE" = "$R0_AUTH_BASE_TREE"
              test "$(git rev-parse "$C1_R0_START_HEAD^{tree}")" = "$C1_R0_START_TREE"
              test "$(git merge-base "$SLICE_BASE_HEAD" "$C1_R0_START_HEAD")" = "$SLICE_BASE_HEAD"
              test "$(git merge-base "$C1_R0_START_HEAD" "$delivery_head")" = "$C1_R0_START_HEAD"
              test -z "$(git rev-list --merges "$C1_R0_START_HEAD..$delivery_head")"
              mapfile -t c1_changed_paths < <(
                git diff --name-only "$C1_R0_START_HEAD...$delivery_head" --
              )
              test "${#c1_changed_paths[@]}" -eq 16
              for changed_path in "${c1_changed_paths[@]}"; do
                case "$changed_path" in
                  .github/workflows/conflict-analysis.yml|\
                  software/conflict_analysis/README.md|\
                  software/conflict_analysis/docs/adr/0008-production-studio-c-audited-draft.md|\
                  software/conflict_analysis/docs/production-studio-c-read-only-runtime.md|\
                  software/conflict_analysis/production_studio/authoring_claim_boundaries.py|\
                  software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs|\
                  software/conflict_analysis/production_studio/contracts/audited_draft_claim_boundaries_v1.ru.json|\
                  software/conflict_analysis/production_studio/contracts/audited_draft_claim_boundaries_v1.ru.json.sha256|\
                  software/conflict_analysis/production_studio/static/production_studio/audited_draft.css|\
                  software/conflict_analysis/production_studio/static/production_studio/audited_draft.js|\
                  software/conflict_analysis/production_studio/templates/production_studio/audited_draft_definition.html|\
                  software/conflict_analysis/production_studio/templates/production_studio/audited_draft_entry.html|\
                  software/conflict_analysis/production_studio/tests/test_audited_authoring.py|\
                  software/conflict_analysis/production_studio/urls.py|\
                  software/conflict_analysis/production_studio/views.py|\
                  software/conflict_analysis/scripts/verify_production_studio_c_allowlist.py)
                    ;;
                  *)
                    echo "C1 changed path outside the exact 16-path allowlist: $changed_path" >&2
                    exit 1
                    ;;
                esac
              done
              echo "C1_EXACT_16_PATH_ALLOWLIST=PASS"
              echo "C1_R0_START_PIN=PASS"
              ;;
            *)
              echo "unsupported active slice: $ACTIVE_SLICE" >&2
              exit 1
              ;;
          esac

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/codex/ca-suite-i1-foundation-application-gateways:refs/remotes/origin/foundation-b \
            +refs/heads/codex/ca-suite-i1-production-studio-c0-read-only:refs/remotes/origin/c0 \
            +refs/heads/codex/ca-suite-i1-foundation-fd01-validation-preview:refs/remotes/origin/fd01-target \
            +refs/pull/67/merge:refs/remotes/origin/pr67-merge \
            +refs/pull/69/merge:refs/remotes/origin/pr69-merge
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTH_MAIN_HEAD"
          test "$(git rev-parse refs/remotes/origin/foundation-b)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/c0)" = "$FD01_BASE_HEAD"
          case "$ACTIVE_SLICE" in
            FD01)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$delivery_head"
              ;;
            FD05)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$SLICE_BASE_HEAD"
              ;;
            R0)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$FD01_ACCEPTED_HEAD"
              ;;
            C1)
              test "$(git rev-parse refs/remotes/origin/fd01-target)" = "$FD01_ACCEPTED_HEAD"
              ;;
          esac

          if [[ "$ACTIVE_SLICE" = R0 || "$ACTIVE_SLICE" = C1 ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${FD05_BRANCH}:refs/remotes/origin/fd05-target" \
              +refs/pull/72/merge:refs/remotes/origin/pr72-merge
            test "$(git rev-parse refs/remotes/origin/fd05-target)" = "$SLICE_BASE_HEAD"
            IFS=$'\t' read -r state72 draft72 merged72 head72 headref72 base72 baseref72 <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/72" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .base.sha, .base.ref] | @tsv'
            )"
            test "$state72" = open
            test "$draft72" = true
            test "$merged72" = false
            test "$head72" = "$FD05_ACCEPTED_HEAD"
            test "$headref72" = "$FD05_BRANCH"
            test "$base72" = "$FD01_ACCEPTED_HEAD"
            test "$baseref72" = "$FD01_BRANCH"
            test "$(git rev-parse refs/remotes/origin/pr72-merge^1)" = "$FD01_ACCEPTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr72-merge^2)" = "$FD05_ACCEPTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr72-merge^{tree})" = "$FD05_ACCEPTED_TREE"
          fi

          if [[ "$ACTIVE_SLICE" = C1 ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${R0_BRANCH}:refs/remotes/origin/r0-start" \
              +refs/pull/73/merge:refs/remotes/origin/pr73-merge
            test "$(git rev-parse refs/remotes/origin/r0-start)" = "$C1_R0_START_HEAD"
            test "$(git rev-parse refs/remotes/origin/r0-start^{tree})" = "$C1_R0_START_TREE"
            IFS=$'\t' read -r state73 draft73 merged73 head73 headref73 base73 baseref73 <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/73" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .base.sha, .base.ref] | @tsv'
            )"
            test "$state73" = open
            test "$draft73" = true
            test "$merged73" = false
            test "$head73" = "$C1_R0_START_HEAD"
            test "$headref73" = "$R0_BRANCH"
            test "$base73" = "$FD05_ACCEPTED_HEAD"
            test "$baseref73" = "$FD05_BRANCH"
            test "$(git rev-parse refs/remotes/origin/pr73-merge^1)" = "$FD05_ACCEPTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr73-merge^2)" = "$C1_R0_START_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr73-merge^{tree})" = "$C1_R0_START_TREE"
            echo "C1_ACCEPTED_R0_REF_AND_PR73=PASS"
          fi

          IFS=$'\t' read -r state67 draft67 merged67 head67 base67 mergeable67 <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/67" \
              --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .base.sha, (.mergeable|tostring)] | @tsv'
          )"
          test "$state67" = open
          test "$draft67" = true
          test "$merged67" = false
          test "$head67" = "$FOUNDATION_B_HEAD"
          test "$base67" = "$PR67_BASE_HEAD"
          test "$mergeable67" = true
          test "$(git rev-parse refs/remotes/origin/pr67-merge^1)" = "$PR67_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr67-merge^2)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr67-merge^{tree})" = "$FOUNDATION_B_TREE"

          IFS=$'\t' read -r state69 draft69 merged69 head69 base69 mergeable69 <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/69" \
              --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .base.sha, (.mergeable|tostring)] | @tsv'
          )"
          test "$state69" = open
          test "$draft69" = true
          test "$merged69" = false
          test "$head69" = "$FD01_BASE_HEAD"
          test "$base69" = "$FOUNDATION_B_HEAD"
          test "$mergeable69" = true
          test "$(git rev-parse refs/remotes/origin/pr69-merge^1)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr69-merge^2)" = "$FD01_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr69-merge^{tree})" = "$FD01_BASE_TREE"

          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            if [[ "$ACTIVE_SLICE" = FD01 ]]; then
              test "$SLICE_PR_NUMBER" = "71"
            fi

            IFS=$'\t' read -r state_slice draft_slice merged_slice head_slice headref_slice headrepo_slice base_slice baseref_slice <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${SLICE_PR_NUMBER}" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .head.repo.full_name, .base.sha, .base.ref] | @tsv'
            )"
            test "$state_slice" = open
            test "$draft_slice" = true
            test "$merged_slice" = false
            test "$head_slice" = "$delivery_head"
            test "$headref_slice" = "$SLICE_HEAD_REF"
            test "$headrepo_slice" = "$GITHUB_REPOSITORY"
            test "$base_slice" = "$SLICE_BASE_HEAD"
            test "$baseref_slice" = "$SLICE_BASE_REF"

            git fetch --no-tags origin \
              "+refs/pull/${SLICE_PR_NUMBER}/merge:refs/remotes/origin/active-slice-merge"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^1)" = "$SLICE_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^2)" = "$delivery_head"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^{tree})" = "$(git rev-parse "$delivery_head^{tree}")"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^{tree})" = "$(git merge-tree --write-tree "$SLICE_BASE_HEAD" "$delivery_head")"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Run offline deterministic verifier contract self-checks
        run: |
          python scripts/verify_foundation_c1_prerequisites_allowlist.py --self-check-contracts
          python scripts/verify_production_studio_c_allowlist.py --self-check

      - name: Set up Node.js 24 for Chromium harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check
          node --check production_studio/static/production_studio/studio.js
          node --check production_studio/browser_tests/cdp_client.mjs
          node --check production_studio/browser_tests/read_only_smoke.mjs
          if [[ "$ACTIVE_SLICE" = C1 ]]; then
            node --check production_studio/static/production_studio/audited_draft.js
            node --check production_studio/browser_tests/audited_authoring.mjs
          fi

      - name: Verify exact active-slice allowlist and frozen accepted surfaces
        run: |
          if [[ "$ACTIVE_SLICE" = R0 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice R0 \
              --base-head "$SLICE_BASE_HEAD" \
              --base-tree "$SLICE_BASE_TREE" \
              --fd05-accepted-head "$FD05_ACCEPTED_HEAD" \
              --fd05-accepted-tree "$FD05_ACCEPTED_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$SLICE_BASE_HEAD"
          elif [[ "$ACTIVE_SLICE" = C1 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice C1 \
              --base-head "$C1_R0_START_HEAD" \
              --base-tree "$C1_R0_START_TREE" \
              --fd05-accepted-head "$FD05_ACCEPTED_HEAD" \
              --fd05-accepted-tree "$FD05_ACCEPTED_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$C1_R0_START_HEAD"
          else
            verifier_args=(
              --slice "$ACTIVE_SLICE"
              --base-head "$SLICE_BASE_HEAD"
              --base-tree "$SLICE_BASE_TREE"
            )
            if [[ "$ACTIVE_SLICE" = FD05 ]]; then
              verifier_args+=(
                --fd01-accepted-head "$FD01_ACCEPTED_HEAD"
                --fd01-accepted-tree "$FD01_ACCEPTED_TREE"
              )
            fi
            python scripts/verify_foundation_c1_prerequisites_allowlist.py "${verifier_args[@]}"
            delta_base_head="$SLICE_BASE_HEAD"
          fi
          git diff --check "$delta_base_head...HEAD"

      - name: Check package, schema, migrations and Django
        run: |
          python -m compileall -q conflict_analysis domain production_studio
          python -c "import json; from importlib.resources import files; root=files('domain.services').joinpath('schemas'); schemas=sorted((p for p in root.iterdir() if p.name.endswith('.json')), key=lambda p:p.name); assert schemas; [json.loads(p.read_text(encoding='utf-8')) for p in schemas]"
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check

      - name: Locate current Chromium and build isolated wheel
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" --version
          echo "STUDIO_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          wheel_dir="${{ runner.temp }}/foundation-prerequisite-wheel"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          echo "STUDIO_C0_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Run PostgreSQL 18 Foundation suite
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest domain/tests --junitxml="${{ runner.temp }}/postgresql-domain.xml"

      - name: Verify exact PostgreSQL 18 active-slice baseline
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          active_slice=os.environ["ACTIVE_SLICE"]
          expected_total={"FD01":183,"FD05":200,"R0":200,"C1":200}[active_slice]
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-domain.xml")).iter("testcase"))
          skipped=[c for c in cases if c.find("skipped") is not None]
          assert len(cases)==expected_total, f"expected {expected_total} Foundation tests for {active_slice}, got {len(cases)}"
          assert not skipped, f"unexpected PostgreSQL skips: {len(skipped)}"
          print(f"PostgreSQL 18 Foundation {active_slice}: {expected_total} passed, 0 skipped")
          PY

      - name: Run PostgreSQL C0 core and real Chromium zero-write regression
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          production_studio/tests/test_browser_contract.py
          production_studio/tests/test_claim_boundaries.py
          production_studio/tests/test_read_only_http.py
          production_studio/tests/test_read_only_static_contracts.py
          --junitxml="${{ runner.temp }}/postgresql-c0.xml"

      - name: Verify PostgreSQL C0 remains 19/19
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-c0.xml")).iter("testcase"))
          skipped=[c for c in cases if c.find("skipped") is not None]
          assert len(cases)==19, f"expected 19 C0 tests, got {len(cases)}"
          assert not skipped
          print("PostgreSQL C0 regression: 19 passed, 0 skipped")
          PY

      - name: Run PostgreSQL C1 portable authenticated-draft contract
        if: ${{ env.ACTIVE_SLICE == 'C1' }}
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          python -m pytest
          production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringContractTests
          --junitxml="${{ runner.temp }}/postgresql-c1-portable.xml"

      - name: Verify PostgreSQL C1 portable topology is exactly 8/8
        if: ${{ env.ACTIVE_SLICE == 'C1' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-c1-portable.xml")).iter("testcase"))
          skipped=[c for c in cases if c.find("skipped") is not None]
          assert len(cases)==8, f"expected 8 portable C1 tests, got {len(cases)}"
          assert not skipped, f"unexpected portable C1 skips: {len(skipped)}"
          expected={
            "test_authoring_claim_contract_is_exact_immutable_and_persistent",
            "test_draft_routes_require_preissued_session_and_render_no_credentials",
            "test_shell_bootstrap_and_exact_open_use_only_foundation_gateways",
            "test_bootstrap_envelope_csrf_raw_ingress_and_scope_are_fail_closed",
            "test_save_uses_strong_etag_receipt_and_typed_stale_conflict",
            "test_validation_preview_is_canonical_non_mutating_and_exact_help_is_foundation_owned",
            "test_authoring_static_contract_is_bounded_and_disables_unavailable_controls",
            "test_browser_storage_contract_allows_only_bounded_layout_not_draft_state",
          }
          assert {c.attrib["name"] for c in cases}==expected
          print("PostgreSQL C1 portable: exact 8 passed, 0 skipped")
          PY

      - name: Run and verify real Chromium C1 authenticated edit-save-reload
        if: ${{ env.ACTIVE_SLICE == 'C1' }}
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python -m pytest \
            production_studio/tests/test_audited_authoring.py::ProductionStudioAuditedAuthoringBrowserTests::test_authenticated_edit_save_reload_is_bounded_foundation_only_and_receipted \
            --junitxml="${{ runner.temp }}/postgresql-c1-browser.xml"
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-c1-browser.xml")).iter("testcase"))
          assert len(cases)==1
          assert cases[0].attrib["name"]=="test_authenticated_edit_save_reload_is_bounded_foundation_only_and_receipted"
          assert cases[0].find("skipped") is None
          c0=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-c0.xml")).iter("testcase"))
          portable=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-c1-portable.xml")).iter("testcase"))
          assert (len(c0),len(portable),len(cases))==(19,8,1)
