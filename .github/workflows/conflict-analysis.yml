              "+refs/heads/${C1_BRANCH}:refs/remotes/origin/c1-accepted" \
              +refs/pull/74/merge:refs/remotes/origin/pr74-merge
            test "$(git rev-parse refs/remotes/origin/c1-accepted)" = "$FD02_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/c1-accepted^{tree})" = "$FD02_BASE_TREE"
            IFS=$'\t' read -r state74 draft74 merged74 head74 headref74 base74 baseref74 <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/74" \
