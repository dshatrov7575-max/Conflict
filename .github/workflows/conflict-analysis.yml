            test "$state72" = open
            test "$draft72" = true
            test "$merged72" = false
            test "$head72" = "$FD05_ACCEPTED_HEAD"
            test "$headref72" = "$FD05_BRANCH"
            test "$base72" = "$FD01_ACCEPTED_HEAD"
            test "$baseref72" = "$FD01_BRANCH"
            test "$(git rev-parse refs/remotes/origin/pr72-merge^1)" = "$FD01_ACCEPTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr72-merge^2)" = "$FD05_ACCEPTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr72-merge^{tree})" = "$FD05_ACCEPTED_TREE"
