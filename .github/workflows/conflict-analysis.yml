name: Conflict Analysis Foundation and Studio Owner Test

on:
  pull_request:
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"
  push:
    branches:
      - main
      - codex/ca-i1-data-001
      - codex/ca-suite-i1-foundation
      - codex/ca-suite-i1-studio-showcase
    paths:
      - "software/conflict_analysis/**"
      - ".github/workflows/conflict-analysis.yml"

permissions:
  contents: read

concurrency:
  group: conflict-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-contract:
    name: Python 3.12 / PostgreSQL 18 / SQLite / Studio browser
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: software/conflict_analysis

    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-studio-secret-key-00000000000000000000
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,[::1]
      DJANGO_DEBUG: "false"
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_CONN_MAX_AGE: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out exact pushed delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout and accepted ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse f940a91a92658285063802ee1a43bf84360fc013^{tree})" = "1125b01a90da3ea324e661d729a845c58febb8e2"
          git merge-base --is-ancestor f940a91a92658285063802ee1a43bf84360fc013 HEAD
          if [[ "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" == "codex/ca-suite-i1-studio-showcase" ]]; then
            test "$(git rev-parse eaee9227c5c43ea18ef3c3ea7a2b9d70fb5910bf^{tree})" = "f0a4d67585fc599102acf448df649bd5d70d8356"
            git merge-base --is-ancestor eaee9227c5c43ea18ef3c3ea7a2b9d70fb5910bf HEAD
          fi

      - name: Verify Studio delta allowlist and whitespace
        if: github.event.pull_request.head.ref == 'codex/ca-suite-i1-studio-showcase' || github.ref == 'refs/heads/codex/ca-suite-i1-studio-showcase'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          invalid=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/conflict-analysis.yml|\
              software/conflict_analysis/studio_showcase/*|\
              software/conflict_analysis/shared_ui/*|\
              software/conflict_analysis/conflict_analysis/studio_showcase_urls.py|\
              software/conflict_analysis/conflict_analysis/studio_showcase_settings.py|\
              software/conflict_analysis/domain/tests/test_studio_showcase_*.py|\
              software/conflict_analysis/docs/adr/ADR_STUDIO_SHOWCASE_*.md|\
              software/conflict_analysis/scripts/run_studio_showcase.ps1|\
              software/conflict_analysis/pyproject.toml|\
              software/conflict_analysis/README.md)
                ;;
              *)
                echo "::error file=$path::Path is outside the Studio allowlist"
                invalid=1
                ;;
            esac
          done < <(git diff --name-only eaee9227c5c43ea18ef3c3ea7a2b9d70fb5910bf HEAD)
          test "$invalid" -eq 0
          git diff --check eaee9227c5c43ea18ef3c3ea7a2b9d70fb5910bf HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Enforce offline product execution after dependency install
        shell: bash
        run: |
          echo "HTTP_PROXY=http://127.0.0.1:9" >> "$GITHUB_ENV"
          echo "HTTPS_PROXY=http://127.0.0.1:9" >> "$GITHUB_ENV"
          echo "ALL_PROXY=http://127.0.0.1:9" >> "$GITHUB_ENV"
          echo "NO_PROXY=127.0.0.1,localhost" >> "$GITHUB_ENV"

      - name: Check package and bundled schema integrity
        run: |
          python -m compileall -q conflict_analysis domain studio_showcase shared_ui
          python -c "import json; from importlib.resources import files; root = files('domain.services').joinpath('schemas'); schemas = sorted((p for p in root.iterdir() if p.name.endswith('.json')), key=lambda p: p.name); assert schemas, 'no packaged JSON schemas'; [json.loads(p.read_text(encoding='utf-8')) for p in schemas]; print('validated schemas:', ', '.join(p.name for p in schemas))"

      - name: Reject migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply all migrations to clean PostgreSQL 18
        run: python manage.py migrate --noinput

      - name: Run Django checks
        run: |
          python manage.py check
          python manage.py check --settings conflict_analysis.studio_showcase_settings

      - name: Run focused Studio contracts and shared parity corpus
        env:
          DJANGO_SETTINGS_MODULE: conflict_analysis.studio_showcase_settings
          USE_SQLITE: "true"
        run: python -m pytest domain/tests/test_studio_showcase_*.py -q

      - name: Check Node browser harness syntax
        run: |
          node --check studio_showcase/browser_tests/cdp_client.mjs
          node --check studio_showcase/browser_tests/phase1_import_export.mjs
          node --check studio_showcase/browser_tests/phase3_dom_safety.mjs

      - name: Run real Chrome import/export and DOM safety matrix
        shell: bash
        env:
          DJANGO_SETTINGS_MODULE: conflict_analysis.studio_showcase_settings
          USE_SQLITE: "true"
        run: |
          set -euo pipefail
          server_log="$RUNNER_TEMP/studio-showcase-server.log"
          python manage.py runserver 127.0.0.1:8794 --settings conflict_analysis.studio_showcase_settings --noreload --insecure >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..100}; do
            if curl --fail --silent http://127.0.0.1:8794/health/ >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$server_log"
              exit 1
            fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8794/health/
          node studio_showcase/browser_tests/phase1_import_export.mjs --base-url http://127.0.0.1:8794/
          node studio_showcase/browser_tests/phase3_dom_safety.mjs --base-url http://127.0.0.1:8794/
          cleanup
          trap - EXIT
          if curl --fail --silent --max-time 1 http://127.0.0.1:8794/health/ >/dev/null 2>&1; then
            echo "::error::Studio server remained reachable after browser gates"
            exit 1
          fi

      - name: Scan forbidden scope, claims, ORM and public legacy terminology
        run: |
          python -m pytest domain/tests/test_v4_foundation_contracts.py::PublicContractStaticTests -q
          python -m pytest domain/tests/test_studio_showcase_static_contracts.py::ShowcasePresentationContractTests::test_visible_copy_has_no_positive_production_or_prediction_claim domain/tests/test_studio_showcase_static_contracts.py::ShowcaseArchitectureBoundaryTests::test_showcase_and_shared_ui_have_no_models_or_migrations domain/tests/test_studio_showcase_static_contracts.py::ShowcaseArchitectureBoundaryTests::test_showcase_python_does_not_import_or_call_the_orm -q

      - name: Run PostgreSQL 18 Foundation and Studio regression suite
        run: python -m pytest domain/tests -q

      - name: Run SQLite Foundation and Studio regression suite
        env:
          USE_SQLITE: "true"
          SQLITE_PATH: ${{ runner.temp }}/conflict-analysis.sqlite3
        run: python -m pytest domain/tests -q -ra

      - name: Build and inspect runtime wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/wheel"
          mkdir -p "$wheel_dir"
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$wheel_dir"
          python -c "import glob, zipfile; wheel=glob.glob(r'$RUNNER_TEMP/wheel/*.whl'); assert len(wheel)==1, wheel; names=set(zipfile.ZipFile(wheel[0]).namelist()); required={'studio_showcase/session.py','studio_showcase/views.py','studio_showcase/templates/studio_showcase/index.html','studio_showcase/static/studio_showcase/studio.css','studio_showcase/static/studio_showcase/studio.js','shared_ui/static/shared_ui/tokens.css'}; missing=sorted(required-names); assert not missing, missing; print('wheel entries', len(names))"

      - name: Final worktree and diff check
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

  owner-test-windows:
    name: Windows exact-HEAD OWNER ZIP / clean room
    if: github.event.pull_request.head.ref == 'codex/ca-suite-i1-studio-showcase' || github.ref == 'refs/heads/codex/ca-suite-i1-studio-showcase'
    runs-on: windows-latest
    timeout-minutes: 40
    needs: foundation-contract

    defaults:
      run:
        working-directory: software/conflict_analysis

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DJANGO_SECRET_KEY: ci-only-ephemeral-studio-secret-key-00000000000000000000
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,[::1]
      DJANGO_DEBUG: "false"

    steps:
      - name: Check out exact pushed delivery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout and tree
        shell: pwsh
        working-directory: .
        run: |
          $ExpectedHead = '${{ github.event.pull_request.head.sha || github.sha }}'
          $ActualHead = (git rev-parse HEAD).Trim()
          if ($ActualHead -cne $ExpectedHead) {
            throw "Checkout HEAD $ActualHead does not match delivery HEAD $ExpectedHead."
          }
          $Tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($Tree -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid delivery tree: $Tree"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            software/conflict_analysis/pyproject.toml
            software/conflict_analysis/studio_showcase/owner_test/templates/requirements-owner-test.txt

      - name: Install exact OWNER-TEST and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r studio_showcase/owner_test/templates/requirements-owner-test.txt
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check

      - name: Run Windows launcher, lifecycle and package contracts
        run: python -m pytest domain/tests/test_studio_showcase_owner_launcher.py domain/tests/test_studio_showcase_owner_lifecycle.py domain/tests/test_studio_showcase_owner_package.py -q

      - name: Build twice, verify reproducibility and run clean room
        id: owner_package
        shell: pwsh
        run: |
          $Head = (git rev-parse HEAD).Trim()
          $Tree = (git rev-parse 'HEAD^{tree}').Trim()
          $First = Join-Path $env:RUNNER_TEMP 'owner-test-first'
          $Second = Join-Path $env:RUNNER_TEMP 'owner-test-second'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\studio_showcase\owner_test\build_owner_test_package.ps1 -Head $Head -Tree $Tree -OutputDirectory $First
          powershell -NoProfile -ExecutionPolicy Bypass -File .\studio_showcase\owner_test\build_owner_test_package.ps1 -Head $Head -Tree $Tree -OutputDirectory $Second
          $FirstZips = @(Get-ChildItem -LiteralPath $First -Filter '*.zip' -File -ErrorAction Stop)
          $SecondZips = @(Get-ChildItem -LiteralPath $Second -Filter '*.zip' -File -ErrorAction Stop)
          if ($FirstZips.Count -ne 1 -or $SecondZips.Count -ne 1) {
            throw "Expected exactly one ZIP in each reproducibility directory."
          }
          $FirstZip = $FirstZips[0]
          $SecondZip = $SecondZips[0]
          $FirstHash = (Get-FileHash -LiteralPath $FirstZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $SecondHash = (Get-FileHash -LiteralPath $SecondZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($FirstHash -cne $SecondHash) {
            throw "OWNER-TEST ZIP is not reproducible: $FirstHash != $SecondHash"
          }
          $HashRecord = "$($FirstZip.FullName).sha256"
          $EvidencePath = Join-Path $First 'clean-room-evidence.json'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\studio_showcase\owner_test\run_clean_room_gate.ps1 -ZipPath $FirstZip.FullName -Sha256RecordPath $HashRecord -Head $Head -Tree $Tree -PythonCommand (Get-Command python).Source -EvidencePath $EvidencePath
          if ($LASTEXITCODE -ne 0) {
            throw "Clean-room gate exited with code $LASTEXITCODE."
          }
          $Evidence = Get-Content -LiteralPath $EvidencePath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($Evidence.status -cne 'PASS' -or -not $Evidence.stop_no_orphan -or $Evidence.cleanup -cne 'PASS') {
            throw "Clean-room evidence is not PASS: $($Evidence | ConvertTo-Json -Depth 5 -Compress)"
          }
          "artifact_dir=$First" >> $env:GITHUB_OUTPUT
          "zip_sha256=$FirstHash" >> $env:GITHUB_OUTPUT
          "manifest_sha256=$($Evidence.manifest_sha256)" >> $env:GITHUB_OUTPUT
          "head=$Head" >> $env:GITHUB_OUTPUT
          "tree=$Tree" >> $env:GITHUB_OUTPUT

      - name: Upload exact-HEAD OWNER-TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConflictAnalysis-Studio-OWNER-TEST-${{ steps.owner_package.outputs.head }}
          path: ${{ steps.owner_package.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14
