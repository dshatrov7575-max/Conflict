          if [[ "$ACTIVE_SLICE" = FD07 ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${FD06_BRANCH}:refs/remotes/origin/fd06-accepted" \
              +refs/pull/77/merge:refs/remotes/origin/pr77-merge
            test "$(git rev-parse refs/remotes/origin/fd06-accepted)" = "$FD07_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/fd06-accepted^{tree})" = "$FD07_BASE_TREE"
            IFS=$'\t' read -r state77 draft77 merged77 head77 headref77 base77 baseref77 <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/77" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .base.sha, .base.ref] | @tsv'
            )"
            test "$state77" = open
            test "$draft77" = true
            test "$merged77" = false
            test "$head77" = "$FD07_BASE_HEAD"
            test "$headref77" = "$FD06_BRANCH"
            test "$base77" = "$FD06_BASE_HEAD"
            test "$baseref77" = "$FD03_BRANCH"
            test "$(git rev-parse refs/remotes/origin/pr77-merge^1)" = "$FD06_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr77-merge^2)" = "$FD07_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr77-merge^{tree})" = "$FD07_BASE_TREE"
            echo "FD07_ACCEPTED_FD06_REF_AND_PR77=PASS"
          fi

          IFS=$'\t' read -r state67 draft67 merged67 head67 base67 mergeable67 <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/67" \
              --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .base.sha, (.mergeable|tostring)] | @tsv'
          )"
          test "$state67" = open
          test "$draft67" = true
          test "$merged67" = false
          test "$head67" = "$FOUNDATION_B_HEAD"
          test "$base67" = "$PR67_BASE_HEAD"
          test "$mergeable67" = true
          test "$(git rev-parse refs/remotes/origin/pr67-merge^1)" = "$PR67_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr67-merge^2)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr67-merge^{tree})" = "$FOUNDATION_B_TREE"

          IFS=$'\t' read -r state69 draft69 merged69 head69 base69 mergeable69 <<< "$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/69" \
              --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .base.sha, (.mergeable|tostring)] | @tsv'
          )"
          test "$state69" = open
          test "$draft69" = true
          test "$merged69" = false
          test "$head69" = "$FD01_BASE_HEAD"
          test "$base69" = "$FOUNDATION_B_HEAD"
          test "$mergeable69" = true
          test "$(git rev-parse refs/remotes/origin/pr69-merge^1)" = "$FOUNDATION_B_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr69-merge^2)" = "$FD01_BASE_HEAD"
          test "$(git rev-parse refs/remotes/origin/pr69-merge^{tree})" = "$FD01_BASE_TREE"

          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            if [[ "$ACTIVE_SLICE" = FD01 ]]; then
              test "$SLICE_PR_NUMBER" = "71"
            fi

            IFS=$'\t' read -r state_slice draft_slice merged_slice head_slice headref_slice headrepo_slice base_slice baseref_slice <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${SLICE_PR_NUMBER}" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .head.repo.full_name, .base.sha, .base.ref] | @tsv'
            )"
            test "$state_slice" = open
            test "$draft_slice" = true
            test "$merged_slice" = false
            test "$head_slice" = "$delivery_head"
            test "$headref_slice" = "$SLICE_HEAD_REF"
            test "$headrepo_slice" = "$GITHUB_REPOSITORY"
            test "$base_slice" = "$SLICE_BASE_HEAD"
            test "$baseref_slice" = "$SLICE_BASE_REF"

            git fetch --no-tags origin \
              "+refs/pull/${SLICE_PR_NUMBER}/merge:refs/remotes/origin/active-slice-merge"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^1)" = "$SLICE_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^2)" = "$delivery_head"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^{tree})" = "$(git rev-parse "$delivery_head^{tree}")"
            test "$(git rev-parse refs/remotes/origin/active-slice-merge^{tree})" = "$(git merge-tree --write-tree "$SLICE_BASE_HEAD" "$delivery_head")"
            if [[ "$ACTIVE_SLICE" = FD06 ]]; then
              echo "FD06_SYNTHETIC_PARENTS_AND_TREE=PASS"
            elif [[ "$ACTIVE_SLICE" = FD07 ]]; then
              echo "FD07_SYNTHETIC_PARENTS_AND_TREE=PASS"
            fi
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/conflict_analysis/pyproject.toml

      - name: Run offline deterministic verifier contract self-checks
        run: |
          python scripts/verify_foundation_c1_prerequisites_allowlist.py --self-check-contracts
          python scripts/verify_production_studio_c_allowlist.py --self-check

      - name: Set up Node.js 24 for Chromium harness
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install application and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip check
          node --check production_studio/static/production_studio/studio.js
          node --check production_studio/browser_tests/cdp_client.mjs
          node --check production_studio/browser_tests/read_only_smoke.mjs
          if [[ "$ACTIVE_SLICE" = C1 || "$ACTIVE_SLICE" = FD02 || "$ACTIVE_SLICE" = FD03 || "$ACTIVE_SLICE" = FD06 || "$ACTIVE_SLICE" = FD07 ]]; then
            node --check production_studio/static/production_studio/audited_draft.js
            node --check production_studio/browser_tests/audited_authoring.mjs
          fi

      - name: Verify exact active-slice allowlist and frozen accepted surfaces
        run: |
          if [[ "$ACTIVE_SLICE" = R0 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice R0 \
              --base-head "$SLICE_BASE_HEAD" \
              --base-tree "$SLICE_BASE_TREE" \
              --fd05-accepted-head "$FD05_ACCEPTED_HEAD" \
              --fd05-accepted-tree "$FD05_ACCEPTED_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$SLICE_BASE_HEAD"
          elif [[ "$ACTIVE_SLICE" = C1 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice C1 \
              --base-head "$C1_R0_START_HEAD" \
              --base-tree "$C1_R0_START_TREE" \
              --fd05-accepted-head "$FD05_ACCEPTED_HEAD" \
              --fd05-accepted-tree "$FD05_ACCEPTED_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$C1_R0_START_HEAD"
          elif [[ "$ACTIVE_SLICE" = FD02 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice FD02 \
              --base-head "$SLICE_BASE_HEAD" \
              --base-tree "$SLICE_BASE_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$SLICE_BASE_HEAD"
          elif [[ "$ACTIVE_SLICE" = FD03 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice FD03 \
              --base-head "$SLICE_BASE_HEAD" \
              --base-tree "$SLICE_BASE_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$SLICE_BASE_HEAD"
          elif [[ "$ACTIVE_SLICE" = FD06 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice FD06 \
              --base-head "$SLICE_BASE_HEAD" \
              --base-tree "$SLICE_BASE_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$SLICE_BASE_HEAD"
          elif [[ "$ACTIVE_SLICE" = FD07 ]]; then
            python scripts/verify_production_studio_c_allowlist.py \
              --slice FD07 \
              --base-head "$SLICE_BASE_HEAD" \
              --base-tree "$SLICE_BASE_TREE" \
              --repo "$GITHUB_WORKSPACE"
            delta_base_head="$SLICE_BASE_HEAD"
          else
            verifier_args=(
              --slice "$ACTIVE_SLICE"
              --base-head "$SLICE_BASE_HEAD"
              --base-tree "$SLICE_BASE_TREE"
            )
            if [[ "$ACTIVE_SLICE" = FD05 ]]; then
              verifier_args+=(
                --fd01-accepted-head "$FD01_ACCEPTED_HEAD"
                --fd01-accepted-tree "$FD01_ACCEPTED_TREE"
              )
            fi
            python scripts/verify_foundation_c1_prerequisites_allowlist.py "${verifier_args[@]}"
            delta_base_head="$SLICE_BASE_HEAD"
          fi
          git diff --check "$delta_base_head...HEAD"

      - name: Check package, schema, migrations and Django
        run: |
          python -m compileall -q conflict_analysis domain production_studio
          python -c "import json; from importlib.resources import files; root=files('domain.services').joinpath('schemas'); schemas=sorted((p for p in root.iterdir() if p.name.endswith('.json')), key=lambda p:p.name); assert schemas; [json.loads(p.read_text(encoding='utf-8')) for p in schemas]"
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py check

      - name: Locate current Chromium and build isolated wheel
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          "$chrome" --version
          echo "STUDIO_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          wheel_dir="${{ runner.temp }}/foundation-prerequisite-wheel"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name '*.whl' -print)
          test "${#wheels[@]}" -eq 1
          echo "STUDIO_C0_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Run PostgreSQL 18 Foundation suite
        env:
          HTTP_PROXY: "http://127.0.0.1:9"
          HTTPS_PROXY: "http://127.0.0.1:9"
          ALL_PROXY: "http://127.0.0.1:9"
          NO_PROXY: "127.0.0.1,localhost"
          OPENAI_API_KEY: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest domain/tests --junitxml="${{ runner.temp }}/postgresql-domain.xml"

      - name: Verify exact PostgreSQL 18 active-slice baseline
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          active_slice=os.environ["ACTIVE_SLICE"]
          expected_total={"FD01":183,"FD05":200,"R0":200,"C1":200,"FD02":206,"FD03":212,"FD06":227,"FD07":236}[active_slice]
          cases=list(ElementTree.parse(Path("${{ runner.temp }}/postgresql-domain.xml")).iter("testcase"))
          skipped=[c for c in cases if c.find("skipped") is not None]
          assert len(cases)==expected_total, f"expected {expected_total} Foundation tests for {active_slice}, got {len(cases)}"
          assert not skipped, f"unexpected PostgreSQL skips: {len(skipped)}"
          if active_slice in {"FD02","FD03","FD06","FD07"}:
            expected_fd02={
              "test_catalog_identity_bytes_schema_and_checksum_are_exact",
              "test_first_provision_and_exact_repeat_are_idempotent",
              "test_management_command_requires_explicit_catalog_and_reports_exact_counts",
              "test_topic_identity_or_content_collision_is_atomic",
              "test_binding_identity_collision_and_injected_failure_roll_back",
              "test_exact_resolver_and_http_return_bytes_or_exact_404",
            }
            fd02=[c for c in cases if c.attrib["classname"]=="domain.tests.test_foundation_studio_help_provisioning.FoundationStudioHelpProvisioningTests"]
            assert len(fd02)==6, f"expected exact 6 FD02 tests, got {len(fd02)}"
            assert {c.attrib["name"] for c in fd02}==expected_fd02
            print("PostgreSQL 18 FD02 focused topology: exact 6 passed, 0 skipped")
          if active_slice in {"FD03","FD06","FD07"}:
            expected_fd03={
              "test_fd03_open_definition_returns_exact_persisted_lifecycle_values",
              "test_fd03_open_definition_distinguishes_current_successor_and_published_predecessor",
              "test_fd03_initial_publication_result_recovers_exact_workspace_pin",
              "test_fd03_successor_publication_result_has_exact_null_workspace_fields",
              "test_fd03_publication_result_scope_identity_and_get_only_boundary_are_indistinguishable",
              "test_fd03_reads_are_repeat_stable_and_non_mutating",
            }
            fd03=[c for c in cases if c.attrib["classname"]=="domain.tests.test_foundation_studio_http.FoundationStudioLifecycleReadResultHttpTests"]
            assert len(fd03)==6, f"expected exact 6 FD03 tests, got {len(fd03)}"
            assert {c.attrib["name"] for c in fd03}==expected_fd03
            print("PostgreSQL 18 FD03 focused topology: exact 6 passed, 0 skipped")
          if active_slice in {"FD06","FD07"}:
            expected_portable={
              "test_initial_and_successor_require_exact_key_if_match_envelope_and_prebody_method_gate",
              "test_initial_fresh_result_persists_hash_bound_project_operation_and_exact_receipt",
              "test_successor_fresh_result_preserves_predecessor_and_exact_receipt",
              "test_same_key_same_request_replays_before_lifecycle_rejection_and_after_workspace_or_lifecycle_change",
              "test_same_uuid_key_is_independent_across_projects_and_foreign_operation_is_hidden",
              "test_same_key_different_request_actor_or_target_is_typed_conflict",
              "test_response_loss_recovers_immutable_receipt_and_fd03_current_state_remains_separate",
              "test_already_published_stale_noncurrent_and_cross_scope_failures_are_typed",
              "test_every_initial_failure_stage_rolls_back_definition_workspace_help_publication_and_audits",
              "test_every_successor_failure_stage_rolls_back_currentness_publication_and_audits",
              "test_auth_csrf_basic_cookie_and_nonpost_paths_are_bounded_and_write_free_before_admission",
            }
            expected_concurrent={
              "test_concurrent_initial_same_key_has_one_fresh_and_one_replay",
              "test_concurrent_initial_different_keys_has_one_commit_and_one_typed_loser",
              "test_concurrent_successor_same_key_has_one_fresh_and_one_replay",
              "test_concurrent_successor_different_keys_has_one_current_winner_and_one_typed_loser",
            }
            portable=[c for c in cases if c.attrib["classname"]=="domain.tests.test_foundation_studio_publication_reconciliation.FoundationStudioPublicationReconciliationTests"]
            concurrent=[c for c in cases if c.attrib["classname"]=="domain.tests.test_foundation_studio_publication_reconciliation.FoundationStudioPublicationReconciliationConcurrencyTests"]
            assert len(portable)==11 and len(concurrent)==4
            assert {c.attrib["name"] for c in portable}==expected_portable
            assert {c.attrib["name"] for c in concurrent}==expected_concurrent
            assert all(c.find("skipped") is None for c in portable+concurrent)
            print("PostgreSQL 18 FD06: exact 11 portable + 4 concurrency passed")
          if active_slice=="FD07":
            expected_fd07={
              "test_route_method_auth_scope_query_headers_and_zero_write_are_exact",
              "test_first_project_draft_is_initial_candidate_snapshot_only",
              "test_standalone_draft_in_published_project_is_never_initial_candidate",
              "test_exact_successor_draft_requires_validate_and_validated_requires_publish",
              "test_wrong_predecessor_missing_current_and_initial_receipt_integrity_fail_closed",
              "test_published_retired_and_validated_initial_states_have_no_publication_action",
              "test_response_is_canonical_hash_bound_no_store_and_deterministic",
              "test_old_hash_basic_absent_and_cross_scope_are_password_cookie_write_free",
              "test_readiness_is_advisory_and_fd06_rechecks_after_persisted_state_changes",
            }
            fd07=[c for c in cases if c.attrib["classname"]=="domain.tests.test_foundation_studio_publication_readiness.FoundationStudioPublicationReadinessTests"]
