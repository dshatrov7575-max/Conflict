            )"
            test "$state74" = open
            test "$draft74" = true
            test "$merged74" = false
            test "$head74" = "$FD02_BASE_HEAD"
            test "$headref74" = "$C1_BRANCH"
            test "$base74" = "$FD05_ACCEPTED_HEAD"
            test "$baseref74" = "$FD05_BRANCH"
            test "$(git rev-parse refs/remotes/origin/pr74-merge^1)" = "$FD05_ACCEPTED_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr74-merge^2)" = "$FD02_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr74-merge^{tree})" = "$FD02_BASE_TREE"
            echo "FD02_ACCEPTED_C1_REF_AND_PR74=PASS"
          fi

          if [[ "$ACTIVE_SLICE" = FD03 || "$ACTIVE_SLICE" = FD06 || "$ACTIVE_SLICE" = FD07 ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${FD02_BRANCH}:refs/remotes/origin/fd02-accepted" \
              +refs/pull/75/merge:refs/remotes/origin/pr75-merge
            test "$(git rev-parse refs/remotes/origin/fd02-accepted)" = "$FD03_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/fd02-accepted^{tree})" = "$FD03_BASE_TREE"
            IFS=$'\t' read -r state75 draft75 merged75 head75 headref75 base75 baseref75 <<< "$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/75" \
                --jq '[.state, (.draft|tostring), (.merged|tostring), .head.sha, .head.ref, .base.sha, .base.ref] | @tsv'
            )"
            test "$state75" = open
            test "$draft75" = true
            test "$merged75" = false
            test "$head75" = "$FD03_BASE_HEAD"
            test "$headref75" = "$FD02_BRANCH"
            test "$base75" = "$FD02_BASE_HEAD"
            test "$baseref75" = "$C1_BRANCH"
            test "$(git rev-parse refs/remotes/origin/pr75-merge^1)" = "$FD02_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr75-merge^2)" = "$FD03_BASE_HEAD"
            test "$(git rev-parse refs/remotes/origin/pr75-merge^{tree})" = "$FD03_BASE_TREE"
            echo "FD03_ACCEPTED_FD02_REF_AND_PR75=PASS"
