name: AI-only primary executor R2

on:
  push:
    branches:
      - review/ai-only-research-beta-v1
    paths:
      - ".github/ai-only-primary-executor-trigger-r2.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-gate:
    name: Require Copilot CLI credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Require non-empty COPILOT_GITHUB_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COPILOT_GITHUB_TOKEN"
          echo "COPILOT_GITHUB_TOKEN_PRESENT=true"
          echo "Credential value is not printed."

  primary:
    name: ${{ matrix.role }} / ${{ matrix.model }}
    needs: credential-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: KBM_COMPANY_E02_V100_AI1
            model: gpt-6-astra
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e02_v1_0_0/06_AI1_STANDALONE_RU.md
            prompt_blob_sha: 4d894bf841912788ec534904c05f53a3076bee3b
            output_file: KBM_E02_V100_AI1_COMPLETED.json
          - role: KBM_COMPANY_E02_V100_AI2
            model: claude-opus-5.5
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e02_v1_0_0/07_AI2_STANDALONE_RU.md
            prompt_blob_sha: 64d02513711034941da014bd40024e506a68b020
            output_file: KBM_E02_V100_AI2_COMPLETED.json
          - role: OMG_NOV24_V100_AI1
            model: gpt-6-astra
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/omg_e02_nov24_v1_0_0/06_AI1_STANDALONE_RU.md
            prompt_blob_sha: 83473066a90daf00bc2a9413cb0175d25f54b60a
            output_file: OMG_NOV24_V100_AI1_COMPLETED.json
          - role: OMG_NOV24_V100_AI2
            model: claude-opus-5.5
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/omg_e02_nov24_v1_0_0/07_AI2_STANDALONE_RU.md
            prompt_blob_sha: b8a18c8a553e1e6f1efee2bfbe4d348619795d59
            output_file: OMG_NOV24_V100_AI2_COMPLETED.json
          - role: KBM_E05_V100_AI1
            model: gpt-6-astra
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e05_v1_0_0/06_AI1_STANDALONE_RU.md
            prompt_blob_sha: bd1d89ac5b0aa046e8d4498cb3b19031dd2c60af
            output_file: KBM_E05_V100_AI1_COMPLETED.json
          - role: KBM_E05_V100_AI2
            model: claude-opus-5.5
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e05_v1_0_0/07_AI2_STANDALONE_RU.md
            prompt_blob_sha: 0a39088aaa78bbf3c1a5e7300e1f3fe23e25438c
            output_file: KBM_E05_V100_AI2_COMPLETED.json
          - role: D25_E02_V100_AI1
            model: gpt-6-astra
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/d25_e02_v1_0_0/06_AI1_STANDALONE_RU.md
            prompt_blob_sha: 2b0dcd8ee954f68d74b11b8bcbf299dfb9e2da33
            output_file: D25_E02_V100_AI1_COMPLETED.json
          - role: D25_E02_V100_AI2
            model: claude-opus-5.5
            prompt_path: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/d25_e02_v1_0_0/07_AI2_STANDALONE_RU.md
            prompt_blob_sha: 2911bd6975184b9d9f1faf2aa235d6322eae7152
            output_file: D25_E02_V100_AI2_COMPLETED.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_HOME: ${{ runner.temp }}/copilot-home-${{ matrix.role }}
      COPILOT_VERSION: "1.0.89"
      COPILOT_LINUX_X64_SHA256: c5c234ccba6fae2b7a9eae462caf628e86c21b5e6240ec2e885727fc148a1dcc
      PROMPT_PATH: ${{ matrix.prompt_path }}
      PROMPT_BLOB_SHA: ${{ matrix.prompt_blob_sha }}
      OUTPUT_FILE: ${{ matrix.output_file }}
      MODEL_ID: ${{ matrix.model }}
      ROLE_ID: ${{ matrix.role }}
    steps:
      - name: Check out exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact frozen standalone identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROMPT_PATH"
          actual_blob="$(git hash-object "$PROMPT_PATH")"
          test "$actual_blob" = "$PROMPT_BLOB_SHA"
          mkdir -p "$RUNNER_TEMP/frozen-prompt"
          cp -- "$PROMPT_PATH" "$RUNNER_TEMP/frozen-prompt/prompt.md"
          cmp -- "$PROMPT_PATH" "$RUNNER_TEMP/frozen-prompt/prompt.md"
          printf '%s\n' "$actual_blob" > "$RUNNER_TEMP/frozen-prompt/PROMPT_GIT_BLOB_SHA.txt"

      - name: Install pinned Copilot CLI binary
        shell: bash
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/copilot-linux-x64.tar.gz"
          url="https://github.com/github/copilot-cli/releases/download/v$COPILOT_VERSION/copilot-linux-x64.tar.gz"
          curl --fail --location --silent --show-error "$url" --output "$asset"
          echo "$COPILOT_LINUX_X64_SHA256  $asset" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/copilot-bin"
          tar -xzf "$asset" -C "$RUNNER_TEMP/copilot-bin"
          copilot_bin="$(find "$RUNNER_TEMP/copilot-bin" -type f -name copilot -perm -u+x -print -quit)"
          test -n "$copilot_bin"
          echo "COPILOT_BIN=$copilot_bin" >> "$GITHUB_ENV"

      - name: Prepare isolated model working directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$COPILOT_HOME"
          mkdir -p "$COPILOT_HOME"
          mkdir -p "$RUNNER_TEMP/model-workdir"
          test -z "$(find "$RUNNER_TEMP/model-workdir" -mindepth 1 -maxdepth 1 -print -quit)"

      - name: Run exactly one blind primary invocation
        shell: bash
        working-directory: ${{ runner.temp }}/model-workdir
        run: |
          set -euo pipefail
          prompt="$(cat "$RUNNER_TEMP/frozen-prompt/prompt.md")"
          "$COPILOT_BIN"             -p "$prompt"             -s             --model="$MODEL_ID"             --no-ask-user             --available-tools='view'             --disable-builtin-mcps             > "$RUNNER_TEMP/$OUTPUT_FILE"
          test -s "$RUNNER_TEMP/$OUTPUT_FILE"

      - name: Record immutable execution receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/EXECUTION_RECEIPT.json" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          p.write_text(json.dumps({
            "schema":"COPILOT_CLI_PRIMARY_EXECUTION_RECEIPT_R2",
            "role_id":os.environ["ROLE_ID"],
            "model_id":os.environ["MODEL_ID"],
            "prompt_path":os.environ["PROMPT_PATH"],
            "prompt_git_blob_sha":os.environ["PROMPT_BLOB_SHA"],
            "output_file":os.environ["OUTPUT_FILE"],
            "github_sha":os.environ["GITHUB_SHA"],
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "github_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "copilot_version":os.environ["COPILOT_VERSION"],
            "copilot_asset_sha256":os.environ["COPILOT_LINUX_X64_SHA256"],
            "isolation":{
              "fresh_github_hosted_vm":True,
              "fresh_copilot_home":True,
              "empty_model_workdir":True,
              "available_tools":["view"],
              "builtin_mcps_disabled":True,
              "single_invocation":True
            }
          },indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - name: Upload raw primary output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: primary-${{ matrix.role }}
          path: ${{ runner.temp }}/${{ matrix.output_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload role execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.role }}
          path: ${{ runner.temp }}/EXECUTION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30

  cohort-intake:
    name: Frozen cohort intake and deterministic comparison
    needs: primary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact execution head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download available raw primary artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: primary-*
          path: ${{ runner.temp }}/primary-input
          merge-multiple: true

      - name: Run frozen cohort intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/primary-input" "$RUNNER_TEMP/cohort-derived"
          python docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/cohort_execution_r1/intake_and_compare_r1.py             --repo-root .             --input-dir "$RUNNER_TEMP/primary-input"             --out-dir "$RUNNER_TEMP/cohort-derived"

      - name: Upload deterministic cohort derived artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cohort-derived-r2
          path: ${{ runner.temp }}/cohort-derived
          if-no-files-found: error
          retention-days: 30

      - name: Preserve scientific boundary
        shell: bash
        run: |
          echo "No result is committed or merged automatically."
          echo "No model output is repaired or retried."
          echo "No sensitivity/Core replay runs in this workflow."
          echo "Frozen cohort, weights, claims, and release gates are unchanged."
