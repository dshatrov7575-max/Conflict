name: C2A R2 lifecycle JS durable rebuild

on:
  push:
    branches:
      - agent/c2a-r2-builder
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-lifecycle-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R1: 22f0f173a941de88d6920b6e19821168e9b30cc8
      P1CD: 72e45cdd13f48fc2444840925d06335fb7f267ce
      P1CD_BLOB: 07cd319ffb46f9226590f69f90bac5a83602183d
      CARRIER_BRANCH: agent/c2a-r2-lifecycle-js-p1be-carrier
      TARGET_PATH: software/conflict_analysis/production_studio/static/production_studio/lifecycle_publication.js
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify inputs and regenerate only P1-B P1-E retention behavior
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$R1^{tree}")" = "f407e609adb2a8b94770b521a1302feb79281822"
          test "$(git rev-parse "$P1CD^")" = "$R1"
          test "$(git show "$P1CD:$TARGET_PATH" | git hash-object --stdin)" = "$P1CD_BLOB"
          work="$RUNNER_TEMP/lifecycle_publication.js"
          git show "$P1CD:$TARGET_PATH" > "$work"
          export WORK_FILE="$work"
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["WORK_FILE"])
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          def function_span(name: str) -> tuple[int, int]:
              pattern = re.compile(rf"^  (?:async )?function {re.escape(name)}\(", re.M)
              match = pattern.search(source)
              if not match:
                  raise SystemExit(f"function {name} not found")
              next_match = re.compile(r"^  (?:async )?function [A-Za-z0-9_]+\(", re.M).search(source, match.end())
              end = next_match.start() if next_match else source.index("\n  window.__productionStudioLifecycleContract", match.end())
              return match.start(), end

          def replace_function(name: str, replacement: str) -> None:
              global source
              start, end = function_span(name)
              source = source[:start] + replacement.rstrip() + "\n\n" + source[end:]

          replace_once(
              '  const HUMAN_TICKET_CONTRACT = "FOUNDATION_HUMAN_WRITE_RECOVERY_TICKET_V1";\n',
              '  const HUMAN_TICKET_CONTRACT = "FOUNDATION_HUMAN_WRITE_RECOVERY_TICKET_V1";\n'
              '  const PUBLICATION_TICKET_CONTRACT = "FOUNDATION_PUBLICATION_RECOVERY_TICKET_V1";\n',
              "publication ticket constant",
          )
          replace_once(
              '  const HUMAN_RECEIPT_KEYS = Object.freeze([\n',
