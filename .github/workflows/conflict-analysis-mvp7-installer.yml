        proof_path.write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n',encoding='utf8')
        print('SQLITE_LIFECYCLE_FILE_BACKED_TEST_DATABASE=PASS')
        PY
    - name: Prove exact accepted R1 totals and product identity
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY'
        import json,os,xml.etree.ElementTree as ET
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        expected={'postgresql':(379,0),'sqlite':(351,28),'product-postgresql':(55,0),'product-sqlite':(55,0),'product-chromium':(8,0),'studio-lifecycle-postgresql':(15,0),'studio-lifecycle-sqlite':(15,0)}
        results={}
        for key,(passed,skipped) in expected.items():
            tree=ET.parse(root/('analysis-r0-'+key+'.xml'))
            cases=tree.findall('.//testcase')
            assert not tree.findall('.//failure') and not tree.findall('.//error'),key
            actual_skip=len(tree.findall('.//skipped'))
            assert (len(cases)-actual_skip,actual_skip)==(passed,skipped),(key,len(cases),actual_skip)
            results[key]={'passed':passed,'expected_skips':skipped}
        repro=json.loads((root/'ne-reproducibility.json').read_text())
        assert repro['files']==24 and repro['byte_identical'] is True
        result={'TESTED_SOURCE_COMMIT_C':os.environ['TESTED_SOURCE_COMMIT_C'],'INSTALLER_COMMIT':os.environ['INSTALLER_COMMIT'],'R1_REGRESSIONS':'PASS','tests':results,'natural_earth':repro,'WINDOWS11_WSL2_E2E':'BLOCKED_NO_RUNNER','CLEAN_PC_SMOKE':'NOT_EXECUTED','PARTNER_RELEASE_READY':False}
        (root/'geography-mvp7-r1-regressions.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n',encoding='utf8')
        print(json.dumps(result,sort_keys=True))
        PY
    - name: Upload Geography evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mvp7-r1-source-regressions-${{ github.sha }}
        path: |-
          ${{ runner.temp }}/analysis-r0-*.xml
          ${{ runner.temp }}/geography-*.json
          ${{ runner.temp }}/geography-source-identity.env
          ${{ runner.temp }}/geography-sqlite-lifecycle-*/*.py
          ${{ runner.temp }}/geography-browser/
          ${{ runner.temp }}/ne-*.json
          ${{ runner.temp }}/ne-*.log
        if-no-files-found: error
