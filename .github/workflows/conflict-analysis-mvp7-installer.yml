name: MVP7 R1 Windows setup candidate
permissions:
  contents: read
  actions: read
concurrency:
  group: mvp7-setup-${{ github.sha }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  COMMIT_C: 85a253126bf270664c4786d159994e7359b5d2c5
  TREE_C: 5567183dbe16fc6c7c8caac051b7694f37b92457
  WINDOWS11_WSL2_E2E: BLOCKED_NO_RUNNER
  CLEAN_PC_SMOKE: NOT_EXECUTED
  PARTNER_RELEASE_READY: 'false'
jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify accepted CI and exact product and installer identities
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/dshatrov7575-max/Conflict/actions/runs/35216652773 > "$RUNNER_TEMP/accepted-r1-run.json"
        python3.12 - <<'PY'
        import json,os,pathlib,sys
        sys.path.insert(0,str(pathlib.Path('software/conflict_analysis/scripts').resolve()))
        import verify_owner_alpha_package as v
        run=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'accepted-r1-run.json').read_text())
        assert run['conclusion']=='success' and run['head_sha']==v.LOCK['installer_parent']
        assert v.source_identity(pathlib.Path.cwd())['head']==os.environ['COMMIT_C']
        print('EXACT_C_AND_ONE_INSTALLER_COMMIT=PASS')
        PY
    - name: Fetch and verify all frozen external Linux inputs
      run: |
        set -euo pipefail
        python3.12 software/conflict_analysis/installer/fetch_inputs.py --output "$RUNNER_TEMP/mvp7-inputs"
        docker pull --platform linux/amd64 docker.io/library/python@sha256:2fe5997d249a808b8eeea52c58a1dbffbba28754dc11699ef5c029f2d818ce79
        docker pull --platform linux/amd64 docker.io/library/postgres@sha256:4cc13dede823cab4e05290c7fb3350fb4e599ecabd9b07e6706b5d5e8f5bc929
        python3.12 -m venv "$RUNNER_TEMP/mvp7-tooling"
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -m pip install --no-index --no-deps --require-hashes --find-links="$RUNNER_TEMP/mvp7-inputs" -r "$RUNNER_TEMP/mvp7-inputs/ci.lock"
    - name: Build exact C wheel and two byte-identical offline rootfs and ZIPs
      env:
        MVP7_INPUT_CACHE: ${{ runner.temp }}/mvp7-inputs
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -B software/conflict_analysis/scripts/build_owner_alpha_package.py --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/mvp7-inner"
    - name: Verify archives and actual Linux runtime without network
      env:
        G10_ARTIFACT_DIR: ${{ runner.temp }}/mvp7-inner
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -m pytest \
          software/conflict_analysis/installer/test_contract.py \
          software/conflict_analysis/owner_alpha_package/tests/test_manifest.py \
          software/conflict_analysis/owner_alpha_package/tests/test_linux_contract.py \
          -p no:cacheprovider -p no:django --junitxml="$RUNNER_TEMP/mvp7-inner/linux-contract.xml" -q
        "$RUNNER_TEMP/mvp7-tooling/bin/python" software/conflict_analysis/installer/report_inner.py --output "$RUNNER_TEMP/mvp7-inner"
    - name: Upload verified inner ZIP and public build evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mvp7-inner-${{ github.sha }}
        compression-level: 0
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/mvp7-inner/conflict-analysis-partner-demo-win-x64-mvp7.zip
          ${{ runner.temp }}/mvp7-inner/inner-build-report.json
          ${{ runner.temp }}/mvp7-inner/linux-contract.xml
          ${{ runner.temp }}/mvp7-inner/MVP7_PACKAGE_MANIFEST_V1.json
          ${{ runner.temp }}/mvp7-inner/SHA256SUMS
          ${{ runner.temp }}/mvp7-inner/SBOM.cdx.json
    - name: Upload failed build logs without runtime state
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mvp7-linux-failure-${{ github.sha }}
        if-no-files-found: ignore
        path: ${{ runner.temp }}/mvp7-inner/*.xml
  windows-build-contract:
    needs:
    - linux-build
    - r1-source-regressions
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: mvp7-inner-${{ github.sha }}
        path: ${{ runner.temp }}/mvp7-inner
    - name: Frozen tooling for Windows verifier only
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        python software/conflict_analysis/installer/fetch_inputs.py --windows-only --output "$env:RUNNER_TEMP/mvp7-win-inputs"
        if ($LASTEXITCODE) { throw 'Frozen Windows input verification failed' }
        python -m pip install --no-index --no-deps --require-hashes --find-links="$env:RUNNER_TEMP/mvp7-win-inputs" -r "$env:RUNNER_TEMP/mvp7-win-inputs/ci.lock"
        if ($LASTEXITCODE) { throw 'Offline verifier dependency installation failed' }
    - name: Windows contracts only; never Windows 11 E2E
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $pester=Get-Module -ListAvailable Pester | Where-Object Version -EQ '3.4.0' | Select-Object -First 1
        if (-not $pester) { throw 'Existing Pester 3.4.0 required; no prerequisite installation allowed' }
        Import-Module $pester.Path
        $out=Join-Path $env:RUNNER_TEMP 'mvp7-contract'
        $null=New-Item -ItemType Directory -Path $out
        $r=Invoke-Pester -Script @('software/conflict_analysis/owner_alpha_package/tests/OwnerAlpha.Windows.Contract.Tests.ps1','software/conflict_analysis/installer/Mvp7.Preflight.Tests.ps1') -PassThru -OutputFile "$out/pester.xml" -OutputFormat NUnitXml
        if ($r.TotalCount -ne 12 -or $r.PassedCount -ne 12 -or $r.FailedCount -ne 0 -or $r.SkippedCount -ne 0) { throw 'Inherited packaging contracts failed' }
        & software/conflict_analysis/installer/Test-Mvp7Contract.ps1 -EvidenceRoot $out -InnerZip "$env:RUNNER_TEMP/mvp7-inner/conflict-analysis-partner-demo-win-x64-mvp7.zip"
    - name: Compile NSIS twice and verify exact embedded ZIP without installing
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        python software/conflict_analysis/installer/build_setup.py --inner "$env:RUNNER_TEMP/mvp7-inner/conflict-analysis-partner-demo-win-x64-mvp7.zip" --output "$env:RUNNER_TEMP/mvp7-setup"
        if ($LASTEXITCODE) { throw 'NSIS build or embedded payload proof failed' }
    - name: Upload Setup candidate and contract evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mvp7-setup-candidate-${{ github.sha }}
        compression-level: 0
        if-no-files-found: error
        path: |
          ${{ runner.temp }}/mvp7-setup/ConflictPartnerDemo_MVP7_Setup.exe
          ${{ runner.temp }}/mvp7-setup/setup-build-report.json
          ${{ runner.temp }}/mvp7-contract/windows-contract.json
          ${{ runner.temp }}/mvp7-contract/pester.xml
    - name: Explicit remaining acceptance blocker
      if: always()
      shell: pwsh
      run: |
        @('WINDOWS11_WSL2_E2E=BLOCKED_NO_RUNNER','CLEAN_PC_SMOKE=NOT_EXECUTED','PARTNER_RELEASE_READY=false') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
  r1-source-regressions:
    name: Exact C / accepted R1 regression oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: conflict_analysis
          POSTGRES_USER: conflict_analysis
          POSTGRES_PASSWORD: analysis-r0-ci-only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U conflict_analysis -d conflict_analysis" --health-interval 5s --health-timeout 5s --health-retries
          12
    env:
      DJANGO_SECRET_KEY: analysis-r0-ci-only-secret
      POSTGRES_DB: conflict_analysis
      POSTGRES_USER: conflict_analysis
      POSTGRES_PASSWORD: analysis-r0-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_CONN_MAX_AGE: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      R1_BASE: c6c7118080ab1a1dcb86216f4092dabcf8125be7
      R1_BASE_TREE: 5a4a40431e72fb6b942b895225ce11bba2898052
      R1_COMMIT_A: ba09340fecc446f677f8b4cf0c4ba3e565ebcee5
      R1_COMMIT_B: 2731ecd26dde5f321507ca237c4d18167d8bd631
      R1_COMMIT_D: f90fb0d08fcdb897b392690e539b9032beeba205
      R1_COMMIT_D_TREE: c263f85f48aa4ecb9b60eba2afdd635d67925f28
      R1_COMMIT_E: c904577a9e046afeb9c169dd907a9b37ea26737e
      R1_COMMIT_E_TREE: f11b6e4343c56dec33f7e834b7f918a1639384dd
      R1_CHROME_VERSION: 152.0.7977.64
      R1_CHROME_LINUX64_SHA256: 8b592f066af71f054aab2cc80fc26f73c775c6d44ebb99d16ade924b24756c2e
      TESTED_SOURCE_COMMIT_C: 85a253126bf270664c4786d159994e7359b5d2c5
      TESTED_SOURCE_TREE_C: 5567183dbe16fc6c7c8caac051b7694f37b92457
      INSTALLER_COMMIT: ${{ github.sha }}
    defaults:
      run:
        working-directory: software/conflict_analysis
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: 85a253126bf270664c4786d159994e7359b5d2c5
        persist-credentials: false
    - name: Prove immutable product source C
      shell: bash
      working-directory: .
      run: |
        set -euo pipefail
        python - <<'PY'
        import os,subprocess
        from pathlib import Path
        def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
        assert git('rev-parse','HEAD')==os.environ['TESTED_SOURCE_COMMIT_C']
        assert git('rev-parse','HEAD^{tree}')==os.environ['TESTED_SOURCE_TREE_C']
        assert git('rev-parse','HEAD^')==os.environ['R1_COMMIT_B']
        assert git('rev-parse','HEAD:software/conflict_analysis/domain/migrations/0019_analysis_geography.py')=='8a2a5b3dfa750932ddb17228dfb476c5e3e88b03'
        assert not git('status','--short')
        print('EXACT_PRODUCT_C_HEAD_TREE_PARENT_MIGRATION=PASS')
        PY
    - name: Prove exact three-commit history and corrective allowlist
      shell: bash
      working-directory: .
      run: |
        set -euo pipefail
        python - <<'PY'
        import os,subprocess
        def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
        base=os.environ['R1_BASE'];first=os.environ['R1_COMMIT_A'];second=os.environ['R1_COMMIT_B']
        assert git('rev-parse',base+'^{tree}')==os.environ['R1_BASE_TREE']
        assert git('rev-parse','HEAD^')==second
        assert git('rev-parse',second+'^')==first
        assert git('rev-parse',first+'^')==base
        assert git('rev-list','--count',base+'..HEAD')=='3'
        for commit,message in ((first,'feat(geography): add append-only project location foundation'),(second,'feat(analysis): add offline project location map'),('HEAD','fix(geography): replace ODbL map data with Natural Earth')):
            assert git('show','-s','--format=%B',commit)==message
            assert len(git('show','-s','--format=%P',commit).split())==1
        paths={'A': ['.github/workflows/conflict-analysis.yml', 'software/conflict_analysis/docs/adr/0019-project-geography-r1.md', 'software/conflict_analysis/domain/api/geography_v1.py', 'software/conflict_analysis/domain/enums.py', 'software/conflict_analysis/domain/migrations/0019_analysis_geography.py', 'software/conflict_analysis/domain/models.py', 'software/conflict_analysis/domain/services/geography.py', 'software/conflict_analysis/domain/tests/fixtures/geography_v1_vectors.json', 'software/conflict_analysis/domain/tests/test_geography.py', 'software/conflict_analysis/domain/urls.py'], 'B': ['.github/workflows/conflict-analysis.yml', 'software/conflict_analysis/analysis_dashboard/browser_tests/analysis_geography_r1.mjs', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/dashboard.css', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/dashboard.js', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/BOUNDARY_POLICY_RU.md', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/DATASET_LICENSES_RU.md', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_CC_BY_4_0.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_CITATION.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_METADATA.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/NATURAL_EARTH_TERMS.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/ODBL_1_0.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/map.js', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/MAP_DATASET_MANIFEST.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/MAP_DATASET_MANIFEST.json.sha256', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/RAW_SOURCES_LOCK.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/build_dataset.py', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_admin0.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_admin0_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_disputed_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_places.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_water.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/kazakhstan_admin1.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/kazakhstan_admin1_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/labels_ru.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/map_style.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/vendor/maplibre/MAPLIBRE_LICENSE.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/vendor/maplibre/maplibre-gl-csp-worker.js', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/vendor/maplibre/maplibre-gl-csp.js', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/vendor/maplibre/maplibre-gl.css', 'software/conflict_analysis/analysis_dashboard/templates/analysis_dashboard/analytics.html', 'software/conflict_analysis/analysis_dashboard/tests/test_http.py', 'software/conflict_analysis/analysis_dashboard/views.py', 'software/conflict_analysis/pyproject.toml'], 'C': ['.github/workflows/conflict-analysis.yml', 'software/conflict_analysis/analysis_dashboard/browser_tests/analysis_geography_r1.mjs', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/BOUNDARY_POLICY_RU.md', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/DATASET_LICENSES_RU.md', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_CC_BY_4_0.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_CITATION.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_METADATA.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/ODBL_1_0.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/map.js', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/BUILDER_PATCHES_RU.md', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/BUILD_NATURAL_EARTH_R1.py', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/LABEL_OVERRIDES_RU.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/MAP_DATASET_MANIFEST.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/MAP_DATASET_MANIFEST.json.sha256', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/NATURAL_EARTH_BUILD_MANIFEST.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/NATURAL_EARTH_SOURCE_LOCK.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/RAW_SOURCES_LOCK.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/VERIFY_NATURAL_EARTH_R1_OUTPUT.py', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/build_dataset.py', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_admin0.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_admin0_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_disputed_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_places.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_water.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/kazakhstan_admin1.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/kazakhstan_admin1_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/labels_ru.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/map_style.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/test_build_dataset.py', 'software/conflict_analysis/analysis_dashboard/templates/analysis_dashboard/analytics.html', 'software/conflict_analysis/analysis_dashboard/tests/test_http.py', 'software/conflict_analysis/docs/adr/0019-project-geography-r1.md', 'software/conflict_analysis/domain/services/geography.py', 'software/conflict_analysis/domain/tests/fixtures/geography_v1_vectors.json', 'software/conflict_analysis/domain/tests/test_geography.py']}
        for before,after,key in ((base,first,'A'),(first,second,'B'),(second,'HEAD','C')):
            assert sorted(git('diff','--name-only',before,after).splitlines())==sorted(paths[key])
        assert sorted(git('diff','--diff-filter=D','--name-only',second,'HEAD').splitlines())==['software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_CC_BY_4_0.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_CITATION.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/GEOBOUNDARIES_METADATA.json', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/licenses/ODBL_1_0.txt', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_admin0_lines.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/central_asia_water.geojson', 'software/conflict_analysis/analysis_dashboard/static/analysis_dashboard/maps/kazakhstan_admin1_lines.geojson']
        assert not git('diff','--name-only',second,'HEAD','--','software/conflict_analysis/domain/models.py','software/conflict_analysis/domain/enums.py','software/conflict_analysis/domain/migrations','software/conflict_analysis/domain/api','software/conflict_analysis/production_studio','software/conflict_analysis/production_player','software/conflict_analysis/pyproject.toml')
        assert not git('diff','--name-only',base,'HEAD','--','software/conflict_analysis/production_studio','software/conflict_analysis/production_player','software/conflict_analysis/owner_alpha_package','software/conflict_analysis/scripts/build_owner_alpha_package.py','software/conflict_analysis/scripts/verify_owner_alpha_package.py','software/conflict_analysis/domain/services/player_experiments.py','software/conflict_analysis/domain/services/analysis_read_model.py','software/conflict_analysis/domain/services/analysis_admission.py','software/conflict_analysis/domain/api/analysis_v1.py','README.md')
        print('EXACT_THREE_R1_COMMITS_AND_CORRECTIVE_ALLOWLIST=PASS')
        PY
        git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "$R1_COMMIT_B" HEAD
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: software/conflict_analysis/pyproject.toml
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install and verify pinned Chrome for Testing
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/geography-chrome-linux64.zip"
        url="https://storage.googleapis.com/chrome-for-testing-public/$R1_CHROME_VERSION/linux64/chrome-linux64.zip"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --silent --show-error "$url" --output "$archive"
        printf '%s  %s\n' "$R1_CHROME_LINUX64_SHA256" "$archive" | sha256sum --check --strict -
        distribution="$(mktemp -d "$RUNNER_TEMP/geography-chrome-XXXXXX")"
        unzip -q "$archive" -d "$distribution"
        chrome="$distribution/chrome-linux64/chrome"
        test -x "$chrome"
        version="$("$chrome" --version)"
        STUDIO_CHROME_BIN="$chrome" CHROME_VERSION_OUTPUT="$version" python - <<'PY'
        import json,os,re
        from pathlib import Path
        version=os.environ['R1_CHROME_VERSION'];actual=os.environ['CHROME_VERSION_OUTPUT']
        assert re.search(r'(?<![\d.])'+re.escape(version)+r'(?![\d.])',actual),actual
        proof={'version':version,'version_output':actual,
               'archive_url':f'https://storage.googleapis.com/chrome-for-testing-public/{version}/linux64/chrome-linux64.zip',
               'archive_sha256':os.environ['R1_CHROME_LINUX64_SHA256'],
               'sha256_verified_before_extract':True,'STUDIO_CHROME_BIN':os.environ['STUDIO_CHROME_BIN'],
               'INSTALLER_COMMIT':os.environ['INSTALLER_COMMIT'],
               'TESTED_SOURCE_COMMIT_C':os.environ['TESTED_SOURCE_COMMIT_C']}
        (Path(os.environ['RUNNER_TEMP'])/'geography-chrome-identity.json').write_text(json.dumps(proof,sort_keys=True,indent=2)+'\n',encoding='utf8')
        print(json.dumps(proof,sort_keys=True))
        PY
        echo "STUDIO_CHROME_BIN=$chrome" >> "$GITHUB_ENV"
    - name: Install application and validate static sources
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check -e ".[dev]"
