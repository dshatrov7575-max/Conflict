        forbidden={'cookies','cookie','session_key','session_keys','django_secret','environment','env','headers','body','argv','sql','traceback','stdout_text','stderr_text'}
        def check(value):
            if isinstance(value,dict):
                assert not forbidden.intersection(k.lower() for k in value)
                for key,child in value.items():
                    if key in ('stdout','stderr') and child is not None:
                        assert set(child)=={'bytes','sha256'} and type(child['bytes']) is int and child['bytes']>=0 and re.fullmatch('[0-9a-f]{64}',child['sha256'])
