    - name: Self-test raw pipe observation on Linux without starting runtime
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/mvp7-tooling/bin/python" -B - <<'PY'
        import ast,hashlib,importlib.util,os,subprocess,sys
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        spec=importlib.util.spec_from_file_location('observer_self_test',root/'diagnostic-harness/sitecustomize.py');observer=importlib.util.module_from_spec(spec);spec.loader.exec_module(observer)
        script=(root/'exact-b/software/conflict_analysis/owner_alpha_package/linux/owner-alpha-supervisor.sh').read_text();prefix,body=script.split("<<'PY'\n",1)
        nodes=[n for n in ast.parse(body.rsplit('\nPY',1)[0]).body if isinstance(n,(ast.ClassDef,ast.FunctionDef)) and n.name in ('Halt','need','execute')]
        namespace={'subprocess':subprocess};exec(compile(ast.Module(body=nodes,type_ignores=[]),'<stdin>','exec'),namespace)
        observer.offset=prefix.count('\n')+1;observer.streams={};observer.exceptions={};observer.fatal=None;observer.failed_command=None;observer.trace_fault=False
        observer.command_phase=lambda args:'GUNICORN_START'
        namespace['args']=[sys.executable,'-c',"import os;os.write(1,b'PIPE_OUT\\r\\n');os.write(2,b'PIPE_ERR\\r\\n');raise SystemExit(7)"]
        sys.settrace(observer.trace)
        try:exec(compile('try:\n    execute(args)\nexcept Halt:\n    pass\n','<stdin>','exec'),namespace)
        finally:sys.settrace(None)
        assert not observer.trace_fault and observer.failed_command['exit_code']==7
        for name,data in [('stdout',b'PIPE_OUT\r\n'),('stderr',b'PIPE_ERR\r\n')]:
            assert observer.failed_command[name]=={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
        assert observer.fatal['line']==next(i+1 for i,line in enumerate(script.splitlines()) if 'need(result.returncode==0' in line)
        print('REAL_POSIX_RAW_PIPE_HASHES_AND_EXACT_SOURCE_LINE=PASS')
        PY
