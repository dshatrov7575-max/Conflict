name: AI-only primary cohort executor R1

on:
  push:
    branches:
      - review/ai-only-research-beta-v1
    paths:
      - ".github/ai-only-primary-executor-trigger.txt"

permissions:
  contents: write

env:
  COPILOT_CLI_VERSION: "1.0.89"
  COPILOT_CLI_URL: "https://github.com/github/copilot-cli/releases/download/v1.0.89/copilot-linux-x64.tar.gz"
  COPILOT_CLI_SHA256: "c5c234ccba6fae2b7a9eae462caf628e86c21b5e6240ec2e885727fc148a1dcc"

jobs:
  primary:
    name: "${{ matrix.role }} / ${{ matrix.model }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: KBM_COMPANY_E02_V100_AI1
            model: gpt-5.6-sol
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e02_v1_0_0/06_AI1_STANDALONE_RU.md
            packet_blob: 4d894bf841912788ec534904c05f53a3076bee3b
            output: KBM_E02_V100_AI1_COMPLETED.json
          - role: KBM_COMPANY_E02_V100_AI2
            model: claude-fable-5-1
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e02_v1_0_0/07_AI2_STANDALONE_RU.md
            packet_blob: 64d02513711034941da014bd40024e506a68b020
            output: KBM_E02_V100_AI2_COMPLETED.json
          - role: OMG_NOV24_V100_AI1
            model: gpt-5.6-sol
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/omg_e02_nov24_v1_0_0/06_AI1_STANDALONE_RU.md
            packet_blob: 83473066a90daf00bc2a9413cb0175d25f54b60a
            output: OMG_NOV24_V100_AI1_COMPLETED.json
          - role: OMG_NOV24_V100_AI2
            model: claude-fable-5-1
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/omg_e02_nov24_v1_0_0/07_AI2_STANDALONE_RU.md
            packet_blob: b8a18c8a553e1e6f1efee2bfbe4d348619795d59
            output: OMG_NOV24_V100_AI2_COMPLETED.json
          - role: KBM_E05_V100_AI1
            model: gpt-5.6-sol
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e05_v1_0_0/06_AI1_STANDALONE_RU.md
            packet_blob: bd1d89ac5b0aa046e8d4498cb3b19031dd2c60af
            output: KBM_E05_V100_AI1_COMPLETED.json
          - role: KBM_E05_V100_AI2
            model: claude-fable-5-1
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/kbm_e05_v1_0_0/07_AI2_STANDALONE_RU.md
            packet_blob: 0a39088aaa78bbf3c1a5e7300e1f3fe23e25438c
            output: KBM_E05_V100_AI2_COMPLETED.json
          - role: D25_E02_V100_AI1
            model: gpt-5.6-sol
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/d25_e02_v1_0_0/06_AI1_STANDALONE_RU.md
            packet_blob: 2b0dcd8ee954f68d74b11b8bcbf299dfb9e2da33
            output: D25_E02_V100_AI1_COMPLETED.json
          - role: D25_E02_V100_AI2
            model: claude-fable-5-1
            packet: docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/episode_input_v1/d25_e02_v1_0_0/07_AI2_STANDALONE_RU.md
            packet_blob: 2911bd6975184b9d9f1faf2aa235d6322eae7152
            output: D25_E02_V100_AI2_COMPLETED.json

    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require executor credential
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COPILOT_GITHUB_TOKEN" || {
            echo "COPILOT_GITHUB_TOKEN is absent; primary execution is blocked." >&2
            exit 20
          }

      - name: Verify exact frozen standalone blob
        run: |
          set -euo pipefail
          actual="$(git hash-object "${{ matrix.packet }}")"
          test "$actual" = "${{ matrix.packet_blob }}" || {
            echo "Frozen packet blob mismatch: $actual" >&2
            exit 21
          }

      - name: Install pinned Copilot CLI binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/copilot-linux-x64.tar.gz"
          install_dir="$RUNNER_TEMP/copilot-cli"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error "$COPILOT_CLI_URL" --output "$archive"
          echo "$COPILOT_CLI_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$install_dir"
          bin="$(find "$install_dir" -maxdepth 3 -type f -name copilot -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          echo "COPILOT_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Run one isolated blind primary
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          ROLE: ${{ matrix.role }}
          MODEL: ${{ matrix.model }}
          PACKET: ${{ matrix.packet }}
          OUTPUT: ${{ matrix.output }}
        run: |
          set -euo pipefail
          isolated="$RUNNER_TEMP/isolated-$ROLE"
          export COPILOT_HOME="$RUNNER_TEMP/copilot-home-$ROLE"
          mkdir -p "$isolated" "$COPILOT_HOME" "$GITHUB_WORKSPACE/_primary_output" "$GITHUB_WORKSPACE/_executor_status"

          prompt="$(cat "$GITHUB_WORKSPACE/$PACKET")"
          raw="$RUNNER_TEMP/$OUTPUT"
          stderr_file="$RUNNER_TEMP/$ROLE.stderr"

          cd "$isolated"
          set +e
          "$COPILOT_BIN" -s -p "$prompt" --model "$MODEL" --no-ask-user --available-tools='read' > "$raw" 2> "$stderr_file"
          rc=$?
          set -e

          python - "$GITHUB_WORKSPACE/_executor_status/$ROLE.json" "$rc" "$ROLE" "$MODEL" "$PACKET" "$OUTPUT" "$COPILOT_CLI_VERSION" "$COPILOT_CLI_SHA256" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json, pathlib, sys
          out, rc, role, model, packet, output, cli_version, cli_sha, run_id, attempt = sys.argv[1:]
          payload = {
              "schema": "COPILOT_CLI_PRIMARY_EXECUTION_STATUS_R1",
              "role": role,
              "model_pin": model,
              "packet": packet,
              "expected_output": output,
              "copilot_cli_version": cli_version,
              "copilot_cli_linux_x64_sha256": cli_sha,
              "github_run_id": run_id,
              "github_run_attempt": attempt,
              "copilot_exit_code": int(rc),
              "primary_output_created": int(rc) == 0,
              "model_substitution": False,
              "retry_count": 0,
              "working_directory_scope": "EMPTY_RUNNER_TEMP",
              "available_tools": ["read"],
          }
          pathlib.Path(out).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          if test "$rc" -eq 0; then
            cp "$raw" "$GITHUB_WORKSPACE/_primary_output/$OUTPUT"
          else
            echo "Copilot primary call failed for $ROLE with exit code $rc." >&2
            exit "$rc"
          fi

      - name: Upload immutable primary/output status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-${{ matrix.role }}
          path: |
            _primary_output
            _executor_status
          if-no-files-found: error

  aggregate:
    name: Deterministic intake and cohort comparison
    if: always()
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download all primary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: primary-*
          path: ${{ runner.temp }}/downloaded
          merge-multiple: true

      - name: Collect raw primary files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inbox" "$RUNNER_TEMP/status"
          find "$RUNNER_TEMP/downloaded" -type f -name '*_COMPLETED.json' -exec cp {} "$RUNNER_TEMP/inbox/" \;
          find "$RUNNER_TEMP/downloaded" -type f -name '*.json' -path '*/_executor_status/*' -exec cp {} "$RUNNER_TEMP/status/" \; || true
          echo "PRIMARY_OUTPUT_COUNT=$(find "$RUNNER_TEMP/inbox" -maxdepth 1 -type f -name '*_COMPLETED.json' | wc -l)" >> "$GITHUB_ENV"

      - name: Run frozen cohort intake/orchestrator
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/derived"
          mkdir -p "$out"
          python docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/cohort_execution_r1/intake_and_compare_r1.py --repo-root . --input-dir "$RUNNER_TEMP/inbox" --out-dir "$out"
          echo "DERIVED_DIR=$out" >> "$GITHUB_ENV"

      - name: Assemble immutable run record
        run: |
          set -euo pipefail
          run_dir="docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1/runs/COHORT_R1_ACTIONS_${GITHUB_RUN_ID}"
          mkdir -p "$run_dir/primary" "$run_dir/executor_status" "$run_dir/derived"
          cp "$RUNNER_TEMP"/inbox/* "$run_dir/primary/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/status/* "$run_dir/executor_status/" 2>/dev/null || true
          cp "$DERIVED_DIR"/* "$run_dir/derived/" 2>/dev/null || true

          python - "$run_dir/EXECUTOR_RUN_RECEIPT.json" "$PRIMARY_OUTPUT_COUNT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          out, count, run_id, attempt, trigger_sha = sys.argv[1:]
          payload = {
              "schema": "AI_ONLY_COHORT_EXECUTOR_RUN_RECEIPT_R1",
              "cohort_id": "AI_ONLY_REPLICATION_COHORT_R1_20260930",
              "github_run_id": run_id,
              "github_run_attempt": attempt,
              "trigger_sha": trigger_sha,
              "expected_primary_outputs": 8,
              "observed_primary_outputs": int(count),
              "ai1_model_pin": "gpt-5.6-sol",
              "ai2_model_pin": "claude-fable-5-1",
              "copilot_cli_version": "1.0.89",
              "copilot_cli_linux_x64_sha256": "c5c234ccba6fae2b7a9eae462caf628e86c21b5e6240ec2e885727fc148a1dcc",
              "model_substitution": False,
              "coordinator_adjudication": False,
              "auto_merge": False,
              "core_replay_performed": False,
          }
          pathlib.Path(out).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          echo "RUN_DIR=$run_dir" >> "$GITHUB_ENV"

      - name: Commit run record to research branch
        env:
          TARGET_BRANCH: review/ai-only-research-beta-v1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR"
          if git diff --cached --quiet; then
            echo "No run record changes."
            exit 0
          fi
          git commit -m "Record AI-only cohort primary run $GITHUB_RUN_ID"
          git push origin "HEAD:$TARGET_BRANCH"
