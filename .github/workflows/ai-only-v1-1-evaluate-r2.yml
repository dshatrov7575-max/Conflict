name: AI-only V1.1 technical repair evaluation R2

on:
  push:
    branches:
      - review/ai-only-research-beta-v1-1-fast-repair
    paths:
      - ".github/workflows/ai-only-v1-1-evaluate-r2.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Deterministic V1.1 evaluation R2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact evaluation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact frozen inputs and evaluators
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || {
              echo "Blob mismatch for $path: expected=$expected actual=$actual" >&2
              exit 21
            }
          }
          root=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR
          r1=docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1
          check_blob "$root/PROTOCOL_FREEZE_R1.md" 1981e1f45143723f1dfa9c1ded1966047af96719
          check_blob "$root/CARRY_FORWARD_MANIFEST_R1.json" fce96fefd7bb9d6626a33bed6fdddbe4f81197c2
          check_blob "$root/MODEL_B_SUBSTITUTION_GEMINI31PRO_R2.md" e54564a21d9100e847fda50ca32b127182d6cb9c
          check_blob "$root/omg_nov24_v1_0_1/06_AI1_STANDALONE_RU.md" 225bf43b4e90b1c049f136c77e7f2ce1c53aa0e3
          check_blob "$root/omg_nov24_v1_0_1/07_AI2_STANDALONE_RU.md" 9a5f103db14541c7379444886bc83b386224cacf
          check_blob "$root/omg_nov24_v1_0_1/compare_primary_v101.py" 3f62d8e164c48d1e0802f6a880000e927c7f7955
          check_blob "$root/aggregate_cohort_v101.py" 2aabe293a365ad5d5b811a569bcfefa7a97ece83
          check_blob "$root/evaluate_route_v101.py" 9712e3ce028c1d617ec529c76deb9234cc4ce424
          check_blob "$root/raw/OMG_NOV24_V101_AI1_COMPLETED.json" 2c8c0576ec85ce6934e6c6605932f082fac03ca4
          check_blob "$root/raw/OMG_NOV24_V101_AI2_COMPLETED.json" 39606ae15758a2c66d26d62485719287e9981f60
          check_blob "$r1/executors/manual_dual_model_r1/derived/KBM_E02_V100_PRIMARY_COMPARISON.json" 2ea59f263ac83f34e458272d10202dc0b2829131
          check_blob "$r1/executors/manual_dual_model_r1/derived/KBM_E05_V100_PRIMARY_COMPARISON.json" 056e3bbda09afc2738fba82cce354a8a5f4a0a1e
          check_blob "$r1/executors/manual_dual_model_r1/derived/D25_E02_V100_PRIMARY_COMPARISON.json" e6dd3b0eca82496278417ddd7af91f0f8b9b7e3a
          check_blob "$r1/eligible_replay_r1/run_36844856009/ELIGIBLE_REPLAY_RESULT_R1.json" 1eb6d50e8ae8ba2e579ae3048cc622f59e1641a9
          check_blob "$r1/release_gate_r1/evaluate_release_gate_r1.py" 71bcfd8dd259364df6140be358ad265ce653443d

      - name: Compare, aggregate, and evaluate frozen release gate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v1-1-evaluation-r2"
          python docs/scientific/ai_only/AI_ONLY_RESEARCH_BETA_V1_1_TECHNICAL_REPAIR/evaluate_route_v101.py \
            --repo-root . \
            --out "$out" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/v1-1-summary.json"

      - name: Upload immutable V1.1 evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-only-v1-1-evaluation-r2
          path: ${{ runner.temp }}/v1-1-evaluation-r2/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve release boundary
        shell: bash
        run: |
          echo 'R1_RAW_OUTPUTS_EDITED=false'
          echo 'OLD_OMG_KVS5_POL50_RESTORED=false'
          echo 'OMG_V101_CORE_REPLAY_EXECUTED=false'
          echo 'HISTORICAL_AREA_UNO_COMPUTED=false'
          echo 'HUMAN_VALIDATION_PERFORMED=false'
          echo 'AUTO_MERGE=false'
