# Temporary MAIN-authorized one-file recovery builder. Must never enter canonical R2.
name: C2A R2 C1 Chromium observer stabilization builder
'on':
  push:
    branches:
      - agent/c2a-r2-c1-chromium-observer-stabilization-builder-20260914
permissions:
  contents: write
concurrency:
  group: c2a-r2-c1-chromium-observer-stabilization-builder
  cancel-in-progress: false
jobs:
  build-staging-sibling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact one-file R2 sibling from immutable R1
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=244562c24cef21aa38b30d0b394c5706632876c8
          SOURCE_TREE=fb9660304decfb51a100befb73688466f861fa5c
          R1=22f0f173a941de88d6920b6e19821168e9b30cc8
          G9=561ef5327bf655a558adb21c54d0fdf0559d7024
          TARGET=software/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs
          SOURCE_BLOB=6ce3fededdae818d0b13b92ebc04bfff982e5162
          STAGING_BRANCH=agent/c2a-r2-c1-chromium-observer-stabilization-staging-20260914

          git config user.name "OpenAI MAIN recovery"
          git config user.email "openai-main@users.noreply.github.com"
          test "$(git rev-parse "$SOURCE^{tree}")" = "$SOURCE_TREE"
          test "$(git rev-parse "$SOURCE^1")" = "$R1"
          test "$(git rev-parse "$R1^1")" = "$G9"
          test "$(git rev-parse "$SOURCE:$TARGET")" = "$SOURCE_BLOB"

          git show "$SOURCE:$TARGET" > "$TARGET"
          python - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              assert count == 1, (old[:80], count)
              text = text.replace(old, new, 1)

          replace_once(
              '''  let bootstrapDetail;\n  let destination;\n  let pendingDestinationLoad;\n''',
              '''  let bootstrapDetail;\n  let destination;\n  let entryReplaySeen = false;\n  let entryReplayLoaderId = expectation.entryLoaderId;\n  let pendingDestinationLoad;\n''',
          )

          replace_once(
              '''      try {\n        destination = validateBootstrapDestinationNavigation({ expectation, eventSessionId, params });\n        consumeDestinationLoad();\n      } catch {\n''',
              '''      try {\n        if (eventSessionId !== expectation.sessionId) {\n          throw bootstrapObserverError("DESTINATION_SESSION_MISMATCH");\n        }\n        const frame = params.frame;\n        if (frame?.id !== expectation.frameId) {\n          throw bootstrapObserverError("DESTINATION_FRAME_MISMATCH");\n        }\n        const frameUrl = new URL(frame.url).href;\n        if (!destination && frameUrl === expectation.entryUrl) {\n          if (!frame.loaderId || entryReplaySeen) {\n            throw bootstrapObserverError("ENTRY_REPLAY_MISMATCH");\n          }\n          entryReplaySeen = true;\n          entryReplayLoaderId = frame.loaderId;\n          if (pendingDestinationLoad?.params?.loaderId === entryReplayLoaderId) {\n            pendingDestinationLoad = undefined;\n          }\n          return;\n        }\n        destination = validateBootstrapDestinationNavigation({ expectation, eventSessionId, params });\n        if (destination.loaderId === entryReplayLoaderId) {\n          throw bootstrapObserverError("DESTINATION_LOADER_REUSED");\n        }\n        consumeDestinationLoad();\n      } catch {\n''',
          )

          replace_once(
              '''        if (!destination) {\n          if (eventSessionId !== expectation.sessionId) {\n            throw bootstrapObserverError("DESTINATION_LOAD_SESSION_MISMATCH");\n          }\n          pendingDestinationLoad = { eventSessionId, params };\n          return;\n        }\n''',
              '''        if (!destination) {\n          if (eventSessionId !== expectation.sessionId) {\n            throw bootstrapObserverError("DESTINATION_LOAD_SESSION_MISMATCH");\n          }\n          if (\n            params.loaderId === expectation.entryLoaderId ||\n            (entryReplaySeen && params.loaderId === entryReplayLoaderId)\n          ) {\n            return;\n          }\n          pendingDestinationLoad = { eventSessionId, params };\n          return;\n        }\n''',
          )

          replace_once(
              '''  let destination;\n  let entryReplaySeen = false;\n  let context;\n  let readyDetail;\n''',
              '''  let destination;\n  let entryReplaySeen = false;\n  let entryReplayLoaderId = expectation.entryLoaderId;\n  let context;\n  let readyDetail;\n''',
          )

          replace_once(
              '''        if (!destination && frame?.id === expectation.frameId && frameUrl === expectation.entryUrl) {\n          if (frame.loaderId !== expectation.entryLoaderId || entryReplaySeen) {\n            throw authoringReadyError("UNEXPECTED_NAVIGATION");\n          }\n          entryReplaySeen = true;\n          return;\n        }\n''',
              '''        if (!destination && frame?.id === expectation.frameId && frameUrl === expectation.entryUrl) {\n          if (!frame.loaderId || entryReplaySeen) {\n            throw authoringReadyError("UNEXPECTED_NAVIGATION");\n          }\n          entryReplaySeen = true;\n          entryReplayLoaderId = frame.loaderId;\n          return;\n        }\n''',
          )

          replace_once(
              '''          !frame.loaderId ||\n          frame.loaderId === expectation.entryLoaderId\n        ) {\n''',
              '''          !frame.loaderId ||\n          frame.loaderId === entryReplayLoaderId\n        ) {\n''',
          )

          replace_once(
              '''  const lifecycleFirst = createBootstrapObserver(expectation, { timeoutMs: 50 });\n  lifecycleFirst.observeLifecycle(\n    { name: "load", frameId: expectation.frameId, loaderId: "self-check-loader" },\n    expectation.sessionId,\n  );\n  lifecycleFirst.observeNavigation(destination, expectation.sessionId);\n  lifecycleFirst.observeBinding(binding(), expectation.sessionId);\n  assert.deepEqual((await lifecycleFirst.promise).detail, detail);\n\n''',
              '''  const lifecycleFirst = createBootstrapObserver(expectation, { timeoutMs: 50 });\n  lifecycleFirst.observeLifecycle(\n    { name: "load", frameId: expectation.frameId, loaderId: "self-check-loader" },\n    expectation.sessionId,\n  );\n  lifecycleFirst.observeNavigation(destination, expectation.sessionId);\n  lifecycleFirst.observeBinding(binding(), expectation.sessionId);\n  assert.deepEqual((await lifecycleFirst.promise).detail, detail);\n\n  const freshEntryNavigation = {\n    frame: {\n      id: expectation.frameId,\n      loaderId: "self-check-fresh-entry-loader",\n      url: expectation.entryUrl,\n    },\n  };\n  const freshEntryReplayObserver = createBootstrapObserver(expectation, { timeoutMs: 50 });\n  freshEntryReplayObserver.observeBinding(binding(), expectation.sessionId);\n  freshEntryReplayObserver.observeLifecycle(\n    { name: "load", frameId: expectation.frameId, loaderId: freshEntryNavigation.frame.loaderId },\n    expectation.sessionId,\n  );\n  freshEntryReplayObserver.observeNavigation(freshEntryNavigation, expectation.sessionId);\n  freshEntryReplayObserver.observeNavigation(destination, expectation.sessionId);\n  freshEntryReplayObserver.observeLifecycle(\n    { name: "load", frameId: expectation.frameId, loaderId: destination.frame.loaderId },\n    expectation.sessionId,\n  );\n  assert.deepEqual((await freshEntryReplayObserver.promise).detail, detail);\n\n  const duplicateFreshEntryReplayObserver = createBootstrapObserver(expectation, { timeoutMs: 50 });\n  duplicateFreshEntryReplayObserver.observeNavigation(freshEntryNavigation, expectation.sessionId);\n  duplicateFreshEntryReplayObserver.observeNavigation(freshEntryNavigation, expectation.sessionId);\n  await assert.rejects(duplicateFreshEntryReplayObserver.promise, /destination-rejected/);\n\n''',
          )

          replace_once(
              '''  const entryReplayNavigation = {\n    frame: {\n      id: expectation.frameId,\n      loaderId: expectation.entryLoaderId,\n      url: expectation.entryUrl,\n    },\n  };\n\n''',
              '''  const entryReplayNavigation = {\n    frame: {\n      id: expectation.frameId,\n      loaderId: expectation.entryLoaderId,\n      url: expectation.entryUrl,\n    },\n  };\n  const freshEntryReplayNavigation = {\n    frame: {\n      ...entryReplayNavigation.frame,\n      loaderId: "self-check-fresh-entry-loader",\n    },\n  };\n\n''',
          )

          replace_once(
              '''  const wrongEntryLoader = createDestinationAuthoringReadyGuard(readyExpectation, { timeoutMs: 50 });\n  wrongEntryLoader.observeNavigation(\n    { frame: { ...entryReplayNavigation.frame, loaderId: "self-check-wrong-entry-loader" } },\n    expectation.sessionId,\n  );\n  await assert.rejects(wrongEntryLoader.promise, /authoring-ready-navigation-rejected/);\n\n''',
              '''  const freshEntryReplayReady = createDestinationAuthoringReadyGuard(readyExpectation, { timeoutMs: 50 });\n  freshEntryReplayReady.observeNavigation(freshEntryReplayNavigation, expectation.sessionId);\n  assert.equal(freshEntryReplayReady.destination, undefined);\n  freshEntryReplayReady.observeNavigation(readyNavigation, expectation.sessionId);\n  freshEntryReplayReady.acceptContext(readyContext);\n  freshEntryReplayReady.acceptReady(readyDetail);\n  assert.deepEqual((await freshEntryReplayReady.promise).detail, readyDetail);\n\n''',
          )

          replace_once(
              '''  const entryLoaderAsDestination = createDestinationAuthoringReadyGuard(readyExpectation, { timeoutMs: 50 });\n  entryLoaderAsDestination.observeNavigation(\n    { frame: { ...destination.frame, loaderId: expectation.entryLoaderId } },\n    expectation.sessionId,\n  );\n  await assert.rejects(entryLoaderAsDestination.promise, /authoring-ready-navigation-rejected/);\n\n''',
              '''  const entryLoaderAsDestination = createDestinationAuthoringReadyGuard(readyExpectation, { timeoutMs: 50 });\n  entryLoaderAsDestination.observeNavigation(\n    { frame: { ...destination.frame, loaderId: expectation.entryLoaderId } },\n    expectation.sessionId,\n  );\n  await assert.rejects(entryLoaderAsDestination.promise, /authoring-ready-navigation-rejected/);\n\n  const freshEntryLoaderAsDestination = createDestinationAuthoringReadyGuard(readyExpectation, { timeoutMs: 50 });\n  freshEntryLoaderAsDestination.observeNavigation(freshEntryReplayNavigation, expectation.sessionId);\n  freshEntryLoaderAsDestination.observeNavigation(\n    { frame: { ...destination.frame, loaderId: freshEntryReplayNavigation.frame.loaderId } },\n    expectation.sessionId,\n  );\n  await assert.rejects(freshEntryLoaderAsDestination.promise, /authoring-ready-navigation-rejected/);\n\n''',
          )

          assert 'STUDIO_CDP_TIMEOUT_MS", "60000"' in text
          assert 'assertSingleBootstrapWrite(2)' in text
          assert 'freshEntryReplayObserver' in text
          assert 'freshEntryReplayReady' in text
          assert 'freshEntryLoaderAsDestination' in text
          path.write_text(text, encoding="utf-8")
          PY

          node --check "$TARGET"
          node "$TARGET" --self-check-observation
          test "$(git diff --name-only "$SOURCE" -- "$TARGET")" = "$TARGET"
          new_blob="$(git hash-object -w "$TARGET")"
          test "$new_blob" != "$SOURCE_BLOB"

          export GIT_INDEX_FILE="$RUNNER_TEMP/c2a-r2-stabilization.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$SOURCE^{tree}"
          git update-index --add --cacheinfo 100644 "$new_blob" "$TARGET"
          new_tree="$(git write-tree)"
          test "$new_tree" != "$SOURCE_TREE"

          source_vs_new="$(git diff --name-status "$SOURCE_TREE" "$new_tree")"
          test "$source_vs_new" = $'M\tsoftware/conflict_analysis/production_studio/browser_tests/audited_authoring.mjs'

          export GIT_AUTHOR_NAME="OpenAI MAIN recovery"
          export GIT_AUTHOR_EMAIL="openai-main@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          new_commit="$(printf '%s\n' 'C2A R2: stabilize inherited Chromium observer race' | git commit-tree "$new_tree" -p "$R1")"
          test "$(git rev-parse "$new_commit^1")" = "$R1"
          test "$(git rev-parse "$new_commit^{tree}")" = "$new_tree"

          test "$(git diff --name-status "$R1" "$new_commit")" = "$(git diff --name-status "$R1" "$SOURCE")"
          test "$(git diff --name-status "$G9" "$new_commit")" = "$(git diff --name-status "$G9" "$SOURCE")"
          test "$(git rev-list --count "$R1..$new_commit")" = 1
          test "$(git rev-list --count "$G9..$new_commit")" = 2

          if git ls-remote --exit-code --heads origin "$STAGING_BRANCH" >/dev/null 2>&1; then
            echo "staging branch already exists" >&2
            exit 1
          fi
          git push origin "$new_commit:refs/heads/$STAGING_BRANCH"
          echo "C2A_STABILIZED_HEAD=$new_commit"
          echo "C2A_STABILIZED_TREE=$new_tree"
          echo "C2A_STABILIZED_AUDITED_AUTHORING_BLOB=$new_blob"
          echo "C2A_STABILIZATION_SCOPE=ONE_FILE"
